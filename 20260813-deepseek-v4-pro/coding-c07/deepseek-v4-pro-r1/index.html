<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 数据可视化地球仪</title>
<style>
  :root {
    --bg: #04070f;
    --panel: rgba(8, 14, 28, 0.78);
    --panel-border: rgba(100, 150, 230, 0.22);
    --text: #dce7ff;
    --muted: #8ea4cc;
    --accent: #3fc1ff;
    --accent2: #7c4dff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* ---------- loading ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 35%, #0a1730 0%, #04070f 70%);
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .earth-loader {
    width: 74px; height: 74px; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 30%, rgba(120,210,255,0.95) 0 7px, transparent 8px),
      radial-gradient(circle at 62% 58%, rgba(90,220,170,0.95) 0 10px, transparent 11px),
      radial-gradient(circle at 45% 72%, rgba(110,180,250,0.9) 0 6px, transparent 7px),
      radial-gradient(circle at 75% 30%, rgba(80,190,140,0.9) 0 8px, transparent 9px),
      linear-gradient(145deg, #123f7a, #071a38 55%, #0a2a55);
    box-shadow: 0 0 32px rgba(63,193,255,0.55), inset -8px -8px 24px rgba(0,0,0,0.45);
    animation: spin 1.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading h1 { font-size: 20px; letter-spacing: 2px; font-weight: 600; }
  #loading p { color: var(--muted); font-size: 13px; min-height: 20px; }

  /* ---------- control panel ---------- */
  #panel {
    position: fixed; left: 16px; top: 16px; z-index: 30;
    width: 284px; max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    scrollbar-width: thin;
  }
  #panel::-webkit-scrollbar { width: 4px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(120,160,230,0.35); border-radius: 2px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #bdf3ff, #3fc1ff 55%, #1650b0);
    box-shadow: 0 0 10px #3fc1ff;
  }
  .section { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(110,150,220,0.16); }
  .section-title { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
  .metric-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .metric-btn {
    background: rgba(20, 32, 58, 0.8);
    color: var(--text);
    border: 1px solid rgba(100,150,230,0.25);
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .metric-btn small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
  .metric-btn:hover { border-color: rgba(63,193,255,0.7); }
  .metric-btn.active {
    background: linear-gradient(135deg, rgba(63,193,255,0.22), rgba(124,77,255,0.22));
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(63,193,255,0.25), inset 0 0 12px rgba(63,193,255,0.1);
  }
  #metric-desc { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.5; min-height: 32px; }

  #time-label { float: right; color: var(--accent); font-weight: 600; letter-spacing: 1px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .time-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .play-btn {
    background: linear-gradient(135deg, #1c9be8, #6a4bf0);
    border: 0; color: #fff; border-radius: 8px;
    padding: 7px 14px; font-size: 12px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(63,193,255,0.35);
  }
  .play-btn:hover { filter: brightness(1.12); }
  .play-speed { font-size: 11px; color: var(--muted); }

  .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .toggle-grid label {
    display: flex; align-items: center; gap: 7px;
    background: rgba(20,32,58,0.7);
    border: 1px solid rgba(100,150,230,0.2);
    border-radius: 8px; padding: 7px 8px;
    font-size: 12px; cursor: pointer;
  }
  .toggle-grid input { accent-color: var(--accent); }

  #legend-bar {
    height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, #123a75, #237db1, #2fc6a3, #f5d547, #e4482f);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .legend-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; margin-top: 4px; }

  .hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(110,150,220,0.16); font-size: 11px; color: var(--muted); line-height: 1.7; }
  #status-msg { margin-top: 10px; font-size: 10px; color: #6f86ac; line-height: 1.5; word-break: break-all; }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 45; pointer-events: none;
    min-width: 170px; max-width: 250px;
    background: rgba(6, 12, 26, 0.92);
    border: 1px solid rgba(63,193,255,0.4);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #tooltip.visible { opacity: 1; transform: translateY(0); }
  .tt-title { color: #9adcff; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
  .tt-row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); margin-top: 3px; }
  .tt-row b { color: var(--text); font-weight: 600; }

  /* ---------- city popup ---------- */
  #popup {
    position: fixed; z-index: 50;
    width: 270px;
    background: rgba(7, 13, 28, 0.94);
    border: 1px solid rgba(63,193,255,0.45);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.6), 0 0 24px rgba(63,193,255,0.12);
    transform: translate(-50%, -112%);
    transition: opacity 0.15s ease;
  }
  #popup::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: rgba(63,193,255,0.45);
  }
  #popup.hidden { opacity: 0; pointer-events: none; }
  #popup-close {
    position: absolute; right: 8px; top: 8px;
    width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: rgba(120,150,220,0.18); color: var(--muted); cursor: pointer;
  }
  #popup-close:hover { background: rgba(255,90,90,0.4); color: #fff; }
  .pop-title { font-size: 16px; font-weight: 700; padding-right: 24px; }
  .pop-sub { color: var(--muted); font-size: 11px; margin: 4px 0 10px; }
  .pop-metric {
    background: linear-gradient(135deg, rgba(63,193,255,0.16), rgba(124,77,255,0.16));
    border: 1px solid rgba(63,193,255,0.35);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 10px;
  }
  .pop-metric .k { font-size: 10px; color: var(--muted); }
  .pop-metric .v { font-size: 18px; font-weight: 700; color: #9adcff; margin-top: 2px; }
  .pop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pop-cell { background: rgba(20,32,58,0.6); border-radius: 7px; padding: 6px 8px; }
  .pop-cell .k { font-size: 10px; color: var(--muted); }
  .pop-cell .v { font-size: 12px; font-weight: 600; margin-top: 2px; }

  @media (max-width: 760px) {
    #panel { width: 232px; padding: 12px; left: 8px; top: 8px; }
    #popup { width: 240px; }
  }
</style>

<div id="app">

        <button class="metric-btn" data-metric="flights">航班量<small>航线热度</small></button>
        <button class="metric-btn" data-metric="co2">碳排放<small>CO₂ 强度</small></button>
      </div>
      <div id="metric-desc">GDP 热力着色：国家/地区经济总量，城市光点大小代表经济体量。</div>
    </div>

    <div class="section">

      <input type="range" id="time-slider" min="0" max="23" step="1" value="0">

      </div>
    </div>

    <div class="section">

      <div class="toggle-grid">

        <label><input type="checkbox" id="atmo-toggle" checked> 大气光晕</label>
        <label><input type="checkbox" id="heat-toggle" checked> 热力图层</label>
        <label><input type="checkbox" id="arc-toggle" checked> 航线图层</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">热力色阶</div>
      <div id="legend-bar"></div>
      <div class="legend-labels"><span>低</span><span>高</span></div>
    </div>

    <div class="hint">
      🖱 拖拽旋转地球 &nbsp;·&nbsp; 滚轮缩放<br>
      📍 点击城市查看数据弹窗<br>
      ✈ 悬停航线查看航班信息
    </div>
    <div id="status-msg">正在加载真实地球纹理与国家边界数据…</div>
  </aside>

  <div id="tooltip"></div>
  <div id="popup" class="hidden">
    <button id="popup-close" title="关闭">×</button>
    <div class="pop-title" id="pop-title"></div>
    <div class="pop-sub" id="pop-sub"></div>
    <div class="pop-metric">
      <div class="k" id="pop-metric-k"></div>
      <div class="v" id="pop-metric-v"></div>
    </div>
    <div class="pop-grid" id="pop-grid"></div>
  </div>
</div>

/* ============================================================
 * 通用工具
 * ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 10000) / 10000; // 0..1
}
function hash2(a, b) {
  const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function monthLabel(t) {
  const y = START_YEAR + Math.floor(t / 12);
  const m = (t % 12) + 1;
  return `${y}-${String(m).padStart(2, '0')}`;
}

/* 时间趋势：季节波动 + 温和增长 + 确定性噪声 */
function trendFactor(key, metric, t) {
  const h = hashStr(`${key}|${metric}`);
  const season = metric === 'flights' ? 0.20 : metric === 'co2' ? 0.09 : metric === 'gdp' ? 0.045 : 0.015;
  const growth = metric === 'pop' ? 0.0012 : metric === 'gdp' ? 0.0035 : metric === 'flights' ? 0.0025 : 0.0012;
  const noise = (hash2(h * 37 + t, 7) - 0.5) * (metric === 'flights' ? 0.08 : 0.04);
  return 1 + growth * t + season * Math.sin((t / 12) * Math.PI * 2 + h * Math.PI * 2) + noise;
}

function cityMetricValue(city, metric, t) {
  const tr = trendFactor(city.name, metric, t);
  if (metric === 'gdp')    return city.gdp * tr;
  if (metric === 'pop')    return city.pop * tr;
  if (metric === 'flights') return city.f * tr;
  if (metric === 'co2')    return city.gdp * 0.34 * tr;
  return 0;
}

function countryMetricValue(id, metric, t) {
  const d = COUNTRY_DATA[id];
  let base;
  if (metric === 'gdp') {
    base = d ? d.gdp : 18 + hashStr(`c-gdp-${id}`) * 260;
  } else if (metric === 'pop') {
    base = d ? d.pop : 0.4 + hashStr(`c-pop-${id}`) * 55;
  } else if (metric === 'co2') {
    base = d ? d.co2 : 3 + hashStr(`c-co2-${id}`) * 180;
  } else {
    base = d
      ? 8 + d.pop * 0.55 + d.gdp * 0.014
      : 2 + hashStr(`c-flt-${id}`) * 60;
  }
  return base * trendFactor(`country-${id}`, metric, t);
}

function metricColor(metric, t01) {
  const c = METRIC_COLORS[metric];
  const col = new THREE.Color();
  col.copy(c.a).lerp(c.b, clamp(t01, 0, 1));
  return col;
}

function heatColor(t01) {
  const stops = HEAT_STOPS.map(s => new THREE.Color(s));
  const x = clamp(t01, 0, 1) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  return stops[i].clone().lerp(stops[i + 1], f);
}

function latLonToVec3(lat, lon, radius = EARTH_RADIUS) {
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon + 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function angularDistance(a, b) {
  const va = latLonToVec3(a.lat, a.lon);
  const vb = latLonToVec3(b.lat, b.lon);
  return clamp(va.angleTo(vb), 0, Math.PI);
}

/* ============================================================
 * 程序化降级纹理（远程纹理加载失败时保证可运行）

function makeFallbackDayTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#0a3d75'); g.addColorStop(0.5, '#0b5c9e'); g.addColorStop(1, '#0a3d75');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 512);
  const blob = (lon, lat, w, h, color) => {
    const x = (lon + 180) / 360 * 1024;
    const y = (90 - lat) / 180 * 512;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, 0.45 + Math.abs(lat) / 180);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  const land = 'rgba(66,128,64,0.9)', dry = 'rgba(146,118,66,0.9)';
  blob(15, 50, 95, 52, land); blob(-10, 40, 70, 42, land); blob(30, 55, 120, 38, land);
  blob(-95, 48, 80, 40, land); blob(-60, -15, 60, 50, land); blob(-45, -5, 40, 36, dry);
  blob(105, -25, 70, 42, dry); blob(-105, 22, 46, 34, land); blob(150, -20, 52, 40, land);
  blob(25, -20, 55, 48, dry); blob(10, 5, 40, 38, land); blob(80, 20, 46, 34, land);
  blob(-70, -35, 20, 52, land); blob(-5, 60, 42, 30, land); blob(135, 35, 24, 26, land);
  blob(-45, 70, 30, 22, 'rgba(220,230,240,0.9)');
  return c;
}

function makeFallbackNightTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#020915'; ctx.fillRect(0, 0, 1024, 512);
  for (const city of CITIES) {
    const x = (city.lon + 180) / 360 * 1024;
    const y = (90 - city.lat) / 180 * 512;
    for (const dx of [-1024, 0, 1024]) {
      const g = ctx.createRadialGradient(x + dx, y, 0, x + dx, y, 5 + city.pop * 0.16);
      g.addColorStop(0, 'rgba(255,196,110,0.95)');
      g.addColorStop(0.25, 'rgba(255,150,60,0.55)');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x + dx - 20, y - 20, 40, 40);
    }
  }
  return c;
}

function makeGlowTexture(soft = true) {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  if (soft) {
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.18, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.42, 'rgba(255,255,255,0.28)');
    g.addColorStop(1.0, 'rgba(255,255,255,0)');
  } else {
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.22, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.4, 'rgba(255,255,255,0.12)');
    g.addColorStop(1.0, 'rgba(255,255,255,0)');
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function configureTexture(tex) {

}

/* ============================================================
 * TopoJSON 解码（world-atlas 110m）
 * ============================================================ */
function decodeTopoCountries(topo) {
  const { scale, translate } = topo.transform;
  const arcs = topo.arcs.map(arc => {
    const pts = new Array(arc.length);
    let x = 0, y = 0;
    for (let i = 0; i < arc.length; i++) {
      x += arc[i][0]; y += arc[i][1];
      pts[i] = [x * scale[0] + translate[0], y * scale[1] + translate[1]];
    }
    return pts;
  });

  const result = [];
  for (const geom of topo.objects.countries.geometries) {
    const polys = geom.type === 'Polygon' ? [geom.arcs] : geom.arcs;
    for (const poly of polys) {
      const rings = [];
      for (const ring of poly) {
        const pts = [];
        for (const arcIndex of ring) {
          const ai = arcIndex < 0 ? ~arcIndex : arcIndex;
          const arc = arcs[ai];
          if (arcIndex < 0) {
            for (let i = arc.length - 1; i >= 0; i--) pts.push(arc[i]);
          } else {
            for (let i = 0; i < arc.length; i++) pts.push(arc[i]);
          }
        }
        rings.push(pts);
      }
      result.push({ id: String(geom.id), name: geom.properties.name, rings });
    }
  }
  return result;
}

/* 把经纬度环绘制到画布；自动处理跨 ±180° 的多边形 */
function traceRingOnCanvas(ctx, ring, W, H) {
  const px = lon => (lon + 180) / 360 * W;
  const py = lat => (90 - lat) / 180 * H;
  if (!ring.length) return;
  let penDown = false;
  const moveTo = (p) => { ctx.moveTo(px(p[0]), py(p[1])); penDown = true; };
  const lineTo = (p) => { if (!penDown) moveTo(p); else ctx.lineTo(px(p[0]), py(p[1])); };

  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[(i + 1) % ring.length];
    if (!penDown) moveTo(a);
    const rawDelta = b[0] - a[0];
    if (Math.abs(rawDelta) > 180) {
      // 跨 ±180° 反经线：把终点换算到连续经度上，插值到画布边缘后另起子路径
      const bLon = rawDelta > 180 ? b[0] - 360 : b[0] + 360;
      const edgeLon = bLon > a[0] ? 180 : -180;
      const t = clamp((edgeLon - a[0]) / (bLon - a[0]), 0, 1);
      const lat = lerp(a[1], b[1], t);
      ctx.lineTo(px(edgeLon), py(lat));
      moveTo([-edgeLon, lat]);
    }
    lineTo(b);
  }
  ctx.closePath();
}

function drawHeatMap(metric, t) {
  const W = heatCanvas.width, H = heatCanvas.height;
  heatCtx.clearRect(0, 0, W, H);

  if (countries) {
    const vals = countries.map(p => countryMetricValue(p.id, metric, t));
    const minV = Math.log10(Math.min(...vals) + 1);
    const maxV = Math.log10(Math.max(...vals) + 1);
    for (let i = 0; i < countries.length; i++) {
      const nv = maxV > minV ? (Math.log10(vals[i] + 1) - minV) / (maxV - minV) : 0.5;
      const col = heatColor(nv);
      heatCtx.fillStyle = `rgba(${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)},0.82)`;
      heatCtx.beginPath();
      for (const ring of countries[i].rings) traceRingOnCanvas(heatCtx, ring, W, H);
      heatCtx.fill('evenodd');
    }
    // 国家边界线
    heatCtx.strokeStyle = 'rgba(220,235,255,0.22)';
    heatCtx.lineWidth = 0.6;
    for (const p of countries) {
      heatCtx.beginPath();
      for (const ring of p.rings) traceRingOnCanvas(heatCtx, ring, W, H);
      heatCtx.stroke();
    }
  } else {
    // 降级：以城市为中心绘制热力光斑
    const vals = CITIES.map(c => cityMetricValue(c, metric, t));
    const minV = Math.log10(Math.min(...vals) + 1);
    const maxV = Math.log10(Math.max(...vals) + 1);
    for (let i = 0; i < CITIES.length; i++) {
      const city = CITIES[i];
      const nv = maxV > minV ? (Math.log10(vals[i] + 1) - minV) / (maxV - minV) : 0.5;
      const col = heatColor(nv);
      const r = 26 + nv * 110;
      for (const dx of [-W, 0, W]) {
        const x = (city.lon + 180) / 360 * W + dx;
        const y = (90 - city.lat) / 180 * H;
        const g = heatCtx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)},0.95)`);
        g.addColorStop(0.4, `rgba(${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)},0.5)`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        heatCtx.fillStyle = g;
        heatCtx.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }
  }
  if (heatTexture) heatTexture.needsUpdate = true;
}

/* ============================================================
 * 地球 + 大气光晕
 * ============================================================ */
function createEarth() {
  dayTexture = new THREE.CanvasTexture(makeFallbackDayTexture());
  nightTexture = new THREE.CanvasTexture(makeFallbackNightTexture());
  configureTexture(dayTexture);
  configureTexture(nightTexture);
  earthUniforms.uDay.value = dayTexture;
  earthUniforms.uNight.value = nightTexture;

  const geo = new THREE.SphereGeometry(EARTH_RADIUS, 96, 64);
  const mat = new THREE.ShaderMaterial({
    uniforms: earthUniforms,
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPosition.xyz;
        vNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D uDay;
      uniform sampler2D uNight;
      uniform sampler2D uHeat;
      uniform vec3 uSunDir;
      uniform float uHeatMix;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);
        vec3 L = normalize(uSunDir);
        float NdotL = dot(N, L);
        float dayMix = smoothstep(-0.14, 0.24, NdotL);

        vec3 day = texture2D(uDay, vUv).rgb;
        vec3 night = texture2D(uNight, vUv).rgb;

        // 夜晚底色 + 提取城市灯光并增强为暖色发光
        float light = max(night.r, max(night.g, night.b));
        float cityGlow = smoothstep(0.10, 0.85, light);
        vec3 nightCol = night * vec3(0.16, 0.24, 0.42);
        nightCol += night * cityGlow * vec3(3.1, 1.9, 1.0);
        vec3 base = mix(nightCol, day, dayMix);

        // 太阳高光（海洋反光）
        vec3 H = normalize(L + V);
        float spec = pow(max(dot(N, H), 0.0), 30.0) * dayMix * 0.22;
        base += vec3(1.0, 0.97, 0.88) * spec;

        // 热力图层（国家/地区着色）
        vec4 heat = texture2D(uHeat, vUv);
        float heatFactor = uHeatMix * heat.a * (0.5 + 0.5 * dayMix);
        base = mix(base, heat.rgb, heatFactor);

        // 大气边缘的淡蓝色散射
        float fres = pow(1.0 - abs(dot(N, V)), 3.0);
        base += vec3(0.06, 0.20, 0.38) * fres * (0.35 + 0.65 * dayMix);

        gl_FragColor = vec4(base, 1.0);
      }
    `
  });
  const earth = new THREE.Mesh(geo, mat);
  earth.renderOrder = 1;
  globeGroup.add(earth);

  // 大气光晕：BackSide + Fresnel 辉光
  const atmoGeo = new THREE.SphereGeometry(EARTH_RADIUS, 96, 64);
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color('#3d8bff') } },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewDir = normalize(-mvPosition.xyz);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        float rim = pow(1.0 - abs(dot(normalize(vNormal), normalize(vViewDir))), 3.2);
        float alpha = rim * 0.72;
        gl_FragColor = vec4(uColor, 1.0) * vec4(1.6, 1.9, 2.4, alpha);
      }
    `,
    side: THREE.BackSide,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
  atmoMesh.scale.setScalar(1.16);
  atmoMesh.renderOrder = 2;
  globeGroup.add(atmoMesh);
}

/* ============================================================
 * 城市发光点
 * ============================================================ */
function createMarkers() {
  const softTex = makeGlowTexture(true);
  const coreTex = makeGlowTexture(false);

  for (const city of CITIES) {
    const pos = latLonToVec3(city.lat, city.lon, EARTH_RADIUS * 1.012);
    const outer = new THREE.Sprite(new THREE.SpriteMaterial({
      map: softTex,
      color: 0xffffff,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.9
    }));
    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: coreTex,
      color: 0xffffff,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 1
    }));
    outer.scale.setScalar(0.06);
    core.scale.setScalar(0.018);
    outer.position.copy(pos);
    core.position.copy(pos);
    outer.userData.city = city;
    core.userData.city = city;
    outer.renderOrder = 5;
    core.renderOrder = 6;
    markerGroup.add(outer, core);
    CITY_REFS.push({ city, outer, core });
    clickSprites.push(outer, core);
  }
}

/* ============================================================
 * 航线弧线：TubeGeometry（可见流光材质）+ 隐形命中管
 * ============================================================ */
const ARC_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const ARC_FRAG = `
  uniform float uTime;
  uniform float uOpacity;
  uniform float uSpeed;
  uniform float uFlow;
  uniform vec3 uColor;
  varying vec2 vUv;
  void main() {
    float t = vUv.x * uFlow;
    float phase = fract(t - uTime * uSpeed);
    float head = exp(-pow((phase - 0.5) * 7.0, 2.0));
    float tail = pow(1.0 - phase, 2.0) * 0.32;
    float baseAlpha = 0.16 + tail;
    float alpha = uOpacity * (baseAlpha + head * 0.9);
    vec3 col = mix(uColor, vec3(1.0), head * 0.65);
    gl_FragColor = vec4(col, alpha);
  }
`;

function buildRoutes() {
  const seen = new Set();
  for (let i = 0; i < CITIES.length; i++) {
    for (let j = i + 1; j < CITIES.length; j++) {
      const h = hash2(i * 1.7, j * 3.1);
      if (h > 0.12) continue;
      const a = CITIES[i], b = CITIES[j];
      const dist = angularDistance(a, b);
      if (dist < 0.12 || dist > 2.15) continue;

      const va = latLonToVec3(a.lat, a.lon, EARTH_RADIUS * 1.02);
      const vb = latLonToVec3(b.lat, b.lon, EARTH_RADIUS * 1.02);
      const mid = va.clone().add(vb).multiplyScalar(0.5).normalize()
        .multiplyScalar(EARTH_RADIUS * (1.14 + dist * 0.34));
      const curve = new THREE.QuadraticBezierCurve3(va, mid, vb);
      const tubular = Math.max(40, Math.min(96, Math.round(32 + dist * 42)));
      const radial = 6;
      const visualGeo = new THREE.TubeGeometry(curve, tubular, 0.0055, radial, false);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uOpacity: { value: 0.4 },
          uSpeed: { value: 0.35 },
          uFlow: { value: Math.max(1, Math.round(dist * 1.7)) },
          uColor: { value: new THREE.Color('#40c4ff') }
        },
        vertexShader: ARC_VERT,
        fragmentShader: ARC_FRAG,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const visual = new THREE.Mesh(visualGeo, mat);
      visual.renderOrder = 3;
      arcGroup.add(visual);

      const hitGeo = new THREE.TubeGeometry(curve, 24, 0.028, 4, false);
      const hitMat = new THREE.MeshBasicMaterial({ visible: false });
      const hit = new THREE.Mesh(hitGeo, hitMat);
      hit.userData.routeIndex = ROUTES.length;
      hitGroup.add(hit);
      hitMeshes.push(hit);

      ROUTES.push({
        a, b, dist, curve,
        flightBase: clamp((a.f + b.f) * 0.5 * (0.04 + h * 0.10), 0.8, 22),
        gravity: 1 / (1 + dist * 0.55) + 0.22,
        hash: h,
        mat, visual
      });
    }
  }
  // 保证航线数量足够且分布合理
  if (ROUTES.length < 60) {
    const fallback = [];
    for (let i = 0; i < CITIES.length && fallback.length < 80; i += 2) {
      for (let j = i + 3; j < CITIES.length; j += 5) {
        fallback.push([i, j]);
      }
    }
    for (const [i, j] of fallback) {
      const a = CITIES[i], b = CITIES[j];
      const dist = angularDistance(a, b);
      if (dist < 0.2 || dist > 2.15) continue;
      // 使用与主循环一致的曲线构造（简化版）
      const va = latLonToVec3(a.lat, a.lon, EARTH_RADIUS * 1.02);
      const vb = latLonToVec3(b.lat, b.lon, EARTH_RADIUS * 1.02);
      const mid = va.clone().add(vb).multiplyScalar(0.5).normalize()
        .multiplyScalar(EARTH_RADIUS * (1.14 + dist * 0.34));
      const curve = new THREE.QuadraticBezierCurve3(va, mid, vb);
      const tubular = 48;
      const visualGeo = new THREE.TubeGeometry(curve, tubular, 0.0055, 6, false);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uOpacity: { value: 0.4 },
          uSpeed: { value: 0.35 },
          uFlow: { value: Math.max(1, Math.round(dist * 1.7)) },
          uColor: { value: new THREE.Color('#40c4ff') }
        },
        vertexShader: ARC_VERT,
        fragmentShader: ARC_FRAG,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const visual = new THREE.Mesh(visualGeo, mat);
      visual.renderOrder = 3;
      arcGroup.add(visual);
      const hitGeo = new THREE.TubeGeometry(curve, 24, 0.028, 4, false);
      const hit = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));
      hit.userData.routeIndex = ROUTES.length;
      hitGroup.add(hit);
      hitMeshes.push(hit);
      ROUTES.push({
        a, b, dist, curve,
        flightBase: clamp((a.f + b.f) * 0.5 * 0.07, 0.8, 22),
        gravity: 1 / (1 + dist * 0.55) + 0.22,
        hash: hash2(i, j), mat, visual
      });
    }
  }
}

/* ============================================================
 * 航线指标与数据刷新
 * ============================================================ */
function routeMetricValue(route, metric, t) {
  const { a, b } = route;
  if (metric === 'flights') {
    return route.flightBase * trendFactor(`r-${a.name}-${b.name}`, 'flights', t);
  }
  const va = cityMetricValue(a, metric, t);
  const vb = cityMetricValue(b, metric, t);
  const avg = (va + vb) * 0.5;
  const factor = metric === 'gdp' ? 0.14 : metric === 'pop' ? 0.8 : 0.28;
  return avg * route.gravity * factor * trendFactor(`r-${a.name}-${b.name}`, metric, t);
}

const fmtInt = n => Math.round(n).toLocaleString('en-US');
const fmt1 = n => n >= 100 ? Math.round(n).toLocaleString('en-US') : n.toFixed(1);

function updateMarkers() {
  const vals = CITIES.map(c => cityMetricValue(c, state.metric, state.timeIndex));
  const minL = Math.log10(Math.min(...vals) + 1);
  const maxL = Math.log10(Math.max(...vals) + 1);
  const span = Math.max(1e-6, maxL - minL);

  for (let i = 0; i < CITY_REFS.length; i++) {
    const ref = CITY_REFS[i];
    const nv = (Math.log10(vals[i] + 1) - minL) / span;
    const col = metricColor(state.metric, nv * 0.85 + 0.15);
    const outerScale = 0.038 + nv * 0.095;
    const coreScale = 0.012 + nv * 0.022;
    ref.baseScale = outerScale;
    ref.outer.material.color.copy(col);
    ref.outer.material.opacity = 0.55 + nv * 0.45;
    ref.outer.scale.setScalar(outerScale);
    ref.core.material.color.copy(col).lerp(new THREE.Color('#ffffff'), 0.5);
    ref.core.scale.setScalar(coreScale);
  }
}

function updateArcs() {
  const vals = ROUTES.map(r => routeMetricValue(r, state.metric, state.timeIndex));
  const minL = Math.log10(Math.min(...vals) + 1);
  const maxL = Math.log10(Math.max(...vals) + 1);
  const span = Math.max(1e-6, maxL - minL);

  for (let i = 0; i < ROUTES.length; i++) {
    const r = ROUTES[i];
    const nv = (Math.log10(vals[i] + 1) - minL) / span;
    const col = metricColor(state.metric, nv * 0.9 + 0.1);
    r.mat.uniforms.uColor.value.set(col);
    r.baseOpacity = 0.13 + nv * 0.72;
    r.mat.uniforms.uSpeed.value = 0.16 + nv * 0.55;
    r.value = vals[i];
  }
  arcGroup.visible = state.showArcs;
}

function updateVisualData() {
  drawHeatMap(state.metric, state.timeIndex);
  updateMarkers();
  updateArcs();
  earthUniforms.uHeatMix.value = state.showHeat ? 0.62 : 0.0;
  atmoMesh.visible = state.showAtmo;
  updateTimeUI();
  if (state.selectedCity) refreshPopup();
}

function updateTimeUI() {
  dom.timeSlider.value = String(state.timeIndex);
  dom.timeLabel.textContent = monthLabel(state.timeIndex);
}

/* ============================================================
 * 悬浮提示与城市弹窗

function showTooltip(html, x, y) {
  dom.tooltip.innerHTML = html;
  dom.tooltip.classList.add('visible');
  const w = dom.tooltip.offsetWidth, h = dom.tooltip.offsetHeight;
  const left = clamp(x + 16, 8, window.innerWidth - w - 8);
  const top = clamp(y + 14, 8, window.innerHeight - h - 8);
  dom.tooltip.style.left = left + 'px';
  dom.tooltip.style.top = top + 'px';
}
function hideTooltip() { dom.tooltip.classList.remove('visible'); }

function routeTooltipHTML(route) {
  const t = state.timeIndex;
  const distKm = Math.round(route.dist * 6371);
  let valHTML;
  const v = routeMetricValue(route, state.metric, t);
  if (state.metric === 'flights') valHTML = `月航班量 ≈ <b>${fmtInt(v * 1000)}</b> 班`;
  else if (state.metric === 'gdp') valHTML = `经济关联强度 <b>${fmt1(v)}</b>`;
  else if (state.metric === 'pop') valHTML = `人口联系强度 <b>${fmt1(v)}</b>`;
  else valHTML = `碳排放强度 <b>${fmt1(v)}</b>`;
  return `
    <div class="tt-title">✈ ${route.a.name} → ${route.b.name}</div>
    <div class="tt-row"><span>航线距离</span><b>${fmtInt(distKm)} km</b></div>
    <div class="tt-row"><span>${METRIC_META[state.metric].label}指标</span>${valHTML}</div>
    <div class="tt-row"><span>时间</span><b>${monthLabel(t)}</b></div>
  `;
}

function cityTooltipHTML(city) {
  const v = cityMetricValue(city, state.metric, state.timeIndex);
  const unit = METRIC_META[state.metric].cityUnit;
  return `
    <div class="tt-title">📍 ${city.name} · ${city.country}</div>
    <div class="tt-row"><span>${METRIC_META[state.metric].label}</span><b>${fmt1(v)} ${unit}</b></div>
    <div class="tt-row"><span>都会区人口</span><b>${city.pop} 百万</b></div>
  `;
}

function openPopup(city) {
  state.selectedCity = city;
  dom.popup.classList.remove('hidden');
  refreshPopup();
}
function closePopup() {
  state.selectedCity = null;
  dom.popup.classList.add('hidden');
}

function refreshPopup() {
  const city = state.selectedCity;
  if (!city) return;
  const t = state.timeIndex;
  dom.popTitle.textContent = `${city.name} · ${city.country}`;
  dom.popSub.textContent = `${city.lat >= 0 ? 'N' : 'S'} ${Math.abs(city.lat).toFixed(2)}°  ${city.lon >= 0 ? 'E' : 'W'} ${Math.abs(city.lon).toFixed(2)}°  |  ${monthLabel(t)}`;
  const v = cityMetricValue(city, state.metric, t);
  dom.popMetricK.textContent = `当前指标 · ${METRIC_META[state.metric].label}（${METRIC_META[state.metric].cityUnit}）`;
  dom.popMetricV.textContent = fmt1(v);

  const rows = [
    ['都会区人口', `${city.pop} 百万`, 'pop'],
    ['城市 GDP', `${fmt1(cityMetricValue(city, 'gdp', t))} 十亿美元`, 'gdp'],
    ['月航班量', `${fmtInt(cityMetricValue(city, 'flights', t) * 1000)} 班`, 'flights'],
    ['碳排放强度', `${fmt1(cityMetricValue(city, 'co2', t))} 百万吨`, 'co2']
  ];
  dom.popGrid.innerHTML = rows.map(([k, val, metric]) => `
    <div class="pop-cell" style="${metric === state.metric ? 'border:1px solid rgba(63,193,255,0.6)' : ''}">
      <div class="k">${k}</div><div class="v">${val}</div>
    </div>`).join('');
}

function updatePopupPosition() {
  if (!state.selectedCity) return;
  const city = state.selectedCity;
  const worldPos = latLonToVec3(city.lat, city.lon, EARTH_RADIUS * 1.015);
  worldPos.applyMatrix4(globeGroup.matrixWorld);
  const toCam = camera.position.clone().sub(worldPos);
  const normal = worldPos.clone().normalize();
  const facing = toCam.dot(normal);
  if (facing < 0.04) {
    dom.popup.classList.add('hidden');
    return;
  }
  dom.popup.classList.remove('hidden');
  const p = worldPos.clone().project(camera);
  const x = (p.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-p.y * 0.5 + 0.5) * window.innerHeight;
  dom.popup.style.left = x + 'px';
  dom.popup.style.top = y + 'px';
}

/* ============================================================
 * 资源加载
 * ============================================================ */
const statusLines = {};
function setStatus(key, msg) {
  statusLines[key] = msg;
  dom.statusMsg.innerHTML = Object.values(statusLines).join('<br>');
}

function loadImageWithTimeout(url, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const timer = setTimeout(() => {
      img.src = '';
      reject(new Error(`timeout: ${url}`));
    }, timeoutMs);
    img.onload = () => { clearTimeout(timer); resolve(img); };
    img.onerror = () => { clearTimeout(timer); reject(new Error(`failed: ${url}`)); };
    img.src = url;
  });
}

async function loadTextureFromURLs(urls, uniform, key, label) {
  for (const url of urls) {
    try {
      const img = await loadImageWithTimeout(url);
      const tex = new THREE.Texture(img);
      configureTexture(tex);
      uniform.value = tex;
      setStatus(key, `✓ ${label}已加载（${img.naturalWidth}×${img.naturalHeight}）`);
      return true;
    } catch (err) {
      // 尝试下一个 CDN 源
    }
  }
  setStatus(key, `⚠ ${label}加载失败，已启用程序化降级纹理`);
  return false;
}

async function fetchJsonWithTimeout(url, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { mode: 'cors', signal: ctrl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function loadRemoteTextures() {
  setStatus('day', '⏳ 正在下载真实地球日间纹理…');
  setStatus('night', '⏳ 正在下载 NASA 夜景灯光纹理…');
  return Promise.allSettled([
    loadTextureFromURLs(DAY_TEX_URLS, earthUniforms.uDay, 'day', '地球日间纹理'),
    loadTextureFromURLs(NIGHT_TEX_URLS, earthUniforms.uNight, 'night', '夜景灯光纹理')
  ]);
}

async function loadWorldAtlas() {
  const key = 'atlas';
  setStatus(key, '⏳ 正在加载国家/地区边界数据…');
  for (const url of WORLD_ATLAS_URLS) {
    try {
      const topo = await fetchJsonWithTimeout(url);
      countries = decodeTopoCountries(topo);
      setStatus(key, `✓ 国家/地区边界已加载（${countries.length} 个区域）`);
      break;
    } catch (err) {
      countries = null;
    }
  }
  if (!countries) setStatus(key, '⚠ 国家边界数据加载失败，热力层降级为城市聚合光斑');
  drawHeatMap(state.metric, state.timeIndex);
}

/* ============================================================
 * 交互事件
 * ============================================================ */
function setMetric(metric) {
  state.metric = metric;
  document.querySelectorAll('.metric-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.metric === metric);
  });
  dom.metricDesc.textContent = METRIC_META[metric].desc;
  updateVisualData();
}

function setTimeIndex(t) {
  state.timeIndex = clamp(Math.round(t), 0, MONTH_COUNT - 1);
  state.timeFloat = state.timeIndex;
  updateVisualData();
}

function setPointerNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

/* 球体遮挡测试：只保留位于地球正面的命中（避免射线穿透球体命中背面标记） */
const EARTH_HIT_SPHERE = new THREE.Sphere(new THREE.Vector3(0, 0, 0), EARTH_RADIUS);
function earthIntersectionDistance(ray) {
  const target = new THREE.Vector3();
  return ray.intersectSphere(EARTH_HIT_SPHERE, target) ? target.distanceTo(ray.origin) : Infinity;
}
function filterFrontHits(hits) {
  const earthDist = earthIntersectionDistance(raycaster.ray);
  return hits.filter(h => h.distance <= earthDist + 0.22);
}

function handleHover(e) {
  const now = performance.now();
  if (now - lastMoveTime < 33) return;
  lastMoveTime = now;

  setPointerNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);

  let best = null, bestType = null;
  const routeHits = state.showArcs
    ? filterFrontHits(raycaster.intersectObjects(hitMeshes, false))
    : [];
  if (routeHits.length) {
    best = ROUTES[routeHits[0].object.userData.routeIndex];
    bestType = 'route';
  }
  const spriteHits = filterFrontHits(raycaster.intersectObjects(clickSprites, false));
  if (spriteHits.length) {
    const city = spriteHits[0].object.userData.city;
    if (!best || spriteHits[0].distance < routeHits[0].distance) {
      best = city; bestType = 'city';
    }
  }

  const prevRoute = state.hoveredRoute, prevCity = state.hoveredCity;
  state.hoveredRoute = bestType === 'route' ? best : null;
  state.hoveredCity = bestType === 'city' ? best : null;
  if (!best) { hideTooltip(); return; }
  renderer.domElement.style.cursor = 'pointer';
  if (bestType === 'route') {
    showTooltip(routeTooltipHTML(best), e.clientX, e.clientY);
    if (prevRoute !== best) updateArcs();
  } else {
    showTooltip(cityTooltipHTML(best), e.clientX, e.clientY);
  }
}

function handleClick(e) {
  setPointerNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = filterFrontHits(raycaster.intersectObjects(clickSprites, false));
  if (hits.length) {
    openPopup(hits[0].object.userData.city);
  } else {
    closePopup();
  }
}

function setPlaying(on) {
  state.playing = on;
  dom.playBtn.textContent = on ? '⏸ 暂停' : '▶ 播放';
  if (on) {
    lastPlaybackTime = performance.now();
    playbackTimer = setInterval(() => {
      const now = performance.now();
      const dt = Math.min((now - lastPlaybackTime) / 1000, 0.3);
      lastPlaybackTime = now;
      state.timeFloat += dt * 1.25; // 约 0.8 秒前进一个月
      if (state.timeFloat >= MONTH_COUNT) {
        state.timeFloat = 0;
        state.timeIndex = 0;
        updateVisualData();
      } else {
        const idx = Math.floor(state.timeFloat);
        if (idx !== state.timeIndex) {
          state.timeIndex = idx;
          updateVisualData();
        }
      }
    }, 100);
  } else if (playbackTimer) {
    clearInterval(playbackTimer);
    playbackTimer = null;
  }
}

function bindEvents() {
  document.querySelectorAll('.metric-btn').forEach(btn => {
    btn.addEventListener('click', () => setMetric(btn.dataset.metric));
  });

  dom.timeSlider.addEventListener('input', e => {
    setTimeIndex(Number(e.target.value));
  });

  dom.playBtn.addEventListener('click', () => setPlaying(!state.playing));

  document.getElementById('spin-toggle').addEventListener('change', e => { state.spinning = e.target.checked; });
  document.getElementById('atmo-toggle').addEventListener('change', e => { state.showAtmo = e.target.checked; updateVisualData(); });
  document.getElementById('heat-toggle').addEventListener('change', e => { state.showHeat = e.target.checked; updateVisualData(); });
  document.getElementById('arc-toggle').addEventListener('change', e => { state.showArcs = e.target.checked; updateVisualData(); });
  document.getElementById('popup-close').addEventListener('click', closePopup);

  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    pointerDownPos = { x: e.clientX, y: e.clientY };
    state.dragging = false;
  });
  el.addEventListener('pointermove', e => {
    if (pointerDownPos) {
      const dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
      if (dx * dx + dy * dy > 36) state.dragging = true;
      return;
    }
    state.dragging = false;
    handleHover(e);
  });
  el.addEventListener('pointerup', e => {
    const wasDrag = state.dragging || (pointerDownPos &&
      Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 6);
    pointerDownPos = null;
    state.dragging = false;
    if (!wasDrag) handleClick(e);
  });
  el.addEventListener('pointerleave', () => {
    pointerDownPos = null;
    state.dragging = false;
    hideTooltip();
    state.hoveredRoute = null;
    state.hoveredCity = null;
    renderer.domElement.style.cursor = 'grab';
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.addEventListener('pointermove', e => {
    if (!pointerDownPos && !state.hoveredRoute && !state.hoveredCity) {
      renderer.domElement.style.cursor = 'grab';
    }
  });
}

/* ============================================================
 * 主循环与启动
 * ============================================================ */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.1, clock.getDelta());
  state.elapsed += dt;

  if (state.spinning) globeGroup.rotation.y += dt * 0.055;

  // 更新航线流动动画与悬停高亮
  for (const r of ROUTES) {
    r.mat.uniforms.uTime.value = state.elapsed;
    const boost = r === state.hoveredRoute ? 1.85 : 1;
    r.mat.uniforms.uOpacity.value = r.baseOpacity * boost;
  }
  // 城市悬停放大
  for (const ref of CITY_REFS) {
    const s = ref.baseScale * (ref.city === state.hoveredCity ? 1.45 : 1);
    ref.outer.scale.setScalar(s);
  }

  controls.update();
  updatePopupPosition();
  renderer.render(scene, camera);
}

const clock = new THREE.Clock();

function boot() {
  try {
    initScene();
  } catch (err) {
    console.error(err);
    dom.loadingMsg.textContent = 'WebGL 初始化失败：' + (err && err.message ? err.message : err);
    setStatus('webgl', '❌ WebGL 不可用，请使用支持 WebGL 的现代浏览器');
    return;
  }

  setStatus('webgl', '✓ WebGL 场景已初始化（Three.js ESM + importmap）');
  bindEvents();
  updateVisualData();
  animate();

  loadRemoteTextures();
  loadWorldAtlas();

  setTimeout(() => {
    dom.loading.classList.add('hidden');
  }, 1800);
}

setStatus('webgl', '⏳ 正在初始化 Three.js 场景…');
boot();
</script>
</body>
</html>
