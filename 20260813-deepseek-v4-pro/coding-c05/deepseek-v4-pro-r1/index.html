<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 双时区腕表 · Dual Time 3D Watch</title>
<style>
  :root {
    --panel-bg: rgba(13, 17, 26, 0.72);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #eef2f8;
    --text-dim: #9aa6bb;
    --accent: #e8b64c;
    --accent2: #6fd3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(1200px 700px at 50% 35%, #1b2230 0%, #0b0e15 55%, #05070c 100%);
    font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #watch-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #watch-canvas.dragging { cursor: grabbing; }

  #ui {
    position: fixed;
    left: 18px;
    top: 18px;
    width: min(370px, calc(100vw - 36px));
    padding: 14px 16px 12px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    z-index: 10;
  }
  #ui h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  #ui h1 span {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  .tz-block {
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .tz-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    letter-spacing: 0.12em;
  }
  .badge.tz1 { background: rgba(232, 182, 76, 0.18); color: #f2c96d; border: 1px solid rgba(232, 182, 76, 0.35); }
  .badge.tz2 { background: rgba(111, 211, 255, 0.14); color: #8edcff; border: 1px solid rgba(111, 211, 255, 0.35); }
  select {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  select option { background: #141926; color: #eef2f8; }
  .clock {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    margin-top: 4px;
  }
  .clock .time {
    font-size: 24px;
    letter-spacing: 0.03em;
  }
  .clock .time .ms {
    font-size: 13px;
    color: var(--text-dim);
    display: inline-block;
    width: 30px;
  }
  .clock .date {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  #controls {
    margin-top: 11px;
    padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  #controls label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  button {
    padding: 6px 12px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button:active { transform: translateY(1px); }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(238, 242, 248, 0.66);
    letter-spacing: 0.05em;
    background: rgba(10, 13, 20, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 6px 14px;
    border-radius: 999px;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }
  #status {
    position: fixed;
    right: 14px;
    bottom: 12px;
    font-size: 10px;
    color: rgba(238, 242, 248, 0.45);
    z-index: 10;
    pointer-events: none;
  }
  @media (max-width: 760px) {
    #ui { width: min(340px, calc(100vw - 24px)); left: 12px; top: 12px; padding: 12px; }
    #hint { font-size: 11px; padding: 5px 10px; bottom: 10px; }
    .clock .time { font-size: 20px; }
  }
</style>
</head>
<body>
  <canvas id="watch-canvas"></canvas>

  <div id="ui">
    <h1>3D 双时区腕表 <span>DUAL TIME</span></h1>

    <div class="tz-block">
      <div class="tz-head">
        <span class="badge tz1">主表盘 TZ1</span>
        <select id="tz1-select" title="选择主表盘时区"></select>
      </div>
      <div class="clock">
        <div class="time"><span id="tz1-time">--:--:--</span><span class="ms" id="tz1-ms">.00</span></div>
        <div class="date" id="tz1-date">----</div>
      </div>
    </div>

    <div class="tz-block">
      <div class="tz-head">
        <span class="badge tz2">第二时区 TZ2</span>
        <select id="tz2-select" title="选择第二时区"></select>
      </div>
      <div class="clock">
        <div class="time"><span id="tz2-time">--:--:--</span><span class="ms" id="tz2-ms">.00</span></div>
        <div class="date" id="tz2-date">----</div>
      </div>
    </div>

    <div id="controls">
      <label><input type="checkbox" id="auto-rotate" checked /> 自动旋转</label>
      <button id="reset-view" type="button">复位视角</button>
    </div>
  </div>

  <div id="hint">🖱️ 拖拽旋转 · 滚轮缩放 · 双击复位 · 下拉框切换时区</div>
  <div id="status">正在启动…</div>

  <noscript>本页面需要启用 JavaScript。</noscript>
  <script src="vendor/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
