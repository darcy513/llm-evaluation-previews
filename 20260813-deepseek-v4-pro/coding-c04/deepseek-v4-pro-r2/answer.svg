<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 500" width="800" height="500" role="img"
     aria-labelledby="title desc">
  <title id="title">A giraffe driving a tiny car</title>
  <desc id="desc">Animated cartoon of a tall giraffe squeezed into a tiny red car, cruising along a sunny road.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc3f2"/>
      <stop offset="0.65" stop-color="#b9e6fb"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#ffd23d"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- Sun with rotating rays -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 690 86" to="360 690 86" dur="24s" repeatCount="indefinite"/>
      <g stroke="#ffcf3f" stroke-width="7" stroke-linecap="round">
        <line x1="690" y1="40" x2="690" y2="22"/>
        <line x1="690" y1="132" x2="690" y2="150"/>
        <line x1="644" y1="86" x2="626" y2="86"/>
        <line x1="736" y1="86" x2="754" y2="86"/>
        <line x1="657" y1="53" x2="644" y2="40"/>
        <line x1="723" y1="119" x2="736" y2="132"/>
        <line x1="657" y1="119" x2="644" y2="132"/>
        <line x1="723" y1="53" x2="736" y2="40"/>
      </g>
    </g>
    <circle cx="690" cy="86" r="38" fill="url(#sunGlow)" stroke="#f5b93a" stroke-width="4"/>
  </g>

  <!-- Drifting clouds -->
  <g transform="translate(130,88)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 960 0" dur="38s" repeatCount="indefinite"/>
      <g fill="#ffffff" opacity="0.95">
        <ellipse cx="-48" cy="6" rx="42" ry="20"/>
        <ellipse cx="0" cy="-10" rx="36" ry="25"/>
        <ellipse cx="48" cy="6" rx="46" ry="21"/>
      </g>
    </g>
  </g>
  <g transform="translate(510,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 820 0" dur="52s" begin="-18s" repeatCount="indefinite"/>
      <g fill="#ffffff" opacity="0.85" transform="scale(0.75)">
        <ellipse cx="-48" cy="6" rx="42" ry="20"/>
        <ellipse cx="0" cy="-10" rx="36" ry="25"/>
        <ellipse cx="48" cy="6" rx="46" ry="21"/>
      </g>
    </g>
  </g>

  <!-- Birds gliding across -->
  <g fill="none" stroke="#4d5a6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-120 0; 920 0" dur="26s" begin="-6s" repeatCount="indefinite"/>
      <path d="M0 8 Q6 0 12 8 Q18 0 24 8"/>
      <path d="M-22 22 Q-16 14 -10 22 Q-4 14 2 22"/>
    </g>
  </g>

  <!-- Rolling hills -->
  <path d="M0 395 L0 316 Q120 258 240 330 T520 302 T800 328 L800 395 Z" fill="#a5d98c"/>
  <path d="M0 395 L0 352 Q180 308 360 360 T800 352 L800 395 Z" fill="#8bcb6f"/>

  <!-- Grass strip -->
  <rect x="0" y="378" width="800" height="17" fill="#8ed15f"/>

  <!-- Road -->
  <rect x="0" y="395" width="800" height="105" fill="#4c5260"/>
  <line x1="0" y1="395" x2="800" y2="395" stroke="#39404d" stroke-width="5"/>
  <line x1="0" y1="447" x2="800" y2="447" stroke="#e9ebef" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="50 30">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.637s" repeatCount="indefinite"/>
  </line>

  <!-- Car shadow (softly pulses while the car bounces) -->
  <ellipse cx="365" cy="429" rx="132" ry="11" fill="#1d2025" opacity="0.16">
    <animate attributeName="opacity" values="0.16;0.09;0.16" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="132;124;132" dur="0.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===================== CAR + GIRAFFE (gentle bounce) ===================== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.8s" repeatCount="indefinite"/>

    <!-- Giraffe (body, neck, head) sways slightly in time with the drive -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 350 320; 2.4 350 320; 0 350 320; -2.4 350 320; 0 350 320"
                        dur="5s" repeatCount="indefinite"/>

      <!-- Tail swish -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 296 308; -9 296 308; 0 296 308; 9 296 308; 0 296 308"
                          dur="3.6s" repeatCount="indefinite"/>
        <path d="M296 308 Q278 322 268 338" fill="none" stroke="#7a4a1f" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="264" cy="344" rx="6" ry="11" fill="#7a4a1f"/>
      </g>

      <!-- Giraffe torso -->
      <ellipse cx="360" cy="332" rx="68" ry="46" fill="#f6c14f" stroke="#7a4a1f" stroke-width="3"/>
      <g fill="#b06f2e">
        <ellipse cx="332" cy="312" rx="10" ry="7" transform="rotate(-14 332 312)"/>
        <ellipse cx="366" cy="300" rx="11" ry="8" transform="rotate(8 366 300)"/>
        <ellipse cx="398" cy="316" rx="9" ry="6" transform="rotate(18 398 316)"/>
        <ellipse cx="348" cy="330" rx="8" ry="6" transform="rotate(-6 348 330)"/>
      </g>

      <!-- Long neck -->
      <path d="M354 316 C348 240 338 172 320 128 L304 120 C316 190 314 244 302 308"
            fill="#f6c14f" stroke="#7a4a1f" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#b06f2e">
        <ellipse cx="320" cy="288" rx="8" ry="5" transform="rotate(-24 320 288)"/>
        <ellipse cx="311" cy="258" rx="8" ry="5" transform="rotate(-18 311 258)"/>
        <ellipse cx="324" cy="224" rx="9" ry="5" transform="rotate(-26 324 224)"/>
        <ellipse cx="315" cy="190" rx="8" ry="5" transform="rotate(-20 315 190)"/>
        <ellipse cx="310" cy="156" rx="7" ry="5" transform="rotate(-14 310 156)"/>
      </g>

      <!-- Head (extra nod) -->
      <g transform="translate(306,112)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            values="0 0 8; 2.6 0 8; 0 0 8; -2.6 0 8; 0 0 8"
                            dur="5s" repeatCount="indefinite"/>

          <!-- Ossicones (horns) -->
          <g stroke="#7a4a1f" stroke-width="5" stroke-linecap="round">
            <line x1="-14" y1="-18" x2="-10" y2="-34"/>
            <line x1="-2" y1="-20" x2="2" y2="-35"/>
          </g>
          <circle cx="-10" cy="-36" r="4.6" fill="#7a4a1f"/>
          <circle cx="2" cy="-37" r="4.6" fill="#7a4a1f"/>

          <!-- Ear -->
          <ellipse cx="-25" cy="-13" rx="8" ry="5" transform="rotate(-24 -25 -13)"
                   fill="#f6c14f" stroke="#7a4a1f" stroke-width="2.5"/>
          <!-- Mane tuft -->
          <path d="M-26 -9 L-19 6" fill="none" stroke="#a5662a" stroke-width="5" stroke-linecap="round"/>

          <!-- Head -->
          <ellipse cx="-2" cy="0" rx="30" ry="21" fill="#f6c14f" stroke="#7a4a1f" stroke-width="3"/>
          <!-- Muzzle -->
          <ellipse cx="24" cy="6" rx="22" ry="15" fill="#f6c14f" stroke="#7a4a1f" stroke-width="3"/>
          <path d="M38 13 Q30 21 20 18" fill="none" stroke="#7a4a1f" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="41" cy="3" rx="3" ry="4.2" fill="#6b4423"/>

          <!-- Blinking eye -->
          <ellipse cx="9" cy="-6" rx="6.4" ry="7" fill="#ffffff" stroke="#7a4a1f" stroke-width="1.6">
            <animate attributeName="ry" values="7;7;1;7" keyTimes="0;0.44;0.5;0.56" dur="4.5s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="11" cy="-6" r="3.2" fill="#3b2a18">
            <animate attributeName="r" values="3.2;3.2;0.4;3.2" keyTimes="0;0.44;0.5;0.56" dur="4.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="12" cy="-7.5" r="1" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- Tiny red car body -->
    <path d="M246 402 L246 376 Q246 354 266 350 L292 346 L444 344 Q492 344 512 368 Q516 384 516 402 Z"
          fill="#ef5145" stroke="#a82e28" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M246 388 L516 388" stroke="#d63f36" stroke-width="2"/>

    <!-- Windshield -->
    <path d="M438 346 L482 346 L468 314 L444 314 Z" fill="#bfeaff" opacity="0.9" stroke="#7fb8d0" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="456" y1="314" x2="456" y2="346" stroke="#7fb8d0" stroke-width="2"/>

    <!-- Details -->
    <line x1="372" y1="350" x2="372" y2="402" stroke="#a82e28" stroke-width="2.5"/>
    <rect x="381" y="366" width="13" height="6" rx="3" fill="#7a2e28"/>
    <circle cx="495" cy="382" r="10" fill="#ffe28a" stroke="#d99b28" stroke-width="2.5"/>
    <circle cx="258" cy="382" r="8" fill="#ffb4a0" stroke="#a82e28" stroke-width="2.5"/>
    <rect x="238" y="382" width="10" height="18" rx="4" fill="#d8dbe2" stroke="#9aa1ad" stroke-width="2"/>
    <rect x="510" y="384" width="10" height="18" rx="4" fill="#d8dbe2" stroke="#9aa1ad" stroke-width="2"/>

    <!-- License plate -->
    <rect x="270" y="372" width="30" height="17" rx="3" fill="#ffffff" stroke="#b0b6bf" stroke-width="1.5"/>
    <text x="285" y="384.5" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold"
          text-anchor="middle" fill="#5b616b">TNY</text>

    <!-- Exhaust puffs -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 -20" dur="1.3s" repeatCount="indefinite"/>
        <circle cx="236" cy="388" r="4" fill="#b9bec7">
          <animate attributeName="r" values="4;11;17" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0.4;0" dur="1.3s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 -20" dur="1.3s" begin="-0.65s" repeatCount="indefinite"/>
        <circle cx="236" cy="388" r="4" fill="#b9bec7">
          <animate attributeName="r" values="4;11;17" dur="1.3s" begin="-0.65s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0.4;0" dur="1.3s" begin="-0.65s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Giraffe front leg reaching to the steering wheel -->
    <path d="M370 300 Q352 340 324 352" fill="none" stroke="#f6c14f" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M369 301 Q352 339 326 350" fill="none" stroke="#e0a63c" stroke-width="3" stroke-linecap="round"/>

    <!-- Steering wheel wiggles with hoof on it -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="10 320 354; -10 320 354; 10 320 354" dur="2.6s" repeatCount="indefinite"/>
      <line x1="320" y1="354" x2="348" y2="366" stroke="#2c3038" stroke-width="6" stroke-linecap="round"/>
      <circle cx="320" cy="354" r="15" fill="none" stroke="#2c3038" stroke-width="5"/>
      <line x1="307" y1="354" x2="333" y2="354" stroke="#2c3038" stroke-width="3"/>
      <line x1="320" y1="341" x2="320" y2="367" stroke="#2c3038" stroke-width="3"/>
      <ellipse cx="306" cy="354" rx="7.5" ry="10" fill="#6b4423" stroke="#4a3018" stroke-width="2"/>
      <ellipse cx="305" cy="351" rx="3" ry="4.5" fill="#8a5a33"/>
    </g>

    <!-- Wheels -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 302 402" to="360 302 402" dur="1.2s" repeatCount="indefinite"/>
        <circle cx="302" cy="402" r="24" fill="#2c3038" stroke="#1c1f25" stroke-width="3"/>
        <g stroke="#1c1f25" stroke-width="2.5">
          <line x1="302" y1="380" x2="302" y2="388"/>
          <line x1="302" y1="416" x2="302" y2="424"/>
          <line x1="280" y1="402" x2="288" y2="402"/>
          <line x1="316" y1="402" x2="324" y2="402"/>
        </g>
        <circle cx="302" cy="402" r="15" fill="#cfd5dd" stroke="#9aa1ad" stroke-width="2"/>
        <g stroke="#9aa1ad" stroke-width="3">
          <line x1="302" y1="395" x2="302" y2="409"/>
          <line x1="295" y1="402" x2="309" y2="402"/>
        </g>
        <circle cx="302" cy="402" r="5" fill="#2c3038"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 460 402" to="360 460 402" dur="1.2s" repeatCount="indefinite"/>
        <circle cx="460" cy="402" r="24" fill="#2c3038" stroke="#1c1f25" stroke-width="3"/>
        <g stroke="#1c1f25" stroke-width="2.5">
          <line x1="460" y1="380" x2="460" y2="388"/>
          <line x1="460" y1="416" x2="460" y2="424"/>
          <line x1="438" y1="402" x2="446" y2="402"/>
          <line x1="474" y1="402" x2="482" y2="402"/>
        </g>
        <circle cx="460" cy="402" r="15" fill="#cfd5dd" stroke="#9aa1ad" stroke-width="2"/>
        <g stroke="#9aa1ad" stroke-width="3">
          <line x1="460" y1="395" x2="460" y2="409"/>
          <line x1="453" y1="402" x2="467" y2="402"/>
        </g>
        <circle cx="460" cy="402" r="5" fill="#2c3038"/>
      </g>
    </g>
  </g>
</svg>
