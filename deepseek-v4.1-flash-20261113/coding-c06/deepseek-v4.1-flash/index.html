<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07131b" />
  <title>四靶弓射 · 计时挑战</title>
  <style>
    :root {
      --paper: #f8f0dc;
      --muted: #b8c4bd;
      --gold: #ffd36a;
      --gold-2: #e6a941;
      --green: #7dffc1;
      --line: rgba(241, 229, 190, 0.16);
      --panel: rgba(10, 23, 27, 0.92);
      --panel-2: rgba(7, 17, 20, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #061016;
      color: var(--paper);
      font-family: "Trebuchet MS", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    #game {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #game.playing {
      cursor: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.6vw, 36px);
      background:
        radial-gradient(circle at 50% 12%, rgba(106, 139, 128, 0.2), transparent 42%),
        linear-gradient(180deg, rgba(3, 10, 14, 0.62), rgba(3, 9, 12, 0.88));
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow: auto;
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .panel {
      position: relative;
      width: min(1020px, 100%);
      max-height: calc(100dvh - clamp(28px, 5vw, 72px));
      overflow-y: auto;
      padding: clamp(22px, 4vw, 44px);
      border: 1px solid rgba(255, 230, 167, 0.2);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(14, 34, 38, 0.96), rgba(7, 18, 21, 0.94)),
        var(--panel);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .panel::-webkit-scrollbar {
      width: 8px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 99px;
    }

    .start-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: clamp(24px, 4vw, 54px);
      align-items: start;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Palatino Linotype", "Songti SC", "STSong", serif;
      font-size: clamp(2.7rem, 7vw, 5rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
      text-shadow: 0 6px 26px rgba(0, 0, 0, 0.45);
    }

    .subtitle {
      max-width: 38rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.2vw, 1.05rem);
      line-height: 1.7;
    }

    .instructions {
      display: grid;
      gap: 9px;
      margin: 26px 0 24px;
    }

    .instruction {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(247, 240, 221, 0.9);
      font-size: 0.92rem;
    }

    .instruction b {
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 211, 106, 0.32);
      border-radius: 50%;
      background: rgba(255, 211, 106, 0.1);
      color: var(--gold);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .name-row label {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .name-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.055);
      color: var(--paper);
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .name-row input:focus {
      border-color: rgba(255, 211, 106, 0.64);
      background: rgba(255, 255, 255, 0.075);
    }

    .primary,
    .ghost {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .primary {
      padding: 13px 22px;
      background: linear-gradient(180deg, #ffe08a, #e6a63c);
      color: #231707;
      font-weight: 900;
      letter-spacing: 0.02em;
      box-shadow:
        0 12px 30px rgba(230, 166, 60, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .primary:active {
      transform: translateY(0);
      filter: brightness(0.98);
    }

    .primary.big {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.04rem;
    }

    .ghost {
      padding: 12px 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.055);
      color: var(--paper);
      font-weight: 700;
    }

    .ghost:hover {
      border-color: rgba(255, 230, 167, 0.32);
      background: rgba(255, 255, 255, 0.09);
    }

    .score-panel {
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.18);
    }

    .score-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .score-head h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .score-head > span {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
    }

    .text-btn {
      padding: 5px 2px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .text-btn:hover {
      color: var(--gold);
    }

    .leader-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .leader-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
    }

    .leader-row:nth-child(1) {
      border-color: rgba(255, 206, 100, 0.24);
      background: linear-gradient(90deg, rgba(255, 206, 100, 0.16), rgba(255, 255, 255, 0.035));
    }

    .leader-row.current {
      border-color: rgba(125, 255, 190, 0.6);
      box-shadow: inset 0 0 0 1px rgba(125, 255, 190, 0.15);
    }

    .leader-rank {
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .leader-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leader-time {
      color: #ffe4a4;
      font-size: 0.88rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 14px 10px;
      border: 1px dashed rgba(255, 255, 255, 0.11);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    .footnote {
      margin: 14px 0 0;
      color: rgba(184, 196, 189, 0.8);
      font-size: 0.75rem;
      line-height: 1.6;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .hud.show {
      opacity: 1;
    }

    .hud-top {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(760px, calc(100vw - 28px));
      transform: translateX(-50%);
    }

    .stat-pill,
    .timer-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(5, 18, 22, 0.62);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(8px);
    }

    .stat-pill {
      padding: 10px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .stat-pill strong {
      color: var(--paper);
      font-size: 1rem;
    }

    .timer-card {
      display: flex;
      align-items: baseline;
      justify-content: center;
      min-width: 148px;
      padding: 8px 16px 7px;
      border-color: rgba(255, 214, 120, 0.22);
      border-radius: 14px;
    }

    .timer-label {
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
    }

    .timer-card strong {
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      line-height: 1;
      color: #ffe2a3;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .timer-card em {
      color: var(--muted);
      font-size: 0.78rem;
      font-style: normal;
    }

    .controls-hint {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(248, 240, 220, 0.62);
      font-size: 0.76rem;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .charge {
      position: fixed;
      left: 50%;
      bottom: max(58px, calc(48px + env(safe-area-inset-bottom)));
      z-index: 12;
      width: min(260px, 58vw);
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }

    .charge.show {
      opacity: 1;
    }

    .charge-track {
      height: 9px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.32);
    }

    .charge-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7bffc0, #ffd35e, #ff8c5f);
      box-shadow: 0 0 16px rgba(255, 211, 94, 0.35);
      transition: width 0.03s linear;
    }

    .charge.ready .charge-track {
      border-color: rgba(255, 220, 126, 0.58);
      box-shadow: 0 0 18px rgba(255, 205, 95, 0.18);
    }

    .charge-label {
      margin-top: 5px;
      color: rgba(248, 240, 220, 0.62);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-align: center;
    }

    .sound-btn {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 80;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      background: rgba(5, 18, 22, 0.58);
      color: rgba(248, 240, 220, 0.74);
      font-size: 0.72rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.18s ease;
    }

    .sound-btn:hover {
      border-color: rgba(255, 220, 126, 0.36);
      color: var(--paper);
    }

    .sound-btn.muted {
      opacity: 0.55;
    }

    .toast {
      position: fixed;
      top: 16%;
      left: 50%;
      z-index: 90;
      padding: 10px 16px;
      border: 1px solid rgba(255, 230, 167, 0.2);
      border-radius: 999px;
      background: rgba(5, 18, 22, 0.82);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.3);
      color: var(--paper);
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -8px);
      backdrop-filter: blur(10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .end-panel {
      width: min(640px, 100%);
      text-align: center;
    }

    .end-panel h1 {
      font-size: clamp(2.6rem, 8vw, 4rem);
    }

    .result-time {
      margin: 4px 0 12px;
      color: #ffe09b;
      font-size: clamp(3.8rem, 15vw, 7rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 42px rgba(255, 197, 82, 0.25);
    }

    .result-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .result-line strong {
      color: var(--green);
      font-size: 1.1rem;
    }

    .result-message {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .end-score {
      max-width: 560px;
      margin: 22px auto 0;
      text-align: left;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
    }

    @media (max-width: 820px) {
      .start-panel {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    @media (max-width: 600px) {
      .hud-top {
        gap: 6px;
      }

      .stat-pill {
        padding: 8px 10px;
        font-size: 0.73rem;
      }

      .stat-pill strong {
        font-size: 0.87rem;
      }

      .timer-card {
        min-width: 120px;
        padding: 7px 10px 6px;
      }

      .timer-card strong {
        font-size: 1.35rem;
      }

      .timer-label {
        font-size: 0.6rem;
      }

      .controls-hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="弓箭射击游戏画面"></canvas>

  <div id="hud" class="hud" aria-hidden="true">
    <div class="hud-top">
      <div class="stat-pill">命中 <strong id="hitCount">0</strong><span>/4</span></div>
      <div class="timer-card">
        <span class="timer-label">用时</span>
        <strong id="timerValue">0.00</strong>
        <em>s</em>
      </div>
      <div class="stat-pill">最佳 <strong id="bestValue">--</strong></div>
    </div>
    <div class="controls-hint">按住鼠标 / 空格蓄力 · 松开射箭</div>
  </div>

  <div id="chargeWrap" class="charge" aria-hidden="true">
    <div class="charge-track"><div id="chargeFill" class="charge-fill"></div></div>
    <div class="charge-label">拉弓力量</div>
  </div>

  <button id="soundBtn" class="sound-btn" type="button" aria-label="切换音效">音效：开</button>

  <div id="startOverlay" class="overlay show">
    <div class="panel start-panel">
      <section class="hero">
        <div class="eyebrow">四靶计时挑战</div>
        <h1>穿云弓射</h1>
        <p class="subtitle">命中全部 4 个移动靶。用尽可能短的时间结束挑战，登上本地排行榜。</p>

        <div class="instructions">
          <div class="instruction"><b>01</b><span>移动鼠标或手指瞄准</span></div>
          <div class="instruction"><b>02</b><span>按住蓄力，松开射箭</span></div>
          <div class="instruction"><b>03</b><span>命中四个靶子，计时结束</span></div>
        </div>

        <div class="name-row">
          <label for="playerName">射手名</label>
          <input id="playerName" maxlength="12" autocomplete="nickname" value="神射手" />
        </div>

        <button id="startBtn" class="primary big" type="button">开始挑战</button>
      </section>

      <aside class="score-panel">
        <div class="score-head">
          <h2>本地排行榜</h2>
          <button id="clearScores" class="text-btn" type="button">清空</button>
        </div>
        <ol id="startLeaderboard" class="leader-list"></ol>
        <p class="footnote">排行榜保存在本机浏览器中。时间越短，名次越高。</p>
      </aside>
    </div>
  </div>

  <div id="endOverlay" class="overlay" aria-hidden="true">
    <div class="panel end-panel">
      <div class="eyebrow">挑战完成</div>
      <h1>四靶全中</h1>
      <div class="result-time" id="resultTime">0.00s</div>
      <div class="result-line">
        <span>本次排名</span>
        <strong id="resultRank">#1</strong>
      </div>
      <p id="resultMessage" class="result-message"></p>

      <div class="score-panel end-score">
        <div class="score-head">
          <h2>排行榜</h2>
          <span>TOP 10</span>
        </div>
        <ol id="endLeaderboard" class="leader-list"></ol>
      </div>

      <div class="actions">
        <button id="replayBtn" class="primary" type="button">再来一局</button>
        <button id="menuBtn" class="ghost" type="button">返回主菜单</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const els = {
        hud: document.getElementById("hud"),
        hitCount: document.getElementById("hitCount"),
        timerValue: document.getElementById("timerValue"),
        bestValue: document.getElementById("bestValue"),
        chargeWrap: document.getElementById("chargeWrap"),
        chargeFill: document.getElementById("chargeFill"),
        startOverlay: document.getElementById("startOverlay"),
        endOverlay: document.getElementById("endOverlay"),
        startBtn: document.getElementById("startBtn"),
        replayBtn: document.getElementById("replayBtn"),
        menuBtn: document.getElementById("menuBtn"),
        clearScores: document.getElementById("clearScores"),
        nameInput: document.getElementById("playerName"),
        startLeaderboard: document.getElementById("startLeaderboard"),
        endLeaderboard: document.getElementById("endLeaderboard"),
        resultTime: document.getElementById("resultTime"),
        resultRank: document.getElementById("resultRank"),
        resultMessage: document.getElementById("resultMessage"),
        toast: document.getElementById("toast"),
        soundBtn: document.getElementById("soundBtn")
      };

      const TARGET_COUNT = 4;
      const DRAW_TIME = 0.58;
      const MIN_POWER = 0.1;
      const STORAGE_KEY = "archery_four_targets_scores_v1";
      const NAME_KEY = "archery_four_targets_name_v1";
      const SOUND_KEY = "archery_four_targets_sound_v1";
      const MAX_LEADERS = 50;
      const TAU = Math.PI * 2;

      const TARGET_DEFS = [
        { nx: 0.24, ny: 0.29, vx: 0.095, vy: 0.055, minX: 0.08, maxX: 0.4, minY: 0.18, maxY: 0.38, size: 1.0, phase: 0.4 },
        { nx: 0.76, ny: 0.27, vx: -0.11, vy: 0.05, minX: 0.6, maxX: 0.92, minY: 0.16, maxY: 0.37, size: 0.92, phase: 1.8 },
        { nx: 0.31, ny: 0.52, vx: 0.08, vy: -0.045, minX: 0.12, maxX: 0.48, minY: 0.43, maxY: 0.6, size: 1.08, phase: 3.0 },
        { nx: 0.74, ny: 0.51, vx: -0.09, vy: 0.06, minX: 0.54, maxX: 0.9, minY: 0.42, maxY: 0.6, size: 0.96, phase: 4.5 }
      ];

      const view = { w: 0, h: 0, dpr: 1 };
      const aim = { x: 0, y: 0 };

      let state = "menu";
      let targets = [];
      let leaders = [];
      let playerName = "神射手";
      let lastEntryId = null;
      let startTime = 0;
      let finalTime = 0;
      let resultDelay = 0;
      let charging = false;
      let chargeSource = null;
      let activePointerId = null;
      let chargeStart = 0;
      let drawProgress = 0;
      let arrows = [];
      let particles = [];
      let rings = [];
      let floaters = [];
      let scenery = { stars: [], clouds: [], grass: [] };
      let toastTimer = 0;
      let soundEnabled = true;
      let audioCtx = null;
      let lastFrame = performance.now();

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const lerp = (a, b, t) => a + (b - a) * t;
      const rand = (min = 0, max = 1) => min + Math.random() * (max - min);

      function mulberry32(seed) {
        return function random() {
          seed |= 0;
          seed = (seed + 0x6D2B79F5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function formatTime(seconds) {
        const s = Number(seconds);
        return Number.isFinite(s) ? s.toFixed(2) : "0.00";
      }

      function safeLocalGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function safeLocalSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // 本地存储不可用时仍然保留内存中的排行榜。
        }
      }

      function init() {
        loadSettings();
        leaders = loadLeaders();
        updateSoundButton();
        els.nameInput.value = playerName;

        bindEvents();
        resizeCanvas();
        resetTargets();

        aim.x = view.w * 0.5;
        aim.y = view.h * 0.42;

        renderLeaderboards();
        updateHUD(performance.now());
        requestAnimationFrame(loop);
      }

      function loadSettings() {
        const savedName = safeLocalGet(NAME_KEY);
        if (savedName) {
          playerName = savedName.trim().slice(0, 12) || "神射手";
        }

        const savedSound = safeLocalGet(SOUND_KEY);
        if (savedSound !== null) {
          soundEnabled = savedSound === "1";
        }
      }

      function loadLeaders() {
        const raw = safeLocalGet(STORAGE_KEY);
        if (!raw) return [];

        try {
          const data = JSON.parse(raw);
          if (!Array.isArray(data)) return [];

          return data
            .filter(
              (entry) =>
                entry &&
                typeof entry.name === "string" &&
                Number.isFinite(Number(entry.time)) &&
                Number(entry.time) >= 0
            )
            .map((entry, index) => ({
              id: String(entry.id || `legacy_${index}`),
              name: entry.name.trim().slice(0, 12) || "射手",
              time: Number(entry.time),
              timestamp: Number(entry.timestamp) || 0
            }))
            .sort(compareLeaders)
            .slice(0, MAX_LEADERS);
        } catch {
          return [];
        }
      }

      function saveLeaders() {
        safeLocalSet(STORAGE_KEY, JSON.stringify(leaders));
      }

      function compareLeaders(a, b) {
        return a.time - b.time || a.timestamp - b.timestamp;
      }

      function renderLeaderboards(highlightId = null) {
        populateLeaderboard(els.startLeaderboard, 5, null);
        populateLeaderboard(els.endLeaderboard, 10, highlightId || lastEntryId);
        updateBestValue();
      }

      function populateLeaderboard(listEl, limit, highlightId) {
        if (!listEl) return;

        while (listEl.firstChild) {
          listEl.removeChild(listEl.firstChild);
        }

        if (!leaders.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "暂无记录，等你登顶";
          listEl.appendChild(empty);
          return;
        }

        leaders.slice(0, limit).forEach((entry, index) => {
          const row = document.createElement("li");
          row.className = "leader-row" + (entry.id === highlightId ? " current" : "");

          const rank = document.createElement("span");
          rank.className = "leader-rank";
          rank.textContent = String(index + 1).padStart(2, "0");

          const name = document.createElement("span");
          name.className = "leader-name";
          name.textContent = entry.name;
          name.title = entry.name;

          const time = document.createElement("span");
          time.className = "leader-time";
          time.textContent = `${formatTime(entry.time)}s`;

          row.append(rank, name, time);
          listEl.appendChild(row);
        });
      }

      function updateBestValue() {
        if (!leaders.length) {
          els.bestValue.textContent = "--";
          return;
        }

        let best = Infinity;
        for (const entry of leaders) {
          if (entry.time < best) best = entry.time;
        }
        els.bestValue.textContent = `${formatTime(best)}s`;
      }

      function bindEvents() {
        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 120));

        canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
        window.addEventListener("pointermove", onPointerMove, { passive: true });
        window.addEventListener("pointerup", onPointerUp);
        window.addEventListener("pointercancel", onPointerCancel);
        canvas.addEventListener("contextmenu", (event) => event.preventDefault());

        window.addEventListener("keydown", onKeyDown);
        window.addEventListener("keyup", onKeyUp);
        window.addEventListener("blur", cancelCharge);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelCharge();
        });

        els.startBtn.addEventListener("click", startGame);
        els.replayBtn.addEventListener("click", startGame);
        els.menuBtn.addEventListener("click", showMenu);
        els.clearScores.addEventListener("click", clearScores);
        els.soundBtn.addEventListener("click", toggleSound);

        els.nameInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            startGame();
          }
        });
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width || window.innerWidth));
        const h = Math.max(1, Math.round(rect.height || window.innerHeight));
        const dpr = Math.min(2, window.devicePixelRatio || 1);

        view.w = w;
        view.h = h;
        view.dpr = dpr;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!aim.x && !aim.y) {
          aim.x = w * 0.5;
          aim.y = h * 0.42;
        } else {
          aim.x = clamp(aim.x, 0, w);
          aim.y = clamp(aim.y, 0, h);
        }

        setupScenery(w, h);
      }

      function setupScenery(w, h) {
        const rnd = mulberry32(0x51a7c0de);

        const starCount = Math.max(40, Math.round((w * h) / 18000));
        scenery.stars = Array.from({ length: starCount }, () => ({
          x: rnd(),
          y: rnd() * 0.46,
          r: 0.4 + rnd() * 1.2,
          phase: rnd() * TAU,
          alpha: 0.14 + rnd() * 0.5
        }));

        scenery.clouds = Array.from({ length: 6 }, () => ({
          x: rnd() * 1.3 - 0.15,
          y: 0.08 + rnd() * 0.24,
          scale: 0.5 + rnd() * 1.05,
          speed: 0.0015 + rnd() * 0.003,
          alpha: 0.06 + rnd() * 0.12
        }));

        const grassCount = Math.round(clamp((w * h) / 9000, 60, 180));
        scenery.grass = Array.from({ length: grassCount }, () => ({
          x: rnd() * w,
          y: h * (0.68 + rnd() * 0.34),
          len: 4 + rnd() * 15,
          lean: (rnd() - 0.5) * 0.9,
          phase: rnd() * TAU,
          alpha: 0.08 + rnd() * 0.28
        }));
      }

      function resetTargets() {
        targets = TARGET_DEFS.map((def, index) => ({
          id: index,
          x: def.nx,
          y: def.ny,
          vx: def.vx,
          vy: def.vy,
          minX: def.minX,
          maxX: def.maxX,
          minY: def.minY,
          maxY: def.maxY,
          size: def.size,
          phase: def.phase,
          dead: false,
          death: 0
        }));
      }

      function onPointerDown(event) {
        if (state !== "playing") return;
        if (event.pointerType === "mouse" && event.button !== 0) return;

        updateAimFromEvent(event);
        beginCharge("pointer", event.pointerId);
        event.preventDefault();

        if (canvas.setPointerCapture) {
          try {
            canvas.setPointerCapture(event.pointerId);
          } catch {
            // 某些浏览器/设备可能不支持捕获指针。
          }
        }
      }

      function onPointerMove(event) {
        if (state === "playing") {
          updateAimFromEvent(event);
        }
      }

      function onPointerUp(event) {
        if (!charging || chargeSource !== "pointer") return;
        if (activePointerId !== null && event.pointerId !== activePointerId) return;

        updateAimFromEvent(event);
        releaseShot();
      }

      function onPointerCancel(event) {
        if (!charging || chargeSource !== "pointer") return;
        if (activePointerId !== null && event.pointerId !== activePointerId) return;
        cancelCharge();
      }

      function onKeyDown(event) {
        if (event.code !== "Space" || event.repeat) return;

        const active = document.activeElement;
        if (
          active &&
          (active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.isContentEditable)
        ) {
          return;
        }

        if (state === "playing" && !charging) {
          event.preventDefault();
          beginCharge("keyboard");
        }
      }

      function onKeyUp(event) {
        if (event.code === "Space" && charging && chargeSource === "keyboard") {
          event.preventDefault();
          releaseShot();
        }
      }

      function updateAimFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        aim.x = clamp(event.clientX - rect.left, 0, view.w);
        aim.y = clamp(event.clientY - rect.top, 0, view.h);
      }

      function beginCharge(source, pointerId = null) {
        if (state !== "playing" || charging) return;

        ensureAudio();
        charging = true;
        chargeSource = source;
        activePointerId = source === "pointer" ? pointerId : null;
        chargeStart = performance.now();
        drawProgress = 0;
      }

      function cancelCharge() {
        if (!charging) return;
        charging = false;
        drawProgress = 0;
        chargeSource = null;
        activePointerId = null;
      }

      function releaseShot() {
        if (!charging) return;

        const power = clamp(
          (performance.now() - chargeStart) / (DRAW_TIME * 1000),
          0,
          1
        );

        charging = false;
        drawProgress = 0;
        chargeSource = null;
        activePointerId = null;

        if (state !== "playing") return;

        if (power < MIN_POWER) {
          playWeak();
          showToast("拉弓不足，按住蓄力后再松手。", 1200);
          return;
        }

        const hit = findTargetAt(aim.x, aim.y);
        fireArrow(aim.x, aim.y, power);
        playRelease(power);

        if (hit) {
          hitTarget(hit);
        } else {
          missShot(aim.x, aim.y);
        }
      }

      function startGame() {
        ensureAudio();

        const rawName = els.nameInput.value.trim().slice(0, 12);
        playerName = rawName || "神射手";
        els.nameInput.value = playerName;
        safeLocalSet(NAME_KEY, playerName);

        state = "playing";
        hideOverlay(els.startOverlay);
        hideOverlay(els.endOverlay);
        els.hud.classList.add("show");
        els.hud.setAttribute("aria-hidden", "false");

        resetTargets();
        arrows = [];
        particles = [];
        rings = [];
        floaters = [];

        charging = false;
        chargeSource = null;
        activePointerId = null;
        drawProgress = 0;
        finalTime = 0;
        resultDelay = 0;
        lastEntryId = null;
        startTime = performance.now();

        aim.x = view.w * 0.5;
        aim.y = view.h * 0.42;
        canvas.classList.add("playing");

        renderLeaderboards();
        updateHUD(startTime);
        showToast("命中全部 4 个靶子，计时开始！", 1100);

        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
      }

      function showMenu() {
        state = "menu";
        charging = false;
        chargeSource = null;
        activePointerId = null;
        drawProgress = 0;
        arrows = [];
        particles = [];
        rings = [];
        floaters = [];
        finalTime = 0;
        resultDelay = 0;
        lastEntryId = null;

        resetTargets();
        hideOverlay(els.endOverlay);
        showOverlay(els.startOverlay);

        els.hud.classList.remove("show");
        els.hud.setAttribute("aria-hidden", "true");
        els.chargeWrap.classList.remove("show");
        canvas.classList.remove("playing");

        aim.x = view.w * 0.5;
        aim.y = view.h * 0.42;

        renderLeaderboards();
        updateHUD(performance.now());
      }

      function hitTarget(target) {
        if (state !== "playing" || target.dead) return;

        target.dead = true;
        target.death = 0;

        const metrics = getTargetMetrics(target);
        spawnHitEffects(metrics.x, metrics.y);
        playHit();

        let alive = 0;
        for (const item of targets) {
          if (!item.dead) alive++;
        }

        if (alive === 0) {
          finalTime = Math.max(0, (performance.now() - startTime) / 1000);
          state = "ending";
          resultDelay = 0.95;

          charging = false;
          chargeSource = null;
          activePointerId = null;
          drawProgress = 0;
          canvas.classList.remove("playing");

          playFinish();
          showToast("四靶全中！正在结算…", 900);
        }
      }

      function missShot(x, y) {
        spawnMissEffects(x, y);
        playMiss();
      }

      function finishRun() {
        if (state !== "ending") return;
        state = "finished";
        canvas.classList.remove("playing");

        const entry = {
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          name: playerName,
          time: Number(finalTime.toFixed(3)),
          timestamp: Date.now()
        };

        leaders.push(entry);
        leaders.sort(compareLeaders);

        const fullRank = leaders.findIndex((item) => item.id === entry.id) + 1;
        const totalBeforeSlice = leaders.length;
        const firstTime = leaders[0] ? leaders[0].time : entry.time;

        leaders = leaders.slice(0, MAX_LEADERS);
        saveLeaders();
        lastEntryId = entry.id;

        renderLeaderboards(entry.id);
        updateBestValue();

        els.resultTime.textContent = `${formatTime(finalTime)}s`;
        els.resultRank.textContent = `#${fullRank}`;

        if (fullRank === 1) {
          els.resultMessage.textContent =
            totalBeforeSlice > 1
              ? "新纪录！你是本机最快的射手。"
              : "首个记录已经诞生，继续挑战极限。";
        } else {
          const diff = Math.max(0, finalTime - firstTime);
          els.resultMessage.textContent = `距离第一名还差 ${diff.toFixed(2)} 秒。`;
        }

        els.hud.classList.remove("show");
        els.hud.setAttribute("aria-hidden", "true");
        els.chargeWrap.classList.remove("show");
        showOverlay(els.endOverlay);

        setTimeout(() => {
          if (state === "finished") {
            els.replayBtn.focus({ preventScroll: true });
          }
        }, 60);
      }

      function clearScores() {
        if (!leaders.length) return;
        if (!window.confirm("确定清空本机排行榜吗？此操作不可撤销。")) return;

        leaders = [];
        lastEntryId = null;
        saveLeaders();
        renderLeaderboards();
        updateHUD(performance.now());
        showToast("排行榜已清空", 1300);
      }

      function showOverlay(element) {
        element.classList.add("show");
        element.setAttribute("aria-hidden", "false");
      }

      function hideOverlay(element) {
        element.classList.remove("show");
        element.setAttribute("aria-hidden", "true");
      }

      function showToast(text, duration = 1500) {
        els.toast.textContent = text;
        els.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          els.toast.classList.remove("show");
        }, duration);
      }

      function getTargetMetrics(target) {
        const base = Math.max(25, Math.min(56, Math.min(view.w, view.h) * 0.06));
        return {
          x: target.x * view.w,
          y: target.y * view.h,
          r: base * (target.size || 1)
        };
      }

      function findTargetAt(x, y) {
        for (let i = targets.length - 1; i >= 0; i--) {
          const target = targets[i];
          if (target.dead) continue;

          const metrics = getTargetMetrics(target);
          if (Math.hypot(x - metrics.x, y - metrics.y) <= metrics.r) {
            return target;
          }
        }
        return null;
      }

      function isAimingAtTarget(target) {
        const metrics = getTargetMetrics(target);
        return Math.hypot(aim.x - metrics.x, aim.y - metrics.y) <= metrics.r;
      }

      function fireArrow(targetX, targetY, power) {
        const x0 = view.w * 0.5;
        const y0 = view.h * 0.96;
        const dist = Math.hypot(targetX - x0, targetY - y0);
        const speedFactor = 0.8 + power * 0.6;
        const duration = clamp(0.12 + dist / (2600 * speedFactor), 0.12, 0.34);

        arrows.push({
          x0,
          y0,
          x1: targetX,
          y1: targetY,
          t: 0,
          duration,
          arc: Math.min(34, dist * 0.03)
        });
      }

      function spawnHitEffects(x, y) {
        const colors = ["#ffe28b", "#ffb457", "#ff7b5a", "#f6eed4"];

        for (let i = 0; i < 38; i++) {
          const angle = rand(0, TAU);
          const speed = rand(50, 340);

          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 40,
            gravity: 620,
            drag: 1.9,
            age: 0,
            life: rand(0.42, 0.95),
            size: rand(1.3, 4),
            color: colors[i % colors.length]
          });
        }

        rings.push({
          x,
          y,
          age: 0,
          life: 0.45,
          r0: 8,
          r1: 72,
          color: "rgba(255,228,142,.9)"
        });

        floaters.push({
          x,
          y: y - 12,
          age: 0,
          life: 0.9,
          text: "命中!",
          color: "#ffe29a",
          size: clamp(view.w * 0.018, 14, 22)
        });
      }

      function spawnMissEffects(x, y) {
        for (let i = 0; i < 14; i++) {
          const angle = rand(0, TAU);
          const speed = rand(20, 110);

          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 220,
            drag: 2.2,
            age: 0,
            life: rand(0.25, 0.55),
            size: rand(1, 2.4),
            color: i % 2 === 0 ? "#9b9c84" : "#6c7869"
          });
        }

        rings.push({
          x,
          y,
          age: 0,
          life: 0.3,
          r0: 4,
          r1: 26,
          color: "rgba(215,235,220,.42)"
        });
      }

      function ensureAudio() {
        if (!soundEnabled) return;

        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            audioCtx = new AudioContextClass();
          }

          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
        } catch {
          audioCtx = null;
        }
      }

      function tone(freq, duration, type = "sine", volume = 0.04, endFreq = null) {
        if (!soundEnabled || !audioCtx) return;

        try {
          const now = audioCtx.currentTime;
          const oscillator = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          oscillator.type = type;
          oscillator.frequency.setValueAtTime(Math.max(1, freq), now);

          if (endFreq) {
            oscillator.frequency.exponentialRampToValueAtTime(
              Math.max(1, endFreq),
              now + duration
            );
          }

          gain.gain.setValueAtTime(Math.max(0.0001, volume), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          oscillator.connect(gain);
          gain.connect(audioCtx.destination);
          oscillator.start(now);
          oscillator.stop(now + duration + 0.02);
        } catch {
          // 忽略音频异常。
        }
      }

      function playRelease(power) {
        tone(320 + power * 130, 0.08, "triangle", 0.035, 95);
      }

      function playWeak() {
        tone(170, 0.06, "square", 0.02, 110);
      }

      function playHit() {
        tone(760, 0.09, "sine", 0.065);
        setTimeout(() => tone(1080, 0.12, "sine", 0.045), 45);
      }

      function playMiss() {
        tone(120, 0.09, "sawtooth", 0.025, 65);
      }

      function playFinish() {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, index) => {
          setTimeout(() => tone(freq, 0.16, "sine", 0.05), index * 105);
        });
      }

      function toggleSound() {
        soundEnabled = !soundEnabled;
        safeLocalSet(SOUND_KEY, soundEnabled ? "1" : "0");
        updateSoundButton();

        if (soundEnabled) {
          ensureAudio();
          tone(660, 0.08, "sine", 0.03);
        }
      }

      function updateSoundButton() {
        els.soundBtn.textContent = soundEnabled ? "音效：开" : "音效：关";
        els.soundBtn.classList.toggle("muted", !soundEnabled);
        els.soundBtn.setAttribute("aria-label", soundEnabled ? "关闭音效" : "开启音效");
      }

      function update(dt, now) {
        for (const target of targets) {
          if (target.dead) {
            if (target.death < 1) {
              target.death = Math.min(1, target.death + dt * 3.2);
            }
            continue;
          }

          if (state === "menu" || state === "playing") {
            target.x += target.vx * dt;
            target.y += target.vy * dt;

            if (target.x < target.minX) {
              target.x = target.minX;
              target.vx = Math.abs(target.vx);
            } else if (target.x > target.maxX) {
              target.x = target.maxX;
              target.vx = -Math.abs(target.vx);
            }

            if (target.y < target.minY) {
              target.y = target.minY;
              target.vy = Math.abs(target.vy);
            } else if (target.y > target.maxY) {
              target.y = target.maxY;
              target.vy = -Math.abs(target.vy);
            }
          }
        }

        if (state === "playing" && charging) {
          drawProgress = clamp(
            (now - chargeStart) / (DRAW_TIME * 1000),
            0,
            1
          );
        } else {
          drawProgress = 0;
        }

        for (let i = arrows.length - 1; i >= 0; i--) {
          const arrow = arrows[i];
          arrow.t += dt / arrow.duration;
          if (arrow.t >= 1) arrows.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.age += dt;

          if (particle.age >= particle.life) {
            particles.splice(i, 1);
            continue;
          }

          particle.vy += particle.gravity * dt;
          particle.vx *= 1 - particle.drag * dt;
          particle.vy *= 1 - particle.drag * dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
        }

        for (let i = rings.length - 1; i >= 0; i--) {
          const ring = rings[i];
          ring.age += dt;
          if (ring.age >= ring.life) {
            rings.splice(i, 1);
          }
        }

        for (let i = floaters.length - 1; i >= 0; i--) {
          const floater = floaters[i];
          floater.age += dt;
          if (floater.age >= floater.life) {
            floaters.splice(i, 1);
          }
        }

        if (state === "ending") {
          resultDelay -= dt;
          if (resultDelay <= 0) {
            finishRun();
          }
        }
      }

      function updateHUD(now) {
        let elapsed = 0;
        if (state === "playing") {
          elapsed = Math.max(0, (now - startTime) / 1000);
        } else if (state === "ending" || state === "finished") {
          elapsed = finalTime;
        }

        els.timerValue.textContent = formatTime(elapsed);

        let hits = 0;
        for (const target of targets) {
          if (target.dead) hits++;
        }
        els.hitCount.textContent = String(hits);

        if (leaders.length) {
          let best = Infinity;
          for (const entry of leaders) {
            if (entry.time < best) best = entry.time;
          }
          els.bestValue.textContent = `${formatTime(best)}s`;
        } else {
          els.bestValue.textContent = "--";
        }

        const chargeActive = charging && state === "playing";
        els.chargeWrap.classList.toggle("show", chargeActive);
        els.chargeWrap.classList.toggle(
          "ready",
          chargeActive && drawProgress >= MIN_POWER
        );
        els.chargeFill.style.width = `${
          chargeActive ? Math.round(drawProgress * 100) : 0
        }%`;
      }

      function loop(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
        lastFrame = now;

        update(dt, now);
        render(now);
        updateHUD(now);

        requestAnimationFrame(loop);
      }

      function render(now) {
        const w = view.w;
        const h = view.h;

        ctx.clearRect(0, 0, w, h);
        drawBackground(now);

        for (const target of targets) {
          if (!target.dead || target.death < 1) {
            drawTarget(target, now);
          }
        }

        drawArrows();
        drawParticles();
        drawRings();
        drawFloaters();

        if (state === "playing") {
          drawBow();
          drawAim(now);
        }

        drawVignette();
      }

      function drawBackground(now) {
        const w = view.w;
        const h = view.h;
        const t = now / 1000;
        const horizon = h * 0.635;

        const sky = ctx.createLinearGradient(0, 0, 0, horizon + 2);
        sky.addColorStop(0, "#071322");
        sky.addColorStop(0.35, "#142e44");
        sky.addColorStop(0.68, "#5a4b5b");
        sky.addColorStop(0.88, "#b56d58");
        sky.addColorStop(1, "#e5a961");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, horizon + 2);

        ctx.save();
        for (const star of scenery.stars) {
          const twinkle = 0.6 + 0.4 * Math.sin(t * 0.9 + star.phase);
          const alpha =
            star.alpha *
            twinkle *
            (1 - Math.min(1, star.y / 0.5) * 0.35);

          if (alpha < 0.02) continue;

          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#e5f3ff";
          ctx.beginPath();
          ctx.arc(star.x * w, star.y * h * 0.8, star.r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        const sunX = w * 0.76;
        const sunY = h * 0.225;
        const sunR = Math.min(w, h) * 0.062;

        ctx.save();
        const glow = ctx.createRadialGradient(
          sunX,
          sunY,
          0,
          sunX,
          sunY,
          sunR * 5.2
        );
        glow.addColorStop(0, "rgba(255,231,173,0.5)");
        glow.addColorStop(0.25, "rgba(255,195,105,0.18)");
        glow.addColorStop(1, "rgba(255,195,105,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR * 5.2, 0, TAU);
        ctx.fill();

        ctx.fillStyle = "rgba(255,232,171,0.92)";
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, TAU);
        ctx.fill();
        ctx.restore();

        for (const cloud of scenery.clouds) {
          let phase = (cloud.x + t * cloud.speed) % 1.25;
          if (phase < 0) phase += 1.25;

          const x = phase * (w + 360) - 180;
          const y = cloud.y * h;
          const scale =
            cloud.scale *
            Math.max(0.62, Math.min(1.7, Math.min(w, h) / 760));

          drawCloud(x, y, scale, cloud.alpha);
        }

        drawMountains(horizon, w, h);

        const ground = ctx.createLinearGradient(0, horizon, 0, h);
        ground.addColorStop(0, "#3d5737");
        ground.addColorStop(0.3, "#263e2c");
        ground.addColorStop(1, "#08140d");
        ctx.fillStyle = ground;
        ctx.fillRect(0, horizon, w, h - horizon);

        ctx.save();
        const pathGrad = ctx.createLinearGradient(0, horizon, 0, h);
        pathGrad.addColorStop(0, "rgba(226,215,164,0.42)");
        pathGrad.addColorStop(1, "rgba(226,215,164,0)");
        ctx.fillStyle = pathGrad;
        ctx.beginPath();
        ctx.moveTo(w * 0.46, horizon);
        ctx.lineTo(w * 0.54, horizon);
        ctx.lineTo(w * 0.77, h);
        ctx.lineTo(w * 0.23, h);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.lineWidth = 1;
        for (const grass of scenery.grass) {
          const sway = Math.sin(t * 1.7 + grass.phase) * grass.len * 0.22;
          ctx.strokeStyle = `rgba(172, 213, 144, ${grass.alpha})`;
          ctx.beginPath();
          ctx.moveTo(grass.x, grass.y);
          ctx.quadraticCurveTo(
            grass.x + grass.lean * grass.len * 0.4,
            grass.y - grass.len * 0.55,
            grass.x + grass.lean * grass.len + sway,
            grass.y - grass.len
          );
          ctx.stroke();
        }
        ctx.restore();

        const mist = ctx.createLinearGradient(
          0,
          horizon - h * 0.05,
          0,
          horizon + h * 0.12
        );
        mist.addColorStop(0, "rgba(236,178,113,0)");
        mist.addColorStop(0.45, "rgba(217,155,107,0.1)");
        mist.addColorStop(1, "rgba(236,200,150,0)");
        ctx.fillStyle = mist;
        ctx.fillRect(0, horizon - h * 0.05, w, h * 0.2);
      }

      function drawCloud(x, y, scale, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#f8d8bb";
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.ellipse(-48, 2, 58, 15, 0, 0, TAU);
        ctx.ellipse(1, -5, 44, 22, 0, 0, TAU);
        ctx.ellipse(49, 2, 54, 14, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawMountains(horizon, w, h) {
        mountainLayer(
          horizon + 1,
          w,
          h,
          "#172a3c",
          [0.045, 0.09, 0.055, 0.13, 0.075, 0.15, 0.08, 0.12, 0.045, 0.09, 0.035],
          0.9
        );

        mountainLayer(
          horizon + 2,
          w,
          h,
          "#14262b",
          [0.02, 0.06, 0.1, 0.045, 0.085, 0.03, 0.11, 0.055, 0.09, 0.04, 0.075, 0.025],
          0.96
        );
      }

      function mountainLayer(horizon, w, h, color, heights, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();

        ctx.moveTo(0, horizon);
        ctx.lineTo(0, horizon - h * heights[0]);

        for (let i = 1; i < heights.length; i++) {
          const x = (i / (heights.length - 1)) * w;
          const y = horizon - h * heights[i];
          ctx.lineTo(x, y);
        }

        ctx.lineTo(w, horizon);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawTarget(target, now) {
        if (target.dead && target.death >= 1) return;

        const metrics = getTargetMetrics(target);
        const hovered =
          state === "playing" &&
          !target.dead &&
          isAimingAtTarget(target);

        const death = target.dead ? clamp(target.death, 0, 1) : 0;
        const alpha = target.dead ? 1 - death : 1;
        const scale = target.dead ? 1 - easeOutCubic(death) * 0.55 : 1;

        ctx.save();
        ctx.globalAlpha = 0.2 * alpha;
        ctx.fillStyle = "#020908";
        ctx.beginPath();
        ctx.ellipse(
          metrics.x,
          metrics.y + metrics.r * 1.25,
          metrics.r * 0.85,
          metrics.r * 0.23,
          0,
          0,
          TAU
        );
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(metrics.x, metrics.y);
        ctx.rotate(
          Math.sin(now * 0.0011 + (target.phase || 0)) * 0.018 +
            (target.dead ? death * 0.45 : 0)
        );
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;

        if (hovered) {
          const pulse = Math.sin(now * 0.006) * 2;

          ctx.strokeStyle = "rgba(126,255,195,.52)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, metrics.r + 10 + pulse, 0, TAU);
          ctx.stroke();

          ctx.strokeStyle = "rgba(126,255,195,.14)";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(0, 0, metrics.r + 16 + pulse, 0, TAU);
          ctx.stroke();
        }

        ctx.fillStyle = "#52351f";
        ctx.beginPath();
        ctx.arc(0, 0, metrics.r + 4, 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#8e673a";
        ctx.beginPath();
        ctx.arc(-1, -1.5, metrics.r + 2, 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#f4e7c8";
        ctx.beginPath();
        ctx.arc(0, 0, metrics.r, 0, TAU);
        ctx.fill();

        const ringDefs = [
          { rr: 0.78, color: "#c84949" },
          { rr: 0.58, color: "#f4e7c8" },
          { rr: 0.38, color: "#c84949" },
          { rr: 0.18, color: "#f0bd47" }
        ];

        for (const ring of ringDefs) {
          ctx.fillStyle = ring.color;
          ctx.beginPath();
          ctx.arc(0, 0, metrics.r * ring.rr, 0, TAU);
          ctx.fill();
        }

        ctx.fillStyle = "#5a381e";
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(1.5, metrics.r * 0.035), 0, TAU);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,240,202,.65)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, metrics.r, 0, TAU);
        ctx.stroke();

        ctx.fillStyle = "rgba(9,24,25,.82)";
        ctx.beginPath();
        ctx.arc(0, metrics.r + 13, 9.5, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,230,168,.22)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "#f6e7c6";
        ctx.font = '700 10px "Trebuchet MS", system-ui, sans-serif';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(target.id + 1), 0, metrics.r + 13.5);

        ctx.restore();
      }

      function drawAim(now) {
        const hover = findTargetAt(aim.x, aim.y);
        let color = hover
          ? "rgba(130,255,198,.95)"
          : "rgba(255,255,255,.92)";

        if (charging && drawProgress >= MIN_POWER) {
          color = hover
            ? "rgba(130,255,198,1)"
            : "rgba(255,225,132,.98)";
        }

        const pulse = Math.sin(now * 0.006) * 0.7;
        const r = 12 + pulse - (charging ? drawProgress * 2.5 : 0);

        ctx.save();
        ctx.translate(aim.x, aim.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        ctx.globalAlpha = 0.96;

        for (let i = 0; i < 4; i++) {
          const angle = (i * Math.PI) / 2;
          const x1 = Math.cos(angle) * r;
          const y1 = Math.sin(angle) * r;
          const x2 = Math.cos(angle) * (r - 6);
          const y2 = Math.sin(angle) * (r - 6);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(0, 0, 2.4, 0, TAU);
        ctx.fill();

        if (charging) {
          ctx.strokeStyle =
            drawProgress >= MIN_POWER
              ? "rgba(255,216,110,.95)"
              : "rgba(255,255,255,.35)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(
            0,
            0,
            r + 7,
            -Math.PI / 2,
            -Math.PI / 2 + TAU * drawProgress
          );
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawBow() {
        const w = view.w;
        const h = view.h;
        const cx = w * 0.5;
        const tipY = h * 0.91;
        const span = Math.min(w * 0.31, 380);
        const bottomY = h + 74;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.strokeStyle = "rgba(34,22,13,.92)";
        ctx.lineWidth = Math.max(7, Math.min(w, h) * 0.009);
        ctx.beginPath();
        ctx.moveTo(cx - span, tipY);
        ctx.quadraticCurveTo(cx - span * 0.48, h * 1.005, cx, bottomY);
        ctx.quadraticCurveTo(cx + span * 0.48, h * 1.005, cx + span, tipY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(213,163,92,.62)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - span, tipY);
        ctx.quadraticCurveTo(cx - span * 0.48, h * 1.005, cx, bottomY);
        ctx.quadraticCurveTo(cx + span * 0.48, h * 1.005, cx + span, tipY);
        ctx.stroke();

        const nockY =
          h * 0.92 +
          (charging ? drawProgress * Math.min(h * 0.04, 30) : 0);

        ctx.strokeStyle = "rgba(235,242,229,.52)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx - span, tipY);
        ctx.lineTo(cx, nockY);
        ctx.lineTo(cx + span, tipY);
        ctx.stroke();

        if (charging) {
          ctx.strokeStyle = "rgba(255,224,145,.72)";
          ctx.lineWidth = 2.1;
          ctx.beginPath();
          ctx.moveTo(cx, nockY);
          ctx.lineTo(aim.x, aim.y);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawArrows() {
        for (const arrow of arrows) {
          const p = clamp(arrow.t, 0, 1);
          const e = 1 - Math.pow(1 - p, 3);

          const x = lerp(arrow.x0, arrow.x1, e);
          const y =
            lerp(arrow.y0, arrow.y1, e) -
            Math.sin(Math.PI * e) * arrow.arc;

          const angle = Math.atan2(
            arrow.y1 - arrow.y0,
            arrow.x1 - arrow.x0
          );

          const length = clamp(
            Math.hypot(arrow.x1 - arrow.x0, arrow.y1 - arrow.y0) * 0.12,
            18,
            46
          );

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.globalAlpha = p > 0.96 ? (1 - p) / 0.04 : 1;

          ctx.strokeStyle = "rgba(247,231,194,.9)";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(-length, 0);
          ctx.lineTo(0, 0);
          ctx.stroke();

          ctx.fillStyle = "#e8ba5e";
          ctx.beginPath();
          ctx.moveTo(-length + 3, 0);
          ctx.lineTo(-length - 7, -4.5);
          ctx.lineTo(-length + 1, -0.5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#d96350";
          ctx.beginPath();
          ctx.moveTo(-length + 3, 0);
          ctx.lineTo(-length - 7, 4.5);
          ctx.lineTo(-length + 1, 0.5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#f8f1dd";
          ctx.beginPath();
          ctx.moveTo(4.5, 0);
          ctx.lineTo(-1.5, -3);
          ctx.lineTo(-1.5, 3);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }
      }

      function drawParticles() {
        ctx.save();
        for (const particle of particles) {
          const k = 1 - particle.age / particle.life;
          if (k <= 0) continue;

          ctx.globalAlpha = Math.max(0, k);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(
            particle.x,
            particle.y,
            Math.max(0.4, particle.size * k),
            0,
            TAU
          );
          ctx.fill();
        }
        ctx.restore();
      }

      function drawRings() {
        ctx.save();
        for (const ring of rings) {
          const k = clamp(ring.age / ring.life, 0, 1);
          const radius =
            ring.r0 +
            (ring.r1 - ring.r0) * (1 - Math.pow(1 - k, 2));

          ctx.globalAlpha = (1 - k) * 0.9;
          ctx.strokeStyle = ring.color;
          ctx.lineWidth = 2 * (1 - k) + 0.5;
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, radius, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawFloaters() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (const floater of floaters) {
          const k = clamp(floater.age / floater.life, 0, 1);
          ctx.globalAlpha = 1 - k;
          ctx.fillStyle = floater.color;
          ctx.font = `800 ${floater.size}px "Trebuchet MS", "PingFang SC", sans-serif`;
          ctx.fillText(
            floater.text,
            floater.x,
            floater.y - k * 28
          );
        }

        ctx.restore();
      }

      function drawVignette() {
        const w = view.w;
        const h = view.h;
        const gradient = ctx.createRadialGradient(
          w * 0.5,
          h * 0.48,
          Math.min(w, h) * 0.22,
          w * 0.5,
          h * 0.52,
          Math.max(w, h) * 0.76
        );

        gradient.addColorStop(0, "rgba(0,0,0,0)");
        gradient.addColorStop(0.66, "rgba(1,8,9,.08)");
        gradient.addColorStop(1, "rgba(1,5,7,.58)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);
      }

      init();
    })();
  </script>
</body>
</html>
