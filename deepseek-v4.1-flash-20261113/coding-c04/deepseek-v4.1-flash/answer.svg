<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Giraffe driving a tiny car</title>
  <desc id="desc">A cartoon giraffe with a long spotted neck drives a tiny red convertible. The car bobs, wheels spin, clouds drift, road lines move, and exhaust puffs appear.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="60%" stop-color="#d9f4ff"/>
      <stop offset="100%" stop-color="#fff7dd"/>
    </linearGradient>

    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4f58"/>
      <stop offset="1" stop-color="#24272d"/>
    </linearGradient>

    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.65" stop-color="#e73c46"/>
      <stop offset="1" stop-color="#b41f2a"/>
    </linearGradient>

    <radialGradient id="headGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f2b544"/>
    </radialGradient>

    <linearGradient id="neckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc7a"/>
      <stop offset="1" stop-color="#e8a736"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <clipPath id="neckClip">
      <path d="M420 440 C408 390 410 318 432 250 C440 225 450 200 464 178 L505 190 C500 222 495 260 494 305 C493 365 495 410 486 446 Z"/>
    </clipPath>
  </defs>

  <!-- Sky -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- Sun and rotating rays -->
  <g transform="translate(770 105)">
    <g stroke="#ffd56a" stroke-width="6" stroke-linecap="round" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <line x1="0" y1="-72" x2="0" y2="-96"/>
      <line x1="51" y1="-51" x2="68" y2="-68"/>
      <line x1="72" y1="0" x2="96" y2="0"/>
      <line x1="51" y1="51" x2="68" y2="68"/>
      <line x1="0" y1="72" x2="0" y2="96"/>
      <line x1="-51" y1="51" x2="-68" y2="68"/>
      <line x1="-72" y1="0" x2="-96" y2="0"/>
      <line x1="-51" y1="-51" x2="-68" y2="-68"/>
    </g>
    <circle r="48" fill="#ffe58a"/>
    <circle r="38" fill="#fff2b3" opacity="0.65"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.88">
    <animateTransform attributeName="transform" type="translate" values="1050 0; -250 0" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(120 90)">
      <path d="M0 55 Q0 32 22 32 Q26 8 52 8 Q78 8 84 30 Q112 26 116 50 Q134 50 134 64 L0 64 Z" fill="#ffffff"/>
    </g>
  </g>

  <g opacity="0.66">
    <animateTransform attributeName="transform" type="translate" values="1100 0; -300 0" dur="38s" begin="-12s" repeatCount="indefinite"/>
    <g transform="translate(480 150) scale(0.78)">
      <path d="M0 55 Q0 32 22 32 Q26 8 52 8 Q78 8 84 30 Q112 26 116 50 Q134 50 134 64 L0 64 Z" fill="#ffffff"/>
    </g>
  </g>

  <g opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="1000 0; -250 0" dur="46s" begin="-22s" repeatCount="indefinite"/>
    <g transform="translate(300 55) scale(0.55)">
      <path d="M0 55 Q0 32 22 32 Q26 8 52 8 Q78 8 84 30 Q112 26 116 50 Q134 50 134 64 L0 64 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Distant hills -->
  <path d="M0 470 Q100 380 210 455 Q300 370 420 455 Q520 390 650 458 Q740 410 900 462 L900 510 L0 510 Z" fill="#9edf6e"/>
  <path d="M0 485 Q120 430 250 480 Q380 430 520 482 Q660 440 900 486 L900 520 L0 520 Z" fill="#7ccd54"/>

  <!-- Trees -->
  <g>
    <rect x="74" y="440" width="10" height="60" rx="5" fill="#8a5a2b"/>
    <circle cx="79" cy="432" r="30" fill="#68c84f"/>
    <circle cx="58" cy="444" r="20" fill="#58b840"/>
    <circle cx="100" cy="444" r="22" fill="#7bd85b"/>
  </g>

  <g>
    <rect x="792" y="444" width="9" height="55" rx="4" fill="#8a5a2b"/>
    <circle cx="797" cy="438" r="26" fill="#68c84f"/>
    <circle cx="778" cy="450" r="18" fill="#58b840"/>
    <circle cx="818" cy="450" r="20" fill="#7bd85b"/>
  </g>

  <!-- Road -->
  <rect x="0" y="500" width="900" height="100" fill="url(#road)"/>
  <rect x="0" y="500" width="900" height="6" fill="#727782"/>
  <g stroke="#ffe28a" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 0" dur="0.65s" repeatCount="indefinite"/>
      <path d="M-80 565 H-40 M0 565 H40 M80 565 H120 M160 565 H200 M240 565 H280 M320 565 H360 M400 565 H440 M480 565 H520 M560 565 H600 M640 565 H680 M720 565 H760 M800 565 H840 M880 565 H920 M960 565 H1000" fill="none"/>
    </g>
  </g>

  <!-- Moving rig: car + giraffe -->
  <g id="rig">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 -2; 0 0" dur="1.1s" repeatCount="indefinite"/>

    <!-- Exhaust puffs -->
    <g transform="translate(312 500)">
      <g fill="#cfd8dc">
        <circle cx="0" cy="0" r="7" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="0 0; -26 -7; -64 -20" dur="1.6s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0; 0.75; 0" dur="1.6s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="9" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="0 0; -32 -10; -78 -26" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0; 0.6; 0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="6" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="0 0; -24 -8; -60 -24" dur="1.5s" begin="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0; 0.7; 0" dur="1.5s" begin="1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Tail -->
    <g transform="translate(322 476)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-12; 10; -12" dur="1.8s" repeatCount="indefinite"/>
        <path d="M0 0 C-18 -2 -34 8 -48 2" fill="none" stroke="#c9821a" stroke-width="7" stroke-linecap="round"/>
        <path d="M-48 2 C-56 -4 -62 2 -56 8 C-64 12 -56 20 -48 12 Z" fill="#8d4e1d"/>
      </g>
    </g>

    <!-- Rear wheel -->
    <g transform="translate(380 515)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/>
        <circle r="32" fill="#1e2226" stroke="#111111" stroke-width="5"/>
        <circle r="17" fill="#cfd8dc"/>
        <path d="M0 -15 L0 15 M-15 0 L15 0 M-10 -10 L10 10 M-10 10 L10 -10" stroke="#8a939b" stroke-width="4" stroke-linecap="round"/>
        <circle r="5" fill="#58616a"/>
        <circle cx="-10" cy="-10" r="2" fill="#ffffff" opacity="0.75"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g transform="translate(535 515)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/>
        <circle r="32" fill="#1e2226" stroke="#111111" stroke-width="5"/>
        <circle r="17" fill="#cfd8dc"/>
        <path d="M0 -15 L0 15 M-15 0 L15 0 M-10 -10 L10 10 M-10 10 L10 -10" stroke="#8a939b" stroke-width="4" stroke-linecap="round"/>
        <circle r="5" fill="#58616a"/>
        <circle cx="-10" cy="-10" r="2" fill="#ffffff" opacity="0.75"/>
      </g>
    </g>

    <!-- Car body -->
    <path d="M318 478 Q318 438 355 430 L520 430 Q535 430 548 446 L600 462 Q612 468 612 490 L612 500 Q612 510 602 510 L330 510 Q318 510 318 498 Z"
          fill="url(#carBody)" stroke="#9a1c26" stroke-width="4" filter="url(#shadow)"/>
    <path d="M335 445 Q470 462 595 450" stroke="#ff9b9b" stroke-width="3" fill="none" opacity="0.55"/>

    <!-- Cockpit opening and seat -->
    <path d="M394 432 Q430 414 505 430 L500 448 L410 448 Z" fill="#263238"/>
    <path d="M420 438 Q412 404 434 398 L452 400 Q462 418 456 440 Z" fill="#6d3b24" stroke="#4e2818" stroke-width="2"/>

    <!-- Car trim -->
    <path d="M430 448 Q418 475 430 500" stroke="#a81f2b" stroke-width="3" fill="none" opacity="0.7"/>
    <rect x="438" y="465" width="16" height="5" rx="2" fill="#ffd5d5"/>

    <!-- Windshield -->
    <path d="M510 432 L538 390 L555 397 L532 438 Z" fill="#b3e5fc" opacity="0.75" stroke="#2e6f8e" stroke-width="3" stroke-linejoin="round"/>

    <!-- Steering wheel -->
    <g transform="rotate(-15 505 425)">
      <ellipse cx="505" cy="425" rx="17" ry="10" fill="none" stroke="#2d3238" stroke-width="5"/>
      <line x1="505" y1="435" x2="505" y2="450" stroke="#2d3238" stroke-width="4"/>
      <circle cx="505" cy="425" r="4" fill="#2d3238"/>
    </g>

    <!-- Lights and bumpers -->
    <ellipse cx="598" cy="480" rx="8" ry="12" fill="#ffe082" stroke="#b97812" stroke-width="2"/>
    <rect x="598" y="498" width="20" height="10" rx="5" fill="#cfd8dc" stroke="#6b727a" stroke-width="2"/>
    <rect x="318" y="474" width="8" height="18" rx="4" fill="#ff7043" stroke="#9a1c26" stroke-width="1.5"/>

    <!-- Side mirror -->
    <line x1="520" y1="420" x2="536" y2="410" stroke="#9a1c26" stroke-width="3"/>
    <ellipse cx="540" cy="408" rx="8" ry="5" fill="#ff8a8a" stroke="#9a1c26" stroke-width="2"/>

    <!-- Giraffe neck -->
    <path d="M420 440 C408 390 410 318 432 250 C440 225 450 200 464 178 L505 190 C500 222 495 260 494 305 C493 365 495 410 486 446 Z"
          fill="url(#neckGrad)" stroke="#c9821a" stroke-width="4"/>

    <!-- Neck spots -->
    <g clip-path="url(#neckClip)">
      <ellipse cx="430" cy="420" rx="22" ry="28" fill="#c77a2a" transform="rotate(-15 430 420)"/>
      <ellipse cx="475" cy="385" rx="17" ry="24" fill="#b96a24" transform="rotate(18 475 385)"/>
      <ellipse cx="435" cy="350" rx="20" ry="25" fill="#c77a2a" transform="rotate(-10 435 350)"/>
      <ellipse cx="475" cy="315" rx="15" ry="22" fill="#b96a24" transform="rotate(10 475 315)"/>
      <ellipse cx="450" cy="275" rx="17" ry="21" fill="#c77a2a" transform="rotate(-8 450 275)"/>
      <ellipse cx="475" cy="235" rx="13" ry="17" fill="#b96a24" transform="rotate(12 475 235)"/>
      <ellipse cx="465" cy="200" rx="10" ry="12" fill="#c77a2a" transform="rotate(-12 465 200)"/>
    </g>

    <!-- Giraffe head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 485 175; 2 485 175; -2 485 175" dur="2.8s" repeatCount="indefinite"/>

      <!-- Ears -->
      <path d="M485 125 C455 102 450 88 462 80 C478 80 493 105 502 124 Z" fill="#e0a12e" stroke="#a5621b" stroke-width="3"/>
      <path d="M535 105 C558 78 575 75 583 86 C580 105 562 118 545 120 Z" fill="#e0a12e" stroke="#a5621b" stroke-width="3"/>

      <!-- Ossicones -->
      <path d="M494 100 L491 72" stroke="#a5621b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="490" cy="67" r="11" fill="#8d4e1d"/>
      <path d="M528 93 L533 66" stroke="#a5621b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="535" cy="61" r="11" fill="#8d4e1d"/>

      <!-- Head shape -->
      <path d="M470 160 C462 120 484 88 520 88 C558 88 585 108 592 142 C598 175 574 198 540 203 C505 208 477 191 470 160 Z"
            fill="url(#headGrad)" stroke="#c9821a" stroke-width="4"/>

      <!-- Muzzle -->
      <ellipse cx="575" cy="168" rx="34" ry="25" fill="#ffeaa7" stroke="#c9821a" stroke-width="3"/>
      <ellipse cx="586" cy="164" rx="4" ry="6" fill="#7a4a1a" transform="rotate(12 586 164)"/>
      <ellipse cx="599" cy="172" rx="3" ry="5" fill="#7a4a1a" transform="rotate(12 599 172)" opacity="0.8"/>

      <!-- Smile -->
      <path d="M560 181 Q580 192 598 181" fill="none" stroke="#8b531a" stroke-width="3" stroke-linecap="round"/>

      <!-- Eye -->
      <circle cx="548" cy="132" r="7" fill="#2c1a0e"/>
      <circle cx="546" cy="130" r="2.5" fill="#ffffff"/>

      <!-- Blush -->
      <circle cx="540" cy="163" r="9" fill="#ff8f8f" opacity="0.35"/>
    </g>

    <!-- Arm on steering wheel -->
    <path d="M460 431 C478 415 498 416 510 424" fill="none" stroke="#e0a12e" stroke-width="12" stroke-linecap="round"/>
    <circle cx="511" cy="424" r="7" fill="#8d4e1d"/>
  </g>
</svg>
