<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>3D 数据可视化地球仪 · Three.js</title>
<style>
  :root{
    --cyan:#3fd0ff;
    --blue:#4f7dff;
    --text:#dbeafe;
    --muted:#7f9cc4;
    --panel: rgba(8,18,38,0.62);
    --border: rgba(80,160,255,0.28);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#02040c;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;}
  #scene canvas{display:block;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #ui > *{pointer-events:auto;}

  /* ---------- 标题 ---------- */
  .hud-title{position:absolute;top:22px;left:26px;pointer-events:none;}
  .hud-title h1{
    margin:0;font-size:17px;font-weight:700;letter-spacing:.16em;
    background:linear-gradient(90deg,#9fe9ff,#4f8dff 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hud-title p{margin:6px 0 0;font-size:10px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;}

  /* ---------- 面板通用 ---------- */
  .hud-panel{
    position:absolute;top:22px;right:26px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,20,60,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .hud-label{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px;text-transform:uppercase;}
  .metric-buttons{display:flex;gap:6px;}
  .metric-btn{
    border:1px solid rgba(90,170,255,.25);background:rgba(20,45,90,.45);
    color:#9fc4ee;font-size:12px;padding:7px 13px;border-radius:9px;cursor:pointer;
    transition:all .18s ease;font-family:inherit;white-space:nowrap;
  }
  .metric-btn:hover{background:rgba(40,90,170,.6);color:#e7f4ff;}
  .metric-btn.active{
    background:linear-gradient(135deg,rgba(63,208,255,.95),rgba(80,110,255,.95));
    color:#04121f;font-weight:700;border-color:transparent;
    box-shadow:0 0 16px rgba(70,180,255,.55);
  }

  /* ---------- 图例 ---------- */
  .hud-legend{
    position:absolute;top:134px;right:26px;width:178px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:11px 13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,20,60,.4);
  }
  .legend-title{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:8px;}
  .legend-bar{
    height:8px;border-radius:4px;
    background:linear-gradient(90deg,#1a4dd9 0%,#0dd0f2 28%,#5cf28c 52%,#ffd633 76%,#ff4d40 100%);
    box-shadow:inset 0 0 10px rgba(0,0,0,.35), 0 0 14px rgba(70,180,255,.25);
  }
  .legend-ends{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#8fb4dc;margin-top:7px;line-height:1.3;}
  .legend-ends span{white-space:nowrap;}

  /* ---------- 时间轴 ---------- */
  .hud-timeline{
    position:absolute;left:50%;transform:translateX(-50%);bottom:24px;
    width:min(700px, calc(100vw - 48px));
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:12px 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 44px rgba(0,20,60,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .play-btn{
    width:44px;height:44px;flex:0 0 auto;border-radius:50%;cursor:pointer;border:none;
    background:radial-gradient(circle at 35% 28%, #9fe9ff, #3f8dff 55%, #2b52d8);
    color:#03121f;font-size:15px;line-height:1;display:grid;place-items:center;
    box-shadow:0 0 22px rgba(70,180,255,.55);transition:transform .15s ease, box-shadow .2s ease;
  }
  .play-btn:hover{transform:scale(1.07);box-shadow:0 0 30px rgba(90,200,255,.85);}
  .play-btn:active{transform:scale(.96);}
  .timeline-body{flex:1;min-width:0;}
  .year-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px;}
  #yearLabel{font-size:21px;font-weight:800;color:#c9ecff;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(80,200,255,.5);}
  .year-sub{font-size:11px;color:var(--muted);letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;
    background:linear-gradient(90deg,#3fd0ff,#4f7dff);outline:none;cursor:pointer;display:block;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#eaf7ff;border:2px solid #3fd0ff;
    box-shadow:0 0 12px rgba(63,208,255,.95);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:#eaf7ff;
    border:2px solid #3fd0ff;box-shadow:0 0 12px rgba(63,208,255,.95);cursor:pointer;
  }

  /* ---------- 提示 ---------- */
  .hint{
    position:absolute;left:26px;bottom:98px;font-size:11px;color:#5f7fa6;letter-spacing:.08em;
    pointer-events:none;transition:opacity .6s ease;
  }
  .hint.fade{opacity:0;}

  /* ---------- Tooltip ---------- */
  .tooltip{
    position:fixed;z-index:60;pointer-events:none;white-space:nowrap;
    padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.6;
    background:rgba(5,14,30,.94);border:1px solid rgba(90,180,255,.42);
    box-shadow:0 8px 30px rgba(0,10,30,.7), 0 0 20px rgba(60,160,255,.25);
    color:#d8ecff;opacity:0;transform:translate(16px,16px);
    transition:opacity .12s ease;
  }
  .tooltip.show{opacity:1;}
  .tooltip .k{color:#7fb2e0;}
  .tooltip b{color:#eaf7ff;}

  /* ---------- 城市卡片 ---------- */
  .city-card{
    position:fixed;z-index:50;width:278px;
    background:linear-gradient(160deg,rgba(11,28,56,.97),rgba(5,12,26,.97));
    border:1px solid rgba(90,180,255,.4);border-radius:16px;padding:16px;
    box-shadow:0 20px 56px rgba(0,10,30,.75), 0 0 44px rgba(50,140,255,.18);
    opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .city-card.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title{font-size:19px;font-weight:800;color:#eaf6ff;letter-spacing:.04em;}
  .card-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em;}
  .card-close{
    background:none;border:none;color:#7f9cc4;font-size:20px;line-height:1;
    cursor:pointer;padding:0 2px;font-family:inherit;transition:color .15s;
  }
  .card-close:hover{color:#fff;}
  .card-stats{margin-top:14px;display:grid;gap:9px;}
  .stat{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#94b7da;gap:8px;}
  .stat b{color:#dcefff;font-size:14px;font-variant-numeric:tabular-nums;font-weight:700;}
  .stat.active b{color:#5fe0ff;text-shadow:0 0 14px rgba(80,220,255,.65);}
  .stat small{color:#6f92b8;font-weight:400;font-size:10px;}
  .card-foot{
    margin-top:14px;padding-top:11px;border-top:1px solid rgba(90,170,255,.16);
    font-size:11px;color:#7d9fc4;display:flex;justify-content:space-between;
  }
  .card-foot b{color:#bfe6ff;}

  /* ---------- 加载 ---------- */
  .loading{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;
    font-size:12px;letter-spacing:.2em;color:#6f9cc9;pointer-events:none;
    transition:opacity .7s ease;
  }
  .loading.hide{opacity:0;}

  @media (max-width: 720px){
    .hud-title h1{font-size:14px;letter-spacing:.1em;}
    .hud-title p{font-size:9px;}
    .hud-panel{top:16px;right:14px;padding:9px 10px;border-radius:12px;}
    .metric-btn{font-size:11px;padding:6px 9px;}
    .hud-legend{top:122px;right:14px;width:150px;padding:9px 11px;}
    .hud-timeline{bottom:14px;padding:10px 14px;gap:10px;}
    #yearLabel{font-size:17px;}
    .hint{display:none;}
    .city-card{width:min(278px, calc(100vw - 32px));}
  }
</style>
</head>
<body>

<div id="scene"></div>

<div id="ui">
  <header class="hud-title">
    <h1>地球数据可视化</h1>
    <p>3D Data Globe · Three.js</p>
  </header>

  <div class="hud-panel">
    <span class="hud-label">数据指标</span>
    <div class="metric-buttons">
      <button class="metric-btn active" data-metric="gdp">GDP</button>
      <button class="metric-btn" data-metric="pop">人口</button>
      <button class="metric-btn" data-metric="flights">航班量</button>
    </div>
  </div>

  <div class="hud-legend">
    <div class="legend-title">热力强度</div>
    <div class="legend-bar"></div>
    <div class="legend-ends">
      <span id="legendMin">低</span>
      <span id="legendMax">高</span>
    </div>
  </div>

  <div class="hud-timeline">
    <button id="playBtn" class="play-btn" aria-label="播放时间轴">▶</button>
    <div class="timeline-body">
      <div class="year-row">
        <span id="yearLabel">2024</span>
        <span class="year-sub" id="metricLabel">GDP · 全球主要城市</span>
      </div>
      <input type="range" id="yearSlider" min="2000" max="2024" step="1" value="2024" />
    </div>
  </div>

  <div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击城市查看详情 · 悬停航线查看航班</div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="city-card" id="cityCard"></div>
<div class="loading" id="loading">正在加载地球纹理…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* =========================================================================
 * 3D 数据可视化地球仪
 * 技术栈：Three.js (ESM) + importmap
 * ========================================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------------------------------------------------------
 * 0. 小工具
 * --------------------------------------------------------------- */
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function hash01(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 100000) / 100000;
}

/** 经纬度 -> 三维坐标（与 SphereGeometry 默认 UV 对齐） */
function latLonToVec3(lat, lon, r = 1) {
  const phi = (90 - lat) * DEG;
  const theta = (lon + 180) * DEG;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

/* ---------------------------------------------------------------
 * 1. 渲染器 / 场景 / 相机 / 控制器
 * --------------------------------------------------------------- */
const host = document.getElementById('scene');
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(W(), H());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040c);

const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 4000);
camera.position.set(0.45, 0.85, 2.95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.85;
controls.enablePan = false;
controls.minDistance = 1.32;
controls.maxDistance = 9;
controls.target.set(0, 0, 0);

/* 后处理：发光 */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
composer.setSize(W(), H());
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(new THREE.Vector2(W(), H()), 0.55, 0.75, 0.82);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ---------------------------------------------------------------
 * 2. 程序化贴图工具（兜底 / 光斑 / 星空）
 * --------------------------------------------------------------- */
function makeGlowTexture(size = 128) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.12, 'rgba(255,255,255,0.92)');
  g.addColorStop(0.32, 'rgba(255,255,255,0.34)');
  g.addColorStop(0.62, 'rgba(255,255,255,0.07)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeDotTexture(size = 64) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 粗略大陆轮廓（仅用于纹理加载失败时的兜底地球） */
const CONTINENTS = [
  [[-168,65],[-160,71],[-140,70],[-125,70],[-110,68],[-95,69],[-85,70],[-75,68],[-60,60],[-55,52],[-65,45],[-70,42],[-75,36],[-81,31],[-81,25],[-87,30],[-95,29],[-97,26],[-105,22],[-110,24],[-115,30],[-122,37],[-125,48],[-135,57],[-150,60],[-165,60]],
  [[-45,60],[-30,68],[-20,72],[-22,80],[-40,83],[-58,80],[-60,70],[-52,64]],
  [[-81,8],[-72,11],[-62,10],[-52,4],[-42,-2],[-35,-6],[-38,-12],[-43,-23],[-48,-25],[-58,-34],[-62,-40],[-65,-45],[-68,-52],[-73,-53],[-75,-46],[-76,-35],[-71,-20],[-70,-18],[-80,-5],[-81,0],[-79,4]],
  [[-17,15],[-16,21],[-10,27],[-2,32],[9,33],[20,32],[30,31],[35,28],[43,12],[51,12],[48,3],[42,-2],[41,-12],[35,-20],[32,-26],[26,-34],[18,-35],[12,-18],[9,-2],[3,6],[-6,5],[-13,9]],
  [[-10,36],[-9,43],[-2,44],[2,47],[7,53],[9,57],[13,55],[20,55],[22,60],[26,65],[30,70],[45,69],[60,71],[75,73],[95,76],[110,74],[130,73],[145,73],[160,70],[170,68],[178,66],[172,60],[162,58],[155,50],[142,45],[135,35],[128,33],[122,30],[120,23],[110,18],[105,10],[100,6],[98,12],[95,20],[88,22],[83,17],[78,10],[73,16],[68,24],[62,26],[57,25],[50,30],[44,38],[40,42],[35,37],[30,40],[25,40],[20,42],[14,44],[8,44],[3,42],[-2,38],[-6,36]],
  [[113,-22],[114,-34],[121,-34],[129,-32],[137,-35],[144,-38],[150,-37],[153,-28],[153,-25],[146,-19],[142,-11],[136,-12],[132,-11],[126,-14],[122,-18]],
  [[-180,-72],[180,-72],[180,-90],[-180,-90]]
];

function createFallbackEarth() {
  const cw = 1024, ch = 512;
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');

  // 海洋
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0.00, '#071d36');
  g.addColorStop(0.28, '#0a3b66');
  g.addColorStop(0.50, '#0d5885');
  g.addColorStop(0.72, '#0a3b66');
  g.addColorStop(1.00, '#071d36');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);

  // 海洋细节
  for (let i = 0; i < 14000; i++) {
    const x = Math.random() * cw, y = Math.random() * ch;
    ctx.fillStyle = `rgba(120,200,255,${Math.random() * 0.06})`;
    ctx.fillRect(x, y, 1.4, 1.4);
  }

  // 大陆
  const toXY = (lon, lat) => [(lon + 180) / 360 * cw, (90 - lat) / 180 * ch];
  CONTINENTS.forEach((poly) => {
    ctx.beginPath();
    poly.forEach(([lon, lat], i) => {
      const [x, y] = toXY(lon, lat);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = poly[0][1] < -70 ? '#dfeeff' : '#3a7f4a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,230,255,0.18)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  });

  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

function createFallbackNight() {
  const cw = 1024, ch = 512;
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000308';
  ctx.fillRect(0, 0, cw, ch);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * cw, y = Math.random() * ch;
    const r = Math.random() * 2 + 0.4;
    const a = Math.random() * 0.85;
    const gg = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
    gg.addColorStop(0, `rgba(255,214,140,${a})`);
    gg.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, r * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

/* ---------------------------------------------------------------
 * 3. 数据定义
 * --------------------------------------------------------------- */
const METRICS = {
  gdp:     { id: 'gdp',     label: 'GDP',   unit: '十亿美元', rate: 0.048 },
  pop:     { id: 'pop',     label: '人口',   unit: '百万人',   rate: 0.013 },
  flights: { id: 'flights', label: '航班量', unit: '班/日',   rate: 0.052 }
};

/* 城市演示数据（基准年为 2024，按增长率回溯） */
const CITY_DATA = [
  { name:'北京',        code:'PEK', country:'中国',       lat:39.90, lon:116.41, gdp:620,  pop:21.9, flights:1580 },
  { name:'上海',        code:'PVG', country:'中国',       lat:31.23, lon:121.47, gdp:670,  pop:24.9, flights:1720 },
  { name:'广州',        code:'CAN', country:'中国',       lat:23.13, lon:113.26, gdp:400,  pop:18.7, flights:1180 },
  { name:'深圳',        code:'SZX', country:'中国',       lat:22.54, lon:114.06, gdp:430,  pop:17.6, flights:1120 },
  { name:'香港',        code:'HKG', country:'中国',       lat:22.32, lon:114.17, gdp:380,  pop:7.5,  flights:1240 },
  { name:'东京',        code:'HND', country:'日本',       lat:35.68, lon:139.69, gdp:1150, pop:37.2, flights:1560 },
  { name:'首尔',        code:'ICN', country:'韩国',       lat:37.57, lon:126.98, gdp:780,  pop:25.6, flights:1180 },
  { name:'新加坡',      code:'SIN', country:'新加坡',     lat:1.35,  lon:103.82, gdp:520,  pop:5.9,  flights:1420 },

 * 4. 指标值计算 + 颜色映射

function metricValue(city, metricId, year) {
  const m = METRICS[metricId];
  const base = city[metricId];
  const k = 0.55 + city.seed * 0.9;
  const dt = year - 2024;
  return Math.max(base * Math.pow(1 + m.rate * k, dt), 0.001);
}

const RAMP = [
  [0.00, 0.10, 0.30, 0.90],
  [0.28, 0.05, 0.80, 0.95],
  [0.52, 0.35, 0.95, 0.55],
  [0.76, 1.00, 0.84, 0.20],
  [1.00, 1.00, 0.28, 0.24]
];

function heatColor(t) {
  t = clamp(t, 0, 1);
  for (let i = 0; i < RAMP.length - 1; i++) {
    const a = RAMP[i], b = RAMP[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const k = (t - a[0]) / Math.max(b[0] - a[0], 1e-6);
      return {
        r: lerp(a[1], b[1], k),
        g: lerp(a[2], b[2], k),
        b: lerp(a[3], b[3], k)
      };
    }
  }
  const l = RAMP[RAMP.length - 1];
  return { r: l[1], g: l[2], b: l[3] };
}

function fmtValue(metricId, v) {
  if (metricId === 'pop') return v.toFixed(1);
  if (metricId === 'gdp') return Math.round(v).toString();
  return Math.round(v).toLocaleString('en-US');
}

(function createStars() {
  const COUNT = 4200;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const c = new THREE.Color();

  for (let i = 0; i < COUNT; i++) {
    const r = 45 + Math.random() * 170;
    const th = Math.acos(THREE.MathUtils.randFloatSpread(2));
    const ph = Math.random() * Math.PI * 2;
    pos[i * 3]     = r * Math.sin(th) * Math.cos(ph);
    pos[i * 3 + 1] = r * Math.cos(th);
    pos[i * 3 + 2] = r * Math.sin(th) * Math.sin(ph);

    c.setHSL(0.54 + Math.random() * 0.14, 0.25 + Math.random() * 0.5, 0.65 + Math.random() * 0.35);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({

/* ---------- 6.1 地球本体（自定义昼夜着色器） ---------- */
const earthUniforms = {
  dayMap:        { value: fallbackDay },
  nightMap:      { value: fallbackNight },
  sunDir:        { value: sunDir },
  nightIntensity:{ value: 1.15 }
};

const earthMat = new THREE.ShaderMaterial({
  uniforms: earthUniforms,
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPos;

    void main() {
      vUv = uv;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D dayMap;
    uniform sampler2D nightMap;
    uniform vec3 sunDir;
    uniform float nightIntensity;

    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPos;

    void main() {
      vec3 N = normalize(vWorldNormal);
      vec3 V = normalize(cameraPosition - vWorldPos);

      float ndl = dot(N, sunDir);

      vec3 dayC   = texture2D(dayMap,   vUv).rgb;
      vec3 nightC = texture2D(nightMap, vUv).rgb;

      // 昼夜过渡带（柔和的分界线）
      float dayMix = smoothstep(-0.12, 0.30, ndl);

      // 昼半球：漫反射光照
      float diff = clamp(ndl, 0.0, 1.0);
      vec3 litColor = dayC * (0.16 + 0.94 * pow(diff, 0.82));

      // 夜半球：城市灯光
      float nightMask = 1.0 - dayMix;
      vec3 lightsColor = nightC * nightIntensity * (0.30 + 0.95 * nightMask);
      vec3 nightShade = nightC * 0.05 + lightsColor;

      vec3 color = mix(nightShade, litColor, dayMix);

      // 边缘大气散射（菲涅尔）
      float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.0);
      float sunFacing = clamp(ndl * 0.5 + 0.5, 0.0, 1.0);
      color += vec3(0.20, 0.48, 0.95) * fres * (0.12 + 0.88 * sunFacing) * 0.95;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), earthMat);
globeGroup.add(earthMesh);

  depthWrite: false,
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPos;
    void main() {
      vUv = uv;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D cloudMap;
    uniform vec3 sunDir;
    uniform float opacity;
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPos;

    void main() {
      vec4 t = texture2D(cloudMap, vUv);
      float m = t.a > 0.02 ? t.a : max(max(t.r, t.g), t.b);
      float ndl = dot(normalize(vWorldNormal), sunDir);
      float shade = 0.10 + 0.90 * smoothstep(-0.15, 0.40, ndl);
      float a = m * opacity * shade;
      if (a < 0.004) discard;
      gl_FragColor = vec4(vec3(1.0), a);
    }
  `
});

  side: THREE.FrontSide,
  vertexShader: /* glsl */`
    varying vec3 vN;
    varying vec3 vP;
    void main() {
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vP = wp.xyz;

    uniform vec3 uSunDir;
    varying vec3 vN;
    varying vec3 vP;
    void main() {
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vP);
      float rim = 1.0 - clamp(dot(N, V), 0.0, 1.0);
      float glow = pow(rim, 3.2);

      float sun = clamp(dot(N, uSunDir) * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(vec3(0.10, 0.32, 0.95), vec3(0.55, 0.85, 1.0), sun);

      gl_FragColor = vec4(col * glow * 1.55, 1.0);
    }
  `
});

const HEAT_W = 1024, HEAT_H = 512;
const heatCanvas = document.createElement('canvas');

heatCanvas.height = HEAT_H;
const hctx = heatCanvas.getContext('2d');

const heatTexture = new THREE.CanvasTexture(heatCanvas);

heatTexture.wrapS = THREE.RepeatWrapping;

const heatMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1.004, 96, 48),

function drawHeatMap(values, min, span) {
  hctx.clearRect(0, 0, HEAT_W, HEAT_H);
  hctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < CITIES.length; i++) {
    const c = CITIES[i];
    const t = clamp((values[i] - min) / span, 0, 1);
    const col = heatColor(t);

    const r255 = Math.round(col.r * 255);
    const g255 = Math.round(col.g * 255);
    const b255 = Math.round(col.b * 255);

    const x = (c.lon + 180) / 360 * HEAT_W;
    const y = (90 - c.lat) / 180 * HEAT_H;
    const radius = 42 + 138 * Math.pow(t, 0.78);

    const paint = (cx) => {
      const grd = hctx.createRadialGradient(cx, y, 0, cx, y, radius);
      grd.addColorStop(0.00, `rgba(${r255},${g255},${b255},0.95)`);
      grd.addColorStop(0.32, `rgba(${r255},${g255},${b255},0.40)`);
      grd.addColorStop(0.68, `rgba(${r255},${g255},${b255},0.11)`);
      grd.addColorStop(1.00, 'rgba(0,0,0,0)');
      hctx.fillStyle = grd;
      hctx.beginPath();
      hctx.arc(cx, y, radius, 0, Math.PI * 2);
      hctx.fill();
    };

    paint(x);
    // 经度环绕补齐
    if (x - radius < 0) paint(x + HEAT_W);
    if (x + radius > HEAT_W) paint(x - HEAT_W);
  }

  hctx.globalCompositeOperation = 'source-over';
  heatTexture.needsUpdate = true;
}

const arcGroup = new THREE.Group();
const pickGroup = new THREE.Group();
globeGroup.add(arcGroup);
globeGroup.add(pickGroup);

const arcMaterials = [];
const arcMeshes = [];
const pickLines = [];

const ARC_VERT = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const ARC_FRAG = /* glsl */`
  uniform float uTime;
  uniform float uOffset;
  uniform float uHover;
  uniform vec3  uColor;
  varying vec2 vUv;

  void main() {
    float s = vUv.x;

    // 沿弧线流动的光脉冲
    float head = fract(uTime * 0.16 + uOffset);
    float d = abs(s - head);
    d = min(d, 1.0 - d);

    float pulse = smoothstep(0.11, 0.0, d) * 1.55;
    float trail = smoothstep(0.30, 0.0, d) * 0.35;
    float base  = 0.10 + uHover * 0.55;

    float b = base + pulse + trail;
    gl_FragColor = vec4(uColor * b, 1.0);
  }
`;

const pickMat = new THREE.LineBasicMaterial({
  transparent: true,
  opacity: 0,
  depthWrite: false
});

ROUTES.forEach((pair, idx) => {
  const a = CITIES[pair[0]];
  const b = CITIES[pair[1]];

  const pa = latLonToVec3(a.lat, a.lon, 1);
  const pb = latLonToVec3(b.lat, b.lon, 1);

  const angle = pa.angleTo(pb);
  const height = 0.055 + angle * 0.175;

  const N = 60;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const v = pa.clone().lerp(pb, t).normalize();
    const lift = Math.sin(Math.PI * t) * height;
    v.multiplyScalar(1.0025 + lift);
    pts.push(v);
  }

  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 64, 0.0034, 6, false);

  const hue = 0.50 + 0.10 * Math.sin(idx * 1.7) + 0.03 * Math.cos(idx * 0.37);
  const color = new THREE.Color().setHSL(hue, 0.85, 0.62);

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:   { value: 0 },
      uOffset: { value: Math.random() },
      uHover:  { value: 0 },
      uColor:  { value: color }
    },
    vertexShader: ARC_VERT,
    fragmentShader: ARC_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.routeIndex = idx;
  mesh.renderOrder = 2;
  arcGroup.add(mesh);
  arcMeshes.push(mesh);
  arcMaterials.push(mat);

  // 用于拾取的细线（不可见但可 raycast）
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(lineGeo, pickMat);
  line.userData.routeIndex = idx;
  pickGroup.add(line);
  pickLines.push(line);
});

/* ---------- 数据刷新 ---------- */
function updateDataVisuals(force) {
  if (!force && Math.abs(state.year - state._lastYear) < 0.02) return;
  state._lastYear = state.year;

  const mid = state.metric;
  const year = state.year;

  const values = CITIES.map((c) => metricValue(c, mid, year));
  let min = Infinity, max = -Infinity;
  for (const v of values) {
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const span = Math.max(max - min, 1e-6);

  for (let i = 0; i < CITIES.length; i++) {
    const c = CITIES[i];
    const t = (values[i] - min) / span;
    const col = heatColor(t);

    c.sprite.material.color.setRGB(col.r, col.g, col.b);
    c.value = values[i];
    c.norm = t;
    c.targetScale = 0.020 + 0.078 * Math.pow(t, 0.75);
  }

  if (force || performance.now() - heatLastTime > 80) {
    heatLastTime = performance.now();
    drawHeatMap(values, min, span);
  }

  // 同步 UI
  yearLabel.textContent = Math.round(year);
  metricLabel.textContent = `${METRICS[mid].label} · 全球主要城市`;
  legendMin.textContent = `${fmtValue(mid, min)} ${METRICS[mid].unit}`;
  legendMax.textContent = `${fmtValue(mid, max)} ${METRICS[mid].unit}`;

  if (openCardCity !== null) {
    renderCityCard(CITIES[openCardCity]);
  }
}

document.querySelectorAll('.metric-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.metric-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.metric = btn.dataset.metric;
    updateDataVisuals(true);
  });
});

/* ---------- 时间轴 ---------- */
yearSlider.addEventListener('input', () => {
  state.year = parseFloat(yearSlider.value);
  updateDataVisuals(true);
});

playBtn.addEventListener('click', () => {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? '❚❚' : '▶';
  playBtn.setAttribute('aria-label', state.playing ? '暂停时间轴' : '播放时间轴');
  if (state.playing) hintEl.classList.add('fade');
});

/* ---------------------------------------------------------------
 * 12. 交互：悬停 / 点击
 * --------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 0.032;

const pointerNDC = new THREE.Vector2(-10, -10);

let hoveredCity = null;
let hoveredRoute = null;
let pointerDownPos = null;

function setTooltip(clientX, clientY, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('show');
  const tw = tooltipEl.offsetWidth;
  const th = tooltipEl.offsetHeight;
  let x = clientX + 16;
  let y = clientY + 16;
  if (x + tw > window.innerWidth - 12) x = clientX - tw - 16;
  if (y + th > window.innerHeight - 12) y = clientY - th - 16;
  tooltipEl.style.left = Math.max(8, x) + 'px';
  tooltipEl.style.top  = Math.max(8, y) + 'px';
}

function hideTooltip() {
  tooltipEl.classList.remove('show');
}

function clearArcHover() {
  arcMaterials.forEach((m) => { m.uniforms.uHover.value = 0; });
}

function routeInfo(idx) {
  const [i, j] = ROUTES[idx];
  const a = CITIES[i], b = CITIES[j];
  const pa = latLonToVec3(a.lat, a.lon, 1);
  const pb = latLonToVec3(b.lat, b.lon, 1);
  const angle = pa.angleTo(pb);
  const distKm = angle * 6371;
  const hours = distKm / 850;
  const daily = Math.max(1, Math.round(Math.sqrt(a.flights * b.flights) / 58));
  const airlines = ['星空航空', '环球航空', '蓝海航空', '极光航空', '天际航空'];
  const airline = airlines[Math.floor(hash01(a.code + b.code) * airlines.length)];
  const flightNo = (a.code[0] + b.code[0]) + String(100 + Math.floor(hash01(b.code + a.code) * 899));
  return { a, b, distKm, hours, daily, airline, flightNo };
}

function updateHover(clientX, clientY) {
  pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);

  // 地球遮挡判定
  const globeHits = raycaster.intersectObject(earthMesh, false);
  const globeDist = globeHits.length ? globeHits[0].distance : Infinity;

  // 1) 城市优先
  const cityHits = raycaster.intersectObjects(markerGroup.children, false);
  if (cityHits.length && cityHits[0].distance < globeDist + 0.02) {
    const sprite = cityHits[0].object;
    const city = CITIES[sprite.userData.cityIndex];
    if (hoveredCity !== city.index) {
      hoveredCity = city.index;
      clearArcHover();
      hoveredRoute = null;
    }
    const m = METRICS[state.metric];
    setTooltip(clientX, clientY,
      `<b>${city.name}</b> <span class="k">${city.country}</span><br>` +
      `${m.label}：<b>${fmtValue(state.metric, city.value)}</b> ${m.unit}`
    );
    renderer.domElement.style.cursor = 'pointer';
    return;
  }

  hoveredCity = null;

  // 2) 航线
  const routeHits = raycaster.intersectObjects(pickGroup.children, false);
  if (routeHits.length) {
    const idx = routeHits[0].object.userData.routeIndex;
    if (hoveredRoute !== idx) {
      clearArcHover();
      hoveredRoute = idx;
      arcMaterials[idx].uniforms.uHover.value = 1;
    }
    const info = routeInfo(idx);
    setTooltip(clientX, clientY,
      `<b>${info.a.name} ${info.a.code}</b> → <b>${info.b.name} ${info.b.code}</b><br>` +
      `<span class="k">距离</span> ${Math.round(info.distKm).toLocaleString('en-US')} km · ` +
      `<span class="k">时长</span> ${info.hours.toFixed(1)} h<br>` +
      `<span class="k">航班</span> ${info.flightNo} · ${info.airline} · 每日 ${info.daily} 班`
    );
    renderer.domElement.style.cursor = 'pointer';
    return;
  }

  hoveredRoute = null;
  clearArcHover();
  hideTooltip();
  renderer.domElement.style.cursor = 'grab';
}

/* ---------- 城市卡片 ---------- */
function renderCityCard(city) {
  const mid = state.metric;
  const rank = 1 + CITIES.filter((o) => o.value > city.value).length;

  const rows = ['gdp', 'pop', 'flights'].map((k) => {
    const v = metricValue(city, k, state.year);
    const active = k === mid ? ' active' : '';
    return `<div class="stat${active}">
        <span>${METRICS[k].label}</span>
        <b>${fmtValue(k, v)} <small>${METRICS[k].unit}</small></b>
      </div>`;
  }).join('');

  const latStr = Math.abs(city.lat).toFixed(1) + '°' + (city.lat >= 0 ? 'N' : 'S');
  const lonStr = Math.abs(city.lon).toFixed(1) + '°' + (city.lon >= 0 ? 'E' : 'W');

  cardEl.innerHTML = `
    <div class="card-head">
      <div>
        <div class="card-title">${city.name}</div>
        <div class="card-sub">${city.country} · ${city.code} · ${latStr} ${lonStr}</div>
      </div>
      <button class="card-close" id="cardClose" aria-label="关闭">×</button>
    </div>
    <div class="card-stats">${rows}</div>
    <div class="card-foot">
      <span>${Math.round(state.year)} 年 · 当前指标排名</span>
      <b>#${rank} / ${CITIES.length}</b>
    </div>
  `;

  const closeBtn = cardEl.querySelector('#cardClose');
  if (closeBtn) {
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeCityCard();
    });
  }
}

function showCityCard(cityIndex, clientX, clientY) {
  openCardCity = cityIndex;
  const city = CITIES[cityIndex];
  renderCityCard(city);

  cardEl.classList.add('show');

  const cw = 278;
  const chh = cardEl.offsetHeight || 230;
  let x = clientX + 22;
  let y = clientY - 60;
  if (x + cw > window.innerWidth - 16) x = clientX - cw - 22;
  if (y + chh > window.innerHeight - 16) y = window.innerHeight - chh - 16;
  if (y < 16) y = 16;
  if (x < 16) x = 16;

  cardEl.style.left = x + 'px';
  cardEl.style.top = y + 'px';
}

function closeCityCard() {
  openCardCity = null;
  cardEl.classList.remove('show');
}

/* ---------- 指针事件 ---------- */
renderer.domElement.addEventListener('pointermove', (e) => {
  if (pointerDownPos) {
    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;
    if (dx * dx + dy * dy > 36) {
      // 正在拖拽
      hideTooltip();
      clearArcHover();
      hoveredRoute = null;
      hoveredCity = null;
      return;
    }
  }
  updateHover(e.clientX, e.clientY);
});

renderer.domElement.addEventListener('pointerleave', () => {
  hideTooltip();
  clearArcHover();
  hoveredRoute = null;
  hoveredCity = null;
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  pointerDownPos = null;

  if (dx * dx + dy * dy > 36) return; // 拖拽不算点击

  // 点击拾取
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);

  const globeHits = raycaster.intersectObject(earthMesh, false);
  const globeDist = globeHits.length ? globeHits[0].distance : Infinity;

  const cityHits = raycaster.intersectObjects(markerGroup.children, false);
  if (cityHits.length && cityHits[0].distance < globeDist + 0.02) {
    const sprite = cityHits[0].object;
    showCityCard(sprite.userData.cityIndex, e.clientX, e.clientY);
    return;
  }

  // 点击空白关闭
  closeCityCard();
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCityCard();
});

/* ---------------------------------------------------------------
 * 13. 自适应
 * --------------------------------------------------------------- */
function onResize() {
  const w = W(), h = H();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  composer.setPixelRatio(dpr);
  composer.setSize(w, h);

  bloomPass.resolution.set(w, h);
}

window.addEventListener('resize', onResize);

/* ---------------------------------------------------------------
 * 14. 主循环
 * --------------------------------------------------------------- */
const clock = new THREE.Clock();

// 首帧数据初始化
updateDataVisuals(true);

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.06);
  const t = clock.elapsedTime;

  // 地球自转
  globeGroup.rotation.y += dt * 0.045;

  // 云层缓慢相对漂移（叠加一层更慢的旋转）
  cloudMesh.rotation.y += dt * 0.010;

  // 航线流动
  for (let i = 0; i < arcMaterials.length; i++) {
    arcMaterials[i].uniforms.uTime.value = t;
  }

  // 时间轴播放
  if (state.playing) {
    state.year += dt * 1.8;
    if (state.year >= 2024) state.year = 2000;
    yearSlider.value = Math.round(state.year);
    updateDataVisuals(false);
  }

  // 城市标记大小平滑过渡
  for (let i = 0; i < CITIES.length; i++) {
    const c = CITIES[i];
    const s = c.sprite.scale.x;
    const ns = lerp(s, c.targetScale, 0.14);
    c.sprite.scale.set(ns, ns, 1);
  }

  controls.update();
  composer.render();
}

animate();

/* 首次交互后淡出提示 */
let hintHidden = false;
function tryHideHint() {
  if (hintHidden) return;
  hintHidden = true;
  hintEl.classList.add('fade');
}
renderer.domElement.addEventListener('pointerdown', tryHideHint, { once: true });
setTimeout(() => hintEl.classList.add('fade'), 12000);

/* 控制台提示 */
console.log(
  '%c3D 数据可视化地球仪已启动',
  'color:#3fd0ff;font-weight:bold;font-size:14px'
);
console.log('拖拽旋转 · 滚轮缩放 · 点击城市查看信息 · 悬停航线查看航班');
</script>
