<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="540" viewBox="0 0 960 540"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title desc"
     style="max-width:100%;height:auto;display:block">
  <title id="title">Giraffe driving a tiny car</title>
  <desc id="desc">A cheerful giraffe drives a tiny coral convertible through a sunny savanna. The wheels spin, the road moves, the giraffe sways and blinks, and its scarf flutters.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ED8E8"/>
      <stop offset="0.68" stop-color="#DDF2DF"/>
      <stop offset="1" stop-color="#FFF0C7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8D98B"/>
      <stop offset="1" stop-color="#E8CF83"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B8177"/>
      <stop offset="1" stop-color="#665F5B"/>
    </linearGradient>
    <linearGradient id="carPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF987B"/>
      <stop offset="0.55" stop-color="#F37768"/>
      <stop offset="1" stop-color="#D95457"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FCFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#83C9D5" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="sunBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="neckClip" clipPathUnits="userSpaceOnUse">
      <path d="M425 323
               C429 290 426 254 430 219
               C433 185 440 153 450 125
               L487 130
               C480 161 476 193 477 226
               C478 264 484 296 489 329 Z"/>
    </clipPath>
  </defs>

  <style>
    #ride {
      animation: ride-bob .62s ease-in-out infinite;
    }
    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin .72s linear infinite;
    }
    .giraffe-upper {
      transform-box: fill-box;
      transform-origin: 50% 96%;
      animation: neck-sway 1.24s ease-in-out infinite;
    }
    .scarf-tail {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      animation: scarf-wave .5s ease-in-out infinite alternate;
    }
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s linear infinite;
    }
    .road-dashes {
      animation: road-move 1s linear infinite;
    }
    .cloud {
      animation: cloud-move 34s linear infinite;
    }
    .cloud-one {
      animation-delay: -11s;
    }
    .cloud-two {
      animation-duration: 43s;
      animation-delay: -31s;
    }
    .sun-halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-pulse 4s ease-in-out infinite;
    }
    .car-shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shadow-pulse .62s ease-in-out infinite;
    }
    .puff {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: exhaust 1.8s ease-out infinite;
    }
    .puff-two { animation-delay: -.6s; }
    .puff-three { animation-delay: -1.2s; }

    @keyframes ride-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes wheel-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes neck-sway {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1.2deg); }
    }
    @keyframes scarf-wave {
      from { transform: rotate(-4deg) scaleY(.96); }
      to { transform: rotate(5deg) scaleY(1.04); }
    }
    @keyframes blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(.08); }
    }
    @keyframes road-move {
      to { transform: translateX(-240px); }
    }
    @keyframes cloud-move {
      from { transform: translateX(-260px); }
      to { transform: translateX(1100px); }
    }
    @keyframes sun-pulse {
      0%, 100% { transform: scale(1); opacity: .65; }
      50% { transform: scale(1.12); opacity: .9; }
    }
    @keyframes shadow-pulse {
      0%, 100% { transform: scaleX(1); opacity: .22; }
      50% { transform: scaleX(.96); opacity: .16; }
    }
    @keyframes exhaust {
      0% {
        transform: translate(0, 0) scale(.45);
        opacity: 0;
      }
      18% { opacity: .5; }
      100% {
        transform: translate(-70px, -24px) scale(1.35);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #ride, .wheel, .giraffe-upper, .scarf-tail, .eye,
      .road-dashes, .cloud, .sun-halo, .car-shadow, .puff {
        animation: none !important;
      }
    }
  </style>

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <g class="sun-halo">
    <circle cx="792" cy="94" r="61" fill="#FFF1A8"
            opacity=".55" filter="url(#sunBlur)"/>
  </g>
  <circle cx="792" cy="94" r="43" fill="#FFE38A"/>
  <circle cx="779" cy="80" r="20" fill="#FFF4BC" opacity=".65"/>

  <!-- Drifting clouds -->
  <g class="cloud cloud-one" fill="#FFFCF2" opacity=".88">
    <ellipse cx="72" cy="116" rx="70" ry="20"/>
    <circle cx="45" cy="103" r="24"/>
    <circle cx="79" cy="91" r="33"/>
    <circle cx="116" cy="105" r="23"/>
  </g>
  <g class="cloud cloud-two" fill="#FFFCF2" opacity=".68">
    <ellipse cx="67" cy="164" rx="62" ry="16"/>
    <circle cx="42" cy="153" r="20"/>
    <circle cx="73" cy="143" r="27"/>
    <circle cx="105" cy="155" r="18"/>
  </g>

  <!-- Distant savanna -->
  <path d="M0 321
           C116 262 208 303 313 270
           C431 232 514 305 629 270
           C746 234 842 275 960 235
           L960 411 L0 411 Z"
        fill="#A9C58D" opacity=".7"/>
  <path d="M0 350
           C141 304 253 346 374 315
           C520 278 643 354 765 316
           C844 291 906 301 960 290
           L960 420 L0 420 Z"
        fill="#8FB47E" opacity=".72"/>
  <rect y="340" width="960" height="92" fill="url(#ground)"/>

  <!-- Acacia silhouettes -->
  <g opacity=".68">
    <path d="M83 386 L88 323 L94 323 L98 386 Z" fill="#806847"/>
    <path d="M89 342 L64 323 M91 337 L116 315"
          fill="none" stroke="#806847" stroke-width="6"
          stroke-linecap="round"/>
    <path d="M29 317
             C39 300 62 298 78 303
             C88 285 121 287 128 304
             C150 301 163 312 157 324
             C123 332  sixty 330 29 317 Z"
          fill="#668D62"/>
  </g>
  <g opacity=".55">
    <path d="M853 393 L857 341 L862 341 L866 393 Z" fill="#806847"/>
    <path d="M859 355 L838 339 M860 352 L882 334"
          fill="none" stroke="#806847" stroke-width="5"
          stroke-linecap="round"/>
    <path d="M813 333
             C825 317 844 319 852 321
             C863 304 889 309 894 322
             C914 320 926 332 918 341
             C884 346 844 345 813 333 Z"
          fill="#668D62"/>
  </g>

  <!-- Grass and road -->
  <path d="M0 402
           C228 390 436 409 642 397
           C768 390 866 393 960 385
           L960 431 L0 431 Z"
        fill="#D5BB78"/>
  <g fill="none" stroke="#78975F" stroke-width="4" stroke-linecap="round">
    <path d="M43 409 L38 393 M43 409 L51 395 M178 405 L174 391
             M735 402 L729 387 M735 402 L743 390 M906 395 L913 380"/>
  </g>
  <path d="M0 410
           C245 398 453 415 659 403
           C784 396 878 399 960 392
           L960 540 L0 540 Z"
        fill="url(#road)"/>
  <path d="M0 410
           C245 398 453 415 659 403
           C784 396 878 399 960 392"
        fill="none" stroke="#F3D8A0" stroke-width="8"/>

  <g class="road-dashes" fill="none" stroke-linecap="round">
    <path d="M-240 486 H-128 M0 486 H112 M240 486 H352
             M480 486 H592 M720 486 H832 M960 486 H1072
             M1200 486 H1312"
          stroke="#F7E5B5" stroke-width="10" opacity=".9"/>
    <path d="M-180 447 H-142 M60 447 H98 M300 447 H338
             M540 447 H578 M780 447 H818 M1020 447 H1058
             M1260 447 H1298"
          stroke="#B9AA96" stroke-width="4" opacity=".35"/>
  </g>

  <!-- Car shadow -->
  <ellipse class="car-shadow" cx="465" cy="455" rx="205" ry="17"
           fill="#302E2B"/>

  <!-- Car and giraffe -->
  <g id="ride" stroke-linecap="round" stroke-linejoin="round">
    <!-- Exhaust -->
    <g fill="#DCE2D7">
      <circle class="puff puff-one" cx="267" cy="382" r="11"/>
      <circle class="puff puff-two" cx="261" cy="378" r="9"/>
      <circle class="puff puff-three" cx="270" cy="385" r="8"/>
    </g>

    <path d="M282 388 H261" fill="none" stroke="#574B45" stroke-width="8"/>

    <!-- Seat -->
    <path d="M382 343 L378 307
             Q376 292 389 288
             Q402 285 408 299
             L423 343 Z"
          fill="#355C60" stroke="#503F39" stroke-width="4"/>
    <path d="M387 302 L393 329" fill="none"
          stroke="#6F9290" stroke-width="5"/>

    <!-- Windshield -->
    <path d="M501 337 L529 288
             Q533 281 540 284
             L550 288 L578 337 Z"
          fill="url(#glass)" stroke="#503F39" stroke-width="5"/>
    <path d="M534 292 L512 329" fill="none"
          stroke="#FFFFFF" stroke-width="5" opacity=".7"/>
    <path d="M550 289 L578 337" fill="none"
          stroke="#45656A" stroke-width="5"/>

    <!-- Giraffe body -->
    <path d="M404 344
             C403 320 407 297 424 285
             C442 273 465 278 478 294
             C488 307 491 325 489 344 Z"
          fill="#F4C66D" stroke="#5A4038" stroke-width="4"/>
    <g fill="#B87842">
      <ellipse cx="426" cy="302" rx="10" ry="8" transform="rotate(-24 426 302)"/>
      <ellipse cx="453" cy="293" rx="9" ry="7" transform="rotate(18 453 293)"/>
      <ellipse cx="465" cy="321" rx="11" ry="8" transform="rotate(-16 465 321)"/>
      <ellipse cx="425" cy="330" rx="8" ry="10"/>
    </g>

    <!-- Neck, head and scarf -->
    <g class="giraffe-upper">
      <!-- Scarf tails behind the neck -->
      <g class="scarf-tail" fill="#2FA8A0" stroke="#50463E" stroke-width="3">
        <path d="M444 176
                 C414 164 388 167 359 151
                 C366 176 392 191 439 190 Z"/>
        <path d="M442 185
                 C414 187 392 201 365 197
                 C383 217 417 209 446 194 Z"
              fill="#48BFB1"/>
      </g>

      <!-- Mane -->
      <path d="M450 132
               L437 142 L444 153 L432 162 L440 173
               L429 183 L437 194 L427 205 L434 216
               L425 229 L431 240 L424 253 L430 264
               L423 278 L429 289 L423 305 L432 316
               L444 277 L453 181 Z"
            fill="#98633F"/>

      <!-- Neck -->
      <path d="M425 323
               C429 290 426 254 430 219
               C433 185 440 153 450 125
               L487 130
               C480 161 476 193 477 226
               C478 264 484 296 489 329 Z"
            fill="#F4C66D" stroke="#5A4038" stroke-width="4"/>
      <g clip-path="url(#neckClip)" fill="#B87842">
        <ellipse cx="465" cy="148" rx="10" ry="13" transform="rotate(20 465 148)"/>
        <ellipse cx="449" cy="178" rx="9" ry="12" transform="rotate(-18 449 178)"/>
        <ellipse cx="467" cy="207" rx="11" ry="9" transform="rotate(22 467 207)"/>
        <ellipse cx="445" cy="236" rx="9" ry="13" transform="rotate(-12 445 236)"/>
        <ellipse cx="466" cy="263" rx="11" ry="10" transform="rotate(20 466 263)"/>
        <ellipse cx="446" cy="292" rx="9" ry="12"/>
        <ellipse cx="476" cy="314" rx="10" ry="8" transform="rotate(-20 476 314)"/>
      </g>

      <!-- Ossicones -->
      <path d="M461 85 L456 61 M484 83 L487 58"
            fill="none" stroke="#5A4038" stroke-width="11"/>
      <path d="M461 85 L456 61 M484 83 L487 58"
            fill="none" stroke="#F4C66D" stroke-width="6"/>
      <circle cx="456" cy="58" r="8" fill="#98633F"
              stroke="#5A4038" stroke-width="3"/>
      <circle cx="487" cy="55" r="8" fill="#98633F"
              stroke="#5A4038" stroke-width="3"/>

      <!-- Ears -->
      <path d="M455 95
               C438 94 423 83 423 72
               C439 68 454 78 461 89 Z"
            fill="#F4C66D" stroke="#5A4038" stroke-width="4"/>
      <path d="M449 87 C440 85 433 80 430 76"
            fill="none" stroke="#D99072" stroke-width="4"/>
      <path d="M495 92
               C503 76 519 70 528 77
               C525 91 512 100 501 102 Z"
            fill="#F4C66D" stroke="#5A4038" stroke-width="4"/>
      <path d="M504 91 C511 83 517 80 522 79"
            fill="none" stroke="#D99072" stroke-width="4"/>

      <!-- Head -->
      <path d="M447 117
               C440 102 446 86 462 81
               C478 76 496 83 505 98
               L530 104
               C544 107 551 119 545 132
               C539 145 520 150 501 143
               L477 139
               C462 138 452 130 447 117 Z"
            fill="#F4C66D" stroke="#5A4038" stroke-width="4"/>
      <path d="M507 109 L529 109
               C538 110 543 117 540 126
               C536 136 523 141 509 138
               C514 128 514 118 507 109 Z"
            fill="#F8DA91"/>
      <ellipse cx="466" cy="113" rx="10" ry="7"
               fill="#B87842" transform="rotate(-24 466 113)"/>
      <ellipse cx="477" cy="91" rx="8" ry="6"
               fill="#B87842" transform="rotate(18 477 91)"/>

      <!-- Face -->
      <path d="M480 95 Q489 90 497 95"
            fill="none" stroke="#6A4939" stroke-width="3"/>
      <g class="eye">
        <ellipse cx="488" cy="104" rx="5.5" ry="6.5" fill="#382F2C"/>
        <circle cx="490" cy="101" r="1.8" fill="#FFFFFF"/>
      </g>
      <ellipse cx="531" cy="120" rx="3.5" ry="2.5" fill="#6A4939"/>
      <circle cx="493" cy="127" r="6" fill="#ED9B82" opacity=".38"/>
      <path d="M515 133 Q526 140 536 131"
            fill="none" stroke="#6A4939" stroke-width="3"/>

      <!-- Scarf band -->
      <path d="M435 169
               Q456 179 480 171
               L478 188
               Q454 195 432 184 Z"
            fill="#35B2A8" stroke="#50463E" stroke-width="3"/>
      <path d="M440 177 Q457 184 475 179"
            fill="none" stroke="#8AE0D2" stroke-width="3" opacity=".8"/>
    </g>

    <!-- Steering wheel -->
    <path d="M537 343 L519 320" fill="none"
          stroke="#4B4440" stroke-width="7"/>
    <ellipse cx="516" cy="316" rx="14" ry="20"
             transform="rotate(-28 516 316)"
             fill="none" stroke="#3F4C4D" stroke-width="6"/>
    <path d="M507 308 L524 324 M506 323 L525 308"
          fill="none" stroke="#3F4C4D" stroke-width="3"/>

    <!-- Forelegs and hands -->
    <g fill="none">
      <path d="M445 298 C468 302 481 318 505 320"
            stroke="#5A4038" stroke-width="17"/>
      <path d="M445 298 C468 302 481 318 505 320"
            stroke="#F4C66D" stroke-width="11"/>
      <path d="M464 289 C484 292 497 302 514 307"
            stroke="#5A4038" stroke-width="17"/>
      <path d="M464 289 C484 292 497 302 514 307"
            stroke="#F4C66D" stroke-width="11"/>
    </g>
    <circle cx="505" cy="320" r="7" fill="#F4C66D"
            stroke="#5A4038" stroke-width="3"/>
    <circle cx="514" cy="307" r="7" fill="#F4C66D"
            stroke="#5A4038" stroke-width="3"/>

    <!-- Tiny convertible body -->
    <path d="M276 369
             Q279 348 307 342
             L363 333
             Q376 330 392 334
             L500 334
             L574 334
             L616 342
             Q642 347 648 369
             L651 390
             Q650 407 632 408
             L294 408
             Q276 405 275 389 Z"
          fill="url(#carPaint)" stroke="#5A4038" stroke-width="5"/>

    <path d="M297 354 C392 337 526 341 619 351"
          fill="none" stroke="#FFB39A" stroke-width="5" opacity=".8"/>
    <path d="M403 348 L397 386
             Q396 396 408 396
             H501"
          fill="none" stroke="#A8484B" stroke-width="3" opacity=".75"/>
    <path d="M468 354 H486" fill="none"
          stroke="#613F39" stroke-width="5"/>
    <path d="M578 342 Q600 343 618 350"
          fill="none" stroke="#C55050" stroke-width="3"/>

    <!-- Lights and bumpers -->
    <ellipse cx="629" cy="361" rx="11" ry="9"
             fill="#FFF1A6" stroke="#5A4038" stroke-width="3"/>
    <path d="M286 357 L296 355" stroke="#FFD088" stroke-width="8"/>
    <path d="M634 393 H652" fill="none"
          stroke="#D9D4C7" stroke-width="8"/>
    <path d="M275 392 H292" fill="none"
          stroke="#D9D4C7" stroke-width="7"/>
    <rect x="601" y="382" width="34" height="14" rx="4"
          fill="#FFF2D4" stroke="#5A4038" stroke-width="2"/>
    <path d="M610 389 H626" stroke="#7D7164" stroke-width="3"/>

    <!-- Rear wheel -->
    <g class="wheel">
      <circle cx="350" cy="407" r="43" fill="#393B3B"
              stroke="#5A4038" stroke-width="4"/>
      <circle cx="350" cy="407" r="32" fill="#59605E"/>
      <circle cx="350" cy="407" r="23" fill="#F4E5C5"
              stroke="#3F4544" stroke-width="3"/>
      <g stroke="#6B6258" stroke-width="4">
        <path d="M350 388 V426 M331 407 H369
                 M337 394 L363 420 M363 394 L337 420"/>
      </g>
      <circle cx="350" cy="407" r="8" fill="#F37768"
              stroke="#5A4038" stroke-width="3"/>
      <path d="M324 382 A37 37 0 0 1 343 371"
            fill="none" stroke="#777E79" stroke-width="4"/>
    </g>

    <!-- Front wheel -->
    <g class="wheel">
      <circle cx="576" cy="407" r="43" fill="#393B3B"
              stroke="#5A4038" stroke-width="4"/>
      <circle cx="576" cy="407" r="32" fill="#59605E"/>
      <circle cx="576" cy="407" r="23" fill="#F4E5C5"
              stroke="#3F4544" stroke-width="3"/>
      <g stroke="#6B6258" stroke-width="4">
        <path d="M576 388 V426 M557 407 H595
                 M563 394 L589 420 M589 394 L563 420"/>
      </g>
      <circle cx="576" cy="407" r="8" fill="#F37768"
              stroke="#5A4038" stroke-width="3"/>
      <path d="M550 382 A37 37 0 0 1 569 371"
            fill="none" stroke="#777E79" stroke-width="4"/>
    </g>

    <!-- Fender trim -->
    <path d="M307 391 C309 355 391 355 393 391
             M533 391 C535 355 617 355 619 391"
          fill="none" stroke="#5A4038" stroke-width="4"/>
  </g>
</svg>
