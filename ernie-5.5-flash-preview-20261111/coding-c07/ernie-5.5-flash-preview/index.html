<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 数据地球仪 · Three.js</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #04060c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #dbe7ff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  /* ---------------- HUD ---------------- */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud > * { pointer-events: auto; }

  .brand {
    position: absolute; top: 22px; left: 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #9be9ff, #2b6bff 46%, #071233 78%);
    box-shadow: 0 0 20px rgba(80,170,255,.55), inset 0 0 12px rgba(255,255,255,.35);
    flex: none;
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .6px; }
  .brand p { margin: 3px 0 0; font-size: 10.5px; color: #7f92b5; letter-spacing: 1.6px; text-transform: uppercase; }

  .panel {
    position: absolute; top: 22px; right: 22px; width: 272px;
    background: linear-gradient(160deg, rgba(16,24,42,.88), rgba(8,12,24,.80));
    border: 1px solid rgba(120,170,255,.16);
    border-radius: 16px;
    padding: 16px 16px 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .panel-section { margin-bottom: 16px; }
  .panel-section:last-child { margin-bottom: 0; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
    color: #7f92b5; margin-bottom: 9px;
  }
  .year-badge {
    font-size: 12px; font-weight: 600; letter-spacing: .5px;
    color: #4cc9ff; background: rgba(76,201,255,.10);
    border: 1px solid rgba(76,201,255,.25);
    padding: 2px 8px; border-radius: 7px;
    font-variant-numeric: tabular-nums;
  }

  .segmented {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(120,170,255,.10);
    border-radius: 10px; padding: 4px;
  }
  .seg {
    appearance: none; border: 0; cursor: pointer;
    background: transparent; color: #93a6c6;
    font-size: 12.5px; font-weight: 500; padding: 7px 0;
    border-radius: 7px; transition: all .18s ease;
    font-family: inherit;
  }
  .seg:hover { color: #cfe0ff; background: rgba(255,255,255,.05); }
  .seg.active {
    color: #04121f; font-weight: 700;
    background: linear-gradient(135deg, #6fe3ff, #3d8bff);
    box-shadow: 0 4px 14px rgba(61,139,255,.35);
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px; outline: none;
    background: linear-gradient(90deg, #2b6bff, #4cc9ff);
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #eaf6ff; border: 2px solid #4cc9ff;
    box-shadow: 0 0 10px rgba(76,201,255,.85);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #eaf6ff; border: 2px solid #4cc9ff;
    box-shadow: 0 0 10px rgba(76,201,255,.85); cursor: pointer;
  }

  .timeline-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 11px;
  }
  .play-btn {
    appearance: none; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: #cfe0ff;
    background: rgba(76,201,255,.10);
    border: 1px solid rgba(76,201,255,.28);
    padding: 6px 13px; border-radius: 8px;
    transition: all .18s ease;
  }
  .play-btn:hover { background: rgba(76,201,255,.20); border-color: rgba(76,201,255,.5); }
  .play-btn.playing { color: #04121f; background: linear-gradient(135deg,#6fe3ff,#3d8bff); border-color: transparent; }
  .hint { font-size: 10.5px; color: #5f7295; letter-spacing: .6px; }

  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0; }
  .toggle input { display: none; }
  .toggle .track {
    width: 30px; height: 17px; border-radius: 9px; flex: none;
    background: rgba(120,150,200,.20);
    position: relative; transition: background .2s ease;
  }
  .toggle .track::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 13px; height: 13px; border-radius: 50%;
    background: #8fa6c8; transition: transform .2s ease, background .2s ease;
  }
  .toggle input:checked + .track { background: rgba(76,201,255,.32); }
  .toggle input:checked + .track::after {
    transform: translateX(13px); background: #4cc9ff;
    box-shadow: 0 0 9px rgba(76,201,255,.9);
  }
  .toggle .label { font-size: 12px; color: #b0c0dc; white-space: nowrap; }

  /* ---------------- Legend ---------------- */
  .legend {
    position: absolute; left: 24px; bottom: 62px; width: 216px;
    background: linear-gradient(160deg, rgba(16,24,42,.82), rgba(8,12,24,.72));
    border: 1px solid rgba(120,170,255,.14);
    border-radius: 12px; padding: 11px 13px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .legend-title { font-size: 11px; color: #93a6c6; letter-spacing: .8px; margin-bottom: 8px; }
  .legend-bar { height: 8px; border-radius: 4px; }
  .legend-labels {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: #6f83a6; margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  .hint-bar {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    font-size: 11.5px; color: #5f7295; letter-spacing: .8px;
    background: rgba(8,12,24,.55); border: 1px solid rgba(120,170,255,.10);
    padding: 7px 16px; border-radius: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
  }

  /* ---------------- City Card ---------------- */
  .city-card {
    position: fixed; left: 0; top: 0; width: 252px; z-index: 30;
    padding: 14px 15px 13px;
    background: linear-gradient(160deg, rgba(18,28,50,.96), rgba(8,12,24,.94));
    border: 1px solid rgba(120,170,255,.26);
    border-radius: 14px;
    box-shadow: 0 18px 46px rgba(0,0,0,.65), 0 0 0 1px rgba(76,201,255,.07);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .city-card.show { opacity: 1; pointer-events: auto; }
  .cc-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .cc-name { font-size: 16px; font-weight: 700; letter-spacing: .4px; }
  .cc-country { font-size: 11px; color: #7f92b5; margin-top: 2px; letter-spacing: .6px; }
  .cc-close {
    appearance: none; border: 0; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.06); color: #93a6c6;
    width: 22px; height: 22px; border-radius: 6px; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .cc-close:hover { background: rgba(255,255,255,.14); color: #fff; }

  .cc-metric {
    margin-top: 12px; padding: 10px 12px;
    background: rgba(76,201,255,.07);
    border: 1px solid rgba(76,201,255,.16);
    border-radius: 10px;
  }
  .cc-metric-label { font-size: 10.5px; color: #7f92b5; letter-spacing: 1px; text-transform: uppercase; }
  .cc-metric-label span { color: #5f7295; text-transform: none; letter-spacing: 0; }
  .cc-metric-value {
    font-size: 22px; font-weight: 700; margin-top: 3px;
    color: #6fe3ff; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(76,201,255,.45);
  }

  .cc-bars { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .cc-bar-row { display: grid; grid-template-columns: 34px 1fr 58px; align-items: center; gap: 7px; }
  .cc-bar-label { font-size: 10.5px; color: #7f92b5; }
  .cc-bar-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .cc-bar-fill { display: block; height: 100%; border-radius: 3px; transition: width .3s ease; }
  .cc-bar-val { font-size: 10.5px; color: #b0c0dc; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------------- Arc Tooltip ---------------- */
  .arc-tip {
    position: fixed; left: 0; top: 0; z-index: 25;
    padding: 8px 11px; border-radius: 9px;
    background: rgba(10,16,30,.94);
    border: 1px solid rgba(76,201,255,.30);
    box-shadow: 0 10px 28px rgba(0,0,0,.6);
    font-size: 11.5px; line-height: 1.55; color: #cfe0ff;
    pointer-events: none; opacity: 0;
    transition: opacity .14s ease; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .arc-tip.show { opacity: 1; }
  .arc-tip b { color: #6fe3ff; font-weight: 600; }
  .arc-tip .dim { color: #7f92b5; }

  /* ---------------- Loader ---------------- */
  .loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #04060c;
    transition: opacity .6s ease; font-size: 12.5px; color: #7f92b5; letter-spacing: 1.4px;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid rgba(76,201,255,.15);
    border-top-color: #4cc9ff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .panel { width: 220px; top: 14px; right: 14px; padding: 12px; }
    .brand { top: 14px; left: 14px; }
    .brand h1 { font-size: 14px; }
    .legend { left: 14px; bottom: 54px; width: 180px; }
    .hint-bar { display: none; }
  }
</style>
</head>

<div id="scene"></div>

<div class="hud">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <h1>全球数据地球仪</h1>
      <p>Global Data Globe · Three.js</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-section">
      <div class="section-title">数据指标</div>
      <div class="segmented" id="metricGroup">
        <button class="seg active" data-metric="gdp">GDP</button>
        <button class="seg" data-metric="pop">人口</button>
        <button class="seg" data-metric="flights">航班量</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">
        <span>时间轴</span>
        <span class="year-badge" id="yearBadge">2023</span>
      </div>

    </div>

      <div class="section-title">图层</div>

        <label class="toggle"><input type="checkbox" id="tgLights" checked /><span class="track"></span><span class="label">城市灯光</span></label>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-title" id="legendTitle">GDP · 十亿美元</div>
    <div class="legend-bar" id="legendBar"></div>
    <div class="legend-labels"><span id="legendMin">0</span><span id="legendMax">0</span></div>

</div>

<div id="cityCard" class="city-card"></div>
<div id="arcTip" class="arc-tip"></div>

<div id="loader" class="loader">
  <div class="spinner"></div>
  <span>加载地球纹理…</span>
</div>

/* ============================================================
   0. 工具函数
   ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const DEG = Math.PI / 180;

function hash01(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}

/** 经纬度 -> 球面坐标（与 THREE.SphereGeometry 的 UV 对齐） */
function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * DEG;
  const theta = (lon + 180) * DEG;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

function greatCircleKm(a, b) {
  const p1 = a.lat * DEG, p2 = b.lat * DEG;
  const dl = (b.lon - a.lon) * DEG;
  const d = Math.acos(clamp(Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dl), -1, 1));
  return d * 6371;
}

/* 颜色渐变（低 -> 高） */
const RAMP = [
  [0.00, [0x1d, 0x4e, 0xd8]],
  [0.30, [0x06, 0xb6, 0xd4]],
  [0.55, [0xa3, 0xe6, 0x35]],
  [0.78, [0xfb, 0xbf, 0x24]],
  [1.00, [0xf4, 0x3f, 0x5e]],
];
function rampRGB(t) {
  t = clamp(t, 0, 1);
  for (let i = 0; i < RAMP.length - 1; i++) {
    const p0 = RAMP[i][0], c0 = RAMP[i][1];
    const p1 = RAMP[i + 1][0], c1 = RAMP[i + 1][1];
    if (t <= p1) {
      const k = (t - p0) / (p1 - p0);
      return [lerp(c0[0], c1[0], k), lerp(c0[1], c1[1], k), lerp(c0[2], c1[2], k)];
    }
  }
  return RAMP[RAMP.length - 1][1].slice();
}
const rampCSS = t => { const c = rampRGB(t); return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; };

  uAtmo:     { value: 1.0 },
};

const globeVert = /* glsl */`
  varying vec2 vUv;
  varying vec3 vNormalW;
  varying vec3 vPosW;
  void main() {
    vUv = uv;
    vNormalW = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vPosW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const globeFrag = /* glsl */`
  uniform sampler2D uDayMap;
  uniform sampler2D uNightMap;
  uniform sampler2D uWaterMap;
  uniform vec3  uSunDir;
  uniform float uNightIntensity;
  uniform float uAtmo;

  varying vec2 vUv;
  varying vec3 vNormalW;
  varying vec3 vPosW;

  vec3 toSRGB(vec3 c) {
    c = max(c, vec3(0.0));
    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
  }

  void main() {
    vec3 N = normalize(vNormalW);
    vec3 V = normalize(cameraPosition - vPosW);

    float sunDot = dot(N, uSunDir);
    float dayMix = smoothstep(-0.12, 0.25, sunDot);

    vec3 dayCol   = texture2D(uDayMap, vUv).rgb;
    vec3 nightCol = texture2D(uNightMap, vUv).rgb;
    float water   = texture2D(uWaterMap, vUv).r;

    /* --- 白天 --- */
    float diff = max(sunDot, 0.0);
    vec3 dayLit = dayCol * (0.30 + 0.92 * diff);

    /* 海面高光 */
    vec3 H = normalize(uSunDir + V);
    float spec = pow(max(dot(N, H), 0.0), 48.0) * water * smoothstep(0.0, 0.35, sunDot);
    dayLit += vec3(1.0, 0.96, 0.88) * spec * 1.15;

    /* --- 夜晚：城市灯光 --- */
    vec3 nightLit = dayCol * 0.030
                  + nightCol * uNightIntensity * vec3(1.0, 0.85, 0.60) * 1.45;

    vec3 col = mix(nightLit, dayLit, dayMix);

    /* --- 大气边缘光 --- */
    float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    col += vec3(0.22, 0.48, 1.0) * fres * (0.18 + 0.82 * dayMix) * uAtmo;

    gl_FragColor = vec4(toSRGB(col), 1.0);
  }
`;

const globeMat = new THREE.ShaderMaterial({

let countries = [];

function addRingToPath(ctx, ring, W, H) {
  let prevX = null;
  for (let i = 0; i < ring.length; i++) {
    const lon = ring[i][0], lat = ring[i][1];
    const x = (lon + 180) / 360 * W;
    const y = (90 - lat) / 180 * H;
    if (prevX === null || Math.abs(x - prevX) > W * 0.5) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    prevX = x;
  }
  ctx.closePath();
}

function drawHeat(year) {
  if (!countries.length) return;
  const ctx = heatCtx;
  ctx.clearRect(0, 0, HEAT_W, HEAT_H);

  const mi = METRIC_INDEX[metric];

  const vals = new Float64Array(countries.length);
  for (let i = 0; i < countries.length; i++) {
    const v = countryValue(countries[i], year, mi);
    vals[i] = v;
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const lmin = Math.log(min + 1e-9);
  const lmax = Math.log(max + 1e-9);
  const span = Math.max(lmax - lmin, 1e-6);

  for (let i = 0; i < countries.length; i++) {
    const c = countries[i];
    const t = clamp((Math.log(vals[i] + 1e-9) - lmin) / span, 0, 1);
    const tt = Math.pow(t, 0.72);
    const [r, g, b] = rampRGB(tt);
    const alpha = 0.10 + tt * 0.62;

    ctx.beginPath();
    for (const poly of c.polygons) {
      for (const ring of poly) addRingToPath(ctx, ring, HEAT_W, HEAT_H);
    }
    ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${alpha.toFixed(3)})`;
    ctx.fill('evenodd');

    ctx.strokeStyle = `rgba(${r | 0},${g | 0},${b | 0},${(alpha * 0.85).toFixed(3)})`;
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }
  heatTex.needsUpdate = true;
}

function countryValue(c, year, mi) {
  return c.stats[mi] * Math.pow(1 + c.growth[mi], year - 2023);

/* --- TopoJSON -> GeoJSON 极简解码 --- */
function topoToCountries(topo) {
  const tr = topo.transform;
  const arcs = topo.arcs.map(arc => {
    let x = 0, y = 0;
    const out = new Array(arc.length);
    for (let i = 0; i < arc.length; i++) {
      x += arc[i][0]; y += arc[i][1];
      out[i] = [x * tr.scale[0] + tr.translate[0], y * tr.scale[1] + tr.translate[1]];
    }
    return out;
  });

  const buildRing = (ringArcs) => {
    const pts = [];
    for (const idx of ringArcs) {
      const rev = idx < 0;
      const arc = arcs[rev ? ~idx : idx];
      const start = pts.length ? 1 : 0;
      for (let i = start; i < arc.length; i++) {
        pts.push(rev ? arc[arc.length - 1 - i] : arc[i]);
      }
    }
    return pts;
  };

  const geoms = topo.objects.countries.geometries;
  const result = [];
  for (const g of geoms) {
    const polys = g.type === 'Polygon' ? [g.arcs] : (g.arcs || []);
    const polygons = polys.map(rings => rings.map(buildRing)).filter(p => p.length && p[0].length > 2);
    if (!polygons.length) continue;

    const name = (g.properties && g.properties.name) || '';
    const key = normName(name);
    const st = COUNTRY_STATS[key];
    let stats, growth;
    if (st) {
      stats = st;
      growth = [
        0.020 + hash01(key + 'g0') * 0.045,
        0.004 + hash01(key + 'g1') * 0.018,
        0.018 + hash01(key + 'g2') * 0.050,
      ];
    } else {
      stats = [
        2 + hash01(key + 'x0') * 30,
        1 + hash01(key + 'x1') * 25,
        0.5 + hash01(key + 'x2') * 4,
      ];
      growth = [
        0.015 + hash01(key + 'y0') * 0.035,
        0.004 + hash01(key + 'y1') * 0.016,
        0.015 + hash01(key + 'y2') * 0.040,
      ];
    }
    result.push({ name, polygons, stats, growth });
  }
  return result;
}

  try {

    const topo = await res.json();
    countries = topoToCountries(topo);

}

      float glow = pow(core, 2.2);

      vec3 col = vColor * (0.35 + 2.4 * glow);
      float a = glow;

      if (vSelected > 0.5) {
        float ph = 0.5 + 0.5 * sin(uTime * 3.2);
        float ringR = 0.42 + 0.44 * ph;
        float ring = 1.0 - smoothstep(0.0, 0.10, abs(d - ringR));
        col += vec3(1.0) * ring * 1.7;
        a = max(a, ring * 0.9);
      }

      gl_FragColor = vec4(toSRGB(col), a);
    }
  `,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,
});

const cityPoints = new THREE.Points(cityGeo, cityMat);
cityPoints.renderOrder = 4;
cityPoints.frustumCulled = false;
earthGroup.add(cityPoints);

const cityHitGroup = new THREE.Group();
earthGroup.add(cityHitGroup);
const cityHitMeshes = [];
const cityHitGeo = new THREE.SphereGeometry(0.024, 8, 6);
const cityHitMat = new THREE.MeshBasicMaterial({ visible: false });

(function buildCities() {
  const n = CITIES.length;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const size = new Float32Array(n);
  const sel = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const c = CITIES[i];
    const v = latLonToVec3(c.lat, c.lon, R * 1.008);
    c.position = v;
    pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
    size[i] = 0.06;
    sel[i] = 0;

    const hit = new THREE.Mesh(cityHitGeo, cityHitMat);
    hit.position.copy(v);
    hit.userData.city = c;
    cityHitGroup.add(hit);
    cityHitMeshes.push(hit);
  }

  cityGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  cityGeo.setAttribute('aColor', new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
  cityGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1).setUsage(THREE.DynamicDrawUsage));
  cityGeo.setAttribute('aSelected', new THREE.BufferAttribute(sel, 1).setUsage(THREE.DynamicDrawUsage));
})();

/* ============================================================
   8. 航线（弧线 + 流动动画）
   ============================================================ */
const arcGroup = new THREE.Group();
earthGroup.add(arcGroup);
const ARCS = [];
const arcHitMeshes = [];

const arcVert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const arcFrag = /* glsl */`
  uniform float uTime;
  uniform vec3  uColor;
  uniform float uOpacity;
  uniform float uSpeed;
  uniform float uFlow;
  varying vec2 vUv;

  vec3 toSRGB(vec3 c) {
    c = max(c, vec3(0.0));
    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
  }

  void main() {
    float t = vUv.x;
    float p = fract(uTime * uSpeed);
    float d = t - p;
    d = d - floor(d + 0.5);                 // 环绕到 [-0.5, 0.5]
    float pulse = (1.0 - smoothstep(0.0, 0.085, abs(d))) * uFlow;

    float base = 0.15;
    float a = (base + pulse * 0.95) * uOpacity;
    vec3 col = uColor * (0.55 + pulse * 1.75);

    gl_FragColor = vec4(toSRGB(col), a);
  }
`;

function buildArc(a, b) {
  const start = latLonToVec3(a.lat, a.lon, R * 1.004);
  const end   = latLonToVec3(b.lat, b.lon, R * 1.004);
  const dist  = start.distanceTo(end);
  const mid   = start.clone().add(end).multiplyScalar(0.5).normalize()
                     .multiplyScalar(R + dist * 0.34);
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);

  const geo = new THREE.TubeGeometry(curve, 72, 0.0052, 6, false);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: arcTimeUniform,
      uColor: { value: new THREE.Color(0x4cc9ff) },
      uOpacity: { value: 1.0 },
      uSpeed: { value: 0.22 },
      uFlow: { value: 1.0 },
    },
    vertexShader: arcVert,
    fragmentShader: arcFrag,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 3;
  arcGroup.add(mesh);

  /* 加宽的隐形碰撞体，方便悬停 */
  const hitGeo = new THREE.TubeGeometry(curve, 24, 0.024, 4, false);
  const hitMesh = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));

  const arc = {
    a, b, mesh, mat, hitMesh,
    distKm: greatCircleKm(a, b),
    volume: 1,
    baseOpacity: 1,
  };
  hitMesh.userData.arc = arc;
  arcGroup.add(hitMesh);
  arcHitMeshes.push(hitMesh);
  ARCS.push(arc);
}

(function buildArcs() {
  const hubs = CITIES.slice().sort((x, y) => y.base[2] - x.base[2]).slice(0, 26);
  const seen = new Set();

  const connect = (a, b) => {
    const k = a.name < b.name ? a.name + '|' + b.name : b.name + '|' + a.name;
    if (seen.has(k)) return;
    seen.add(k);
    buildArc(a, b);
  };

  for (const h of hubs) {
    const others = CITIES.filter(c => c !== h);
    /* 最近的两个 */
    const near = others.slice().sort((x, y) =>
      greatCircleKm(h, x) - greatCircleKm(h, y)).slice(0, 2);
    near.forEach(c => connect(h, c));

    /* 一个远距离航线 */
    const far = others
      .filter(c => greatCircleKm(h, c) > 55)
      .sort((x, y) => greatCircleKm(h, y) - greatCircleKm(h, x))[0];
    if (far) connect(h, far);
  }
})();

/* ============================================================
   9. 状态与数据更新
   ============================================================ */
let metric = 'gdp';
let year = 2023;
let playing = false;
let autoRotate = true;
let dragging = false;
let selectedCity = null;
let hoveredArc = null;

const normCache = { gdp: [0, 1], pop: [0, 1], flights: [0, 1] };

function computeNormCache() {
  for (const key of Object.keys(METRICS)) {
    const mi = METRIC_INDEX[key];
    let min = Infinity, max = -Infinity;
    for (const c of CITIES) {
      const v = cityValue(c, year, mi);
      if (v < min) min = v;
      if (v > max) max = v;
    }
    normCache[key] = [min, max];
  }
}

function cityNorm(city, key) {
  const [min, max] = normCache[key];
  const v = cityValue(city, year, METRIC_INDEX[key]);
  const lmin = Math.log(min + 1e-9), lmax = Math.log(max + 1e-9);
  return clamp((Math.log(v + 1e-9) - lmin) / Math.max(lmax - lmin, 1e-6), 0, 1);
}

function updateCityVisuals() {
  const mi = METRIC_INDEX[metric];
  const [min, max] = normCache[metric];
  const lmin = Math.log(min + 1e-9), lmax = Math.log(max + 1e-9);
  const span = Math.max(lmax - lmin, 1e-6);

  const colAttr = cityGeo.attributes.aColor;
  const sizeAttr = cityGeo.attributes.aSize;
  const tmp = new THREE.Color();

  for (let i = 0; i < CITIES.length; i++) {
    const v = cityValue(CITIES[i], year, mi);
    const t = clamp((Math.log(v + 1e-9) - lmin) / span, 0, 1);
    const [r, g, b] = rampRGB(t);
    tmp.setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
    colAttr.array[i * 3] = tmp.r;
    colAttr.array[i * 3 + 1] = tmp.g;
    colAttr.array[i * 3 + 2] = tmp.b;
    sizeAttr.array[i] = 0.042 + t * 0.075;
  }
  colAttr.needsUpdate = true;
  sizeAttr.needsUpdate = true;
}

function updateArcVisuals() {
  const mi = METRIC_INDEX[metric];
  let min = Infinity, max = -Infinity;

  for (const a of ARCS) {
    const va = cityValue(a.a, year, mi);
    const vb = cityValue(a.b, year, mi);
    a.volume = Math.sqrt(va * vb) * (0.5 + a.distKm / 12000);
    if (a.volume < min) min = a.volume;
    if (a.volume > max) max = a.volume;
  }

  const lmin = Math.log(min + 1e-9), lmax = Math.log(max + 1e-9);
  const span = Math.max(lmax - lmin, 1e-6);
  const tmp = new THREE.Color();

  for (const a of ARCS) {
    const t = clamp((Math.log(a.volume + 1e-9) - lmin) / span, 0, 1);
    const [r, g, b] = rampRGB(t);
    tmp.setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
    a.mat.uniforms.uColor.value.copy(tmp);
    a.baseOpacity = 0.32 + t * 0.68;
    a.mat.uniforms.uOpacity.value = a.baseOpacity * (a === hoveredArc ? 1.9 : 1.0);
    a.mat.uniforms.uSpeed.value = 0.12 + t * 0.34;
    a.mat.uniforms.uFlow.value = 0.55 + t * 0.75;
  }
}

function updateLegend() {
  const m = METRICS[metric];
  const [min, max] = normCache[metric];
  document.getElementById('legendTitle').textContent = `${m.label} · ${m.unit}`;
  document.getElementById('legendBar').style.background =
    `linear-gradient(90deg, ${RAMP.map(([p, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${(p * 100).toFixed(0)}%`).join(',')})`;
  document.getElementById('legendMin').textContent = m.fmt(min);
  document.getElementById('legendMax').textContent = m.fmt(max);
}

function updateData() {
  computeNormCache();
  updateCityVisuals();
  updateArcVisuals();
  drawHeat(year);
  updateLegend();
  if (selectedCity) renderCityCard(selectedCity);
}

/* ============================================================
   10. 城市信息卡
   ============================================================ */
const card = document.getElementById('cityCard');

function renderCityCard(city) {
  const m = METRICS[metric];
  const v = cityValue(city, year, METRIC_INDEX[metric]);

  const bars = Object.keys(METRICS).map(k => {
    const val = cityValue(city, year, METRIC_INDEX[k]);
    const t = cityNorm(city, k);
    return `
      <div class="cc-bar-row">
        <span class="cc-bar-label">${METRICS[k].short}</span>
        <span class="cc-bar-track">
          <span class="cc-bar-fill" style="width:${(t * 100).toFixed(1)}%;background:${rampCSS(t)}"></span>
        </span>
        <span class="cc-bar-val">${METRICS[k].fmt(val)}</span>
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="cc-head">
      <div>
        <div class="cc-name">${city.name}</div>
        <div class="cc-country">${city.country} · ${city.lat.toFixed(2)}°, ${city.lon.toFixed(2)}°</div>
      </div>
      <button class="cc-close" id="ccClose">×</button>
    </div>
    <div class="cc-metric">
      <div class="cc-metric-label">${m.label} <span>/ ${m.unit}</span></div>
      <div class="cc-metric-value">${m.fmt(v)}</div>
    </div>
    <div class="cc-bars">${bars}</div>
  `;
  card.querySelector('#ccClose').onclick = () => setSelectedCity(null);
}

function setSelectedCity(city) {
  selectedCity = city;
  const selAttr = cityGeo.attributes.aSelected;
  for (let i = 0; i < CITIES.length; i++) selAttr.array[i] = (CITIES[i] === city) ? 1 : 0;
  selAttr.needsUpdate = true;

  if (city) {
    renderCityCard(city);
    card.classList.add('show');
  } else {
    card.classList.remove('show');
  }
}

const tmpV = new THREE.Vector3();
function updateCityCardPosition() {
  if (!selectedCity) return;
  tmpV.copy(selectedCity.position).applyMatrix4(earthGroup.matrixWorld);
  const worldPos = tmpV.clone();
  const camDir = camera.position.clone().sub(worldPos).normalize();
  const normal = worldPos.clone().normalize();

  if (camDir.dot(normal) < 0.06) { card.classList.remove('show'); return; }
  card.classList.add('show');

  const p = worldPos.clone().project(camera);
  let x = (p.x * 0.5 + 0.5) * window.innerWidth + 20;
  let y = (-p.y * 0.5 + 0.5) * window.innerHeight - 50;
  const w = card.offsetWidth || 252;
  const h = card.offsetHeight || 200;
  x = clamp(x, 12, window.innerWidth - w - 12);
  y = clamp(y, 12, window.innerHeight - h - 12);
  card.style.left = x + 'px';
  card.style.top = y + 'px';
}

/* ============================================================
   11. 交互：拖拽 / 缩放 / 点击 / 悬停
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const arcTip = document.getElementById('arcTip');

function updatePointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

let lastHoverCheck = 0;

function checkHover() {
  raycaster.setFromCamera(pointer, camera);

  /* --- 航线悬停 --- */
  const arcHits = raycaster.intersectObjects(arcHitMeshes, false);
  let newHover = null;
  if (arcHits.length) {
    const globeHits = raycaster.intersectObject(globeMesh, false);
    const occluded = globeHits.length && globeHits[0].distance < arcHits[0].distance - 0.002;
    if (!occluded) newHover = arcHits[0].object.userData.arc;
  }

  if (newHover !== hoveredArc) {
    if (hoveredArc) hoveredArc.mat.uniforms.uOpacity.value = hoveredArc.baseOpacity;
    hoveredArc = newHover;
    if (hoveredArc) hoveredArc.mat.uniforms.uOpacity.value = hoveredArc.baseOpacity * 1.9;
  }

  if (hoveredArc) {
    const a = hoveredArc;
    const mi = METRIC_INDEX[metric];
    const vol = Math.sqrt(cityValue(a.a, year, mi) * cityValue(a.b, year, mi));
    arcTip.innerHTML =
      `<b>${a.a.name} → ${a.b.name}</b><br>` +
      `<span class="dim">距离</span> ${Math.round(a.distKm).toLocaleString('en-US')} km<br>` +
      `<span class="dim">${METRICS[metric].label} 流量指数</span> ${vol.toFixed(1)}`;
    arcTip.classList.add('show');
    renderer.domElement.style.cursor = 'pointer';
  } else {
    arcTip.classList.remove('show');

    /* --- 城市悬停 --- */
    const cityHits = raycaster.intersectObjects(cityHitMeshes, false);
    let overCity = false;
    if (cityHits.length) {
      const globeHits = raycaster.intersectObject(globeMesh, false);
      const occluded = globeHits.length && globeHits[0].distance < cityHits[0].distance - 0.002;
      if (!occluded) overCity = true;
    }
    renderer.domElement.style.cursor = overCity ? 'pointer' : 'grab';
  }
}

function moveArcTip(x, y) {
  if (!hoveredArc) return;
  const w = arcTip.offsetWidth || 180;
  const h = arcTip.offsetHeight || 60;
  arcTip.style.left = clamp(x + 16, 8, window.innerWidth - w - 8) + 'px';
  arcTip.style.top  = clamp(y + 16, 8, window.innerHeight - h - 8) + 'px';
}

renderer.domElement.addEventListener('pointermove', (e) => {
  updatePointer(e);
  moveArcTip(e.clientX, e.clientY);
  const now = performance.now();
  if (now - lastHoverCheck > 55) {
    lastHoverCheck = now;
    checkHover();
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  arcTip.classList.remove('show');
  if (hoveredArc) {
    hoveredArc.mat.uniforms.uOpacity.value = hoveredArc.baseOpacity;
    hoveredArc = null;
  }
});

let downInfo = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
  renderer.domElement.style.cursor = 'grabbing';
});

renderer.domElement.addEventListener('pointerup', (e) => {
  renderer.domElement.style.cursor = 'grab';
  if (!downInfo) return;
  const dx = e.clientX - downInfo.x;
  const dy = e.clientY - downInfo.y;
  const dt = performance.now() - downInfo.t;
  downInfo = null;
  if (Math.hypot(dx, dy) > 6 || dt > 600) return;   // 判定为拖拽

  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(cityHitMeshes, false);
  if (!hits.length) { setSelectedCity(null); return; }

  const globeHits = raycaster.intersectObject(globeMesh, false);
  if (globeHits.length && globeHits[0].distance < hits[0].distance - 0.002) {
    setSelectedCity(null);
    return;
  }
  setSelectedCity(hits[0].object.userData.city);
});

controls.addEventListener('start', () => { dragging = true; });
controls.addEventListener('end', () => { dragging = false; });

/* ============================================================
   12. UI 绑定
   ============================================================ */
const yearRange = document.getElementById('yearRange');
const yearBadge = document.getElementById('yearBadge');
const playBtn = document.getElementById('playBtn');

document.getElementById('metricGroup').addEventListener('click', (e) => {
  const btn = e.target.closest('.seg');
  if (!btn) return;
  metric = btn.dataset.metric;
  document.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b === btn));
  updateData();
});

yearRange.addEventListener('input', () => {
  year = parseInt(yearRange.value, 10);
  yearBadge.textContent = year;
  updateData();
});

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.classList.toggle('playing', playing);
  playBtn.textContent = playing ? '❚❚ 暂停' : '▶ 播放';
});

document.getElementById('tgRotate').addEventListener('change', (e) => { autoRotate = e.target.checked; });
document.getElementById('tgArcs').addEventListener('change', (e) => { arcGroup.visible = e.target.checked; });
document.getElementById('tgHeat').addEventListener('change', (e) => { heatMesh.visible = e.target.checked; });
document.getElementById('tgLights').addEventListener('change', (e) => {
  globeUniforms.uNightIntensity.value = e.target.checked ? 1.0 : 0.0;
});

/* ============================================================
   13. 动画循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let playAccum = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (autoRotate && !dragging) {
    earthGroup.rotation.y += dt * 0.045;
  }

  arcTimeUniform.value = elapsed;
  cityMat.uniforms.uTime.value = elapsed;

  /* 时间轴播放 */
  if (playing) {
    playAccum += dt;
    if (playAccum > 0.55) {
      playAccum = 0;
      year = year >= 2025 ? 2000 : year + 1;
      yearRange.value = year;
      yearBadge.textContent = year;
      updateData();
    }
  }

  controls.update();
  earthGroup.updateMatrixWorld();
  updateCityCardPosition();

  renderer.render(scene, camera);
}

/* ============================================================
   14. 尺寸自适应
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  cityMat.uniforms.uSizeScale.value = window.innerHeight * 0.5 * renderer.getPixelRatio();
});

/* ============================================================
   15. 启动
   ============================================================ */
updateData();
animate();
loadCountries();

setTimeout(() => {
  document.getElementById('loader').classList.add('hide');
}, 700);
</script>
