<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电梯模拟器</title>
<style>
  :root {
    --row-h: 64px;
    --bg: #070b16;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #e8f0ff;
    --muted: #8ea0c0;
    --cyan: #4cc9f0;
    --pink: #f72585;
    --yellow: #ffd166;
  }

  * {
    box-sizing: border-box;
  }

  html {
    color-scheme: dark;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 18% 0%, rgba(76, 201, 240, 0.14), transparent 38%),
      radial-gradient(circle at 82% 18%, rgba(247, 37, 133, 0.11), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(67, 97, 238, 0.12), transparent 45%),
      var(--bg);
    overflow-x: hidden;
  }

  button,
  input,
  select {
    font-family: inherit;
  }

  .app {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 28px;
  }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  .header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, #ffffff, #a9dcff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .header p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .stats {
    display: flex;
    gap: 10px;
  }

  .stat {
    min-width: 82px;
    padding: 10px 14px;
    text-align: center;
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    background: var(--panel);
    backdrop-filter: blur(12px);
  }

  .stat span {
    display: block;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.1;
  }

  .stat small {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
  }

  .main {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .panel,
  .building-card {
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
  }

  .panel {
    padding: 20px;
  }

  .building-card {
    padding: 20px;
  }

  h2 {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  label {
    display: block;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 12px;
  }

  select,
  input {
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    outline: none;
    background: rgba(255, 255, 255, 0.055);
    color: var(--text);
    font-size: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  select:focus,
  input:focus {
    border-color: rgba(76, 201, 240, 0.65);
    box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.14);
  }

  option {
    background: #0b1020;
    color: var(--text);
  }

  button {
    width: 100%;
    margin-bottom: 10px;
    padding: 11px 14px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
  }

  button:hover {
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  .primary {
    background: linear-gradient(135deg, var(--cyan), #4361ee);
    color: #fff;
    box-shadow: 0 8px 22px rgba(67, 97, 238, 0.3);
  }

  .secondary {
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.08);
    color: #dbe7ff;
  }

  .danger {
    border: 1px solid rgba(255, 99, 132, 0.25);
    background: rgba(255, 99, 132, 0.12);
    color: #ff8fa3;
  }

  .divider {
    height: 1px;
    margin: 18px 0;
    background: rgba(255, 255, 255, 0.08);
  }

  .elevator-status {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #cfe0ff;
    font-size: 12px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 9px var(--c);
  }

  .status-name {
    flex: 1;
  }

  .status-text {
    color: var(--muted);
    font-size: 11px;
    text-align: right;
  }

  .hint {
    margin-top: 16px;
    color: #7f8fb0;
    font-size: 11px;
    line-height: 1.65;
  }

  .building-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .building-header h2 {
    margin: 0;
  }

  .legend {
    display: flex;
    gap: 12px;
    color: var(--muted);
    font-size: 11px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
  }

  .legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 5px;
    border-radius: 50%;
  }

  .legend-dot.waiting {
    background: var(--cyan);
  }

  .legend-dot.moving {
    background: var(--pink);
  }

  .building {
    display: flex;
    align-items: stretch;
    gap: 14px;
    padding: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.16);
  }

  .floors {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .floor-row {
    height: var(--row-h);
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .floor-row:last-child {
    border-bottom: 0;
  }

  .floor-label {
    width: 54px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #9fb0d0;
    font-size: 14px;
    font-weight: 700;
  }

  .floor-count {
    min-width: 20px;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: #cfe0ff;
    font-size: 10px;
    font-weight: 600;
    text-align: center;
  }

  .waiting-area {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    overflow-x: auto;
    overflow-y: hidden;
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.025);
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    transition: background 0.15s;
  }

  .floor-row:hover .waiting-area {
    background: rgba(255, 255, 255, 0.04);
  }

  .waiting-area::-webkit-scrollbar {
    height: 4px;
  }

  .waiting-area::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.16);
  }

  .shafts {
    width: 270px;
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
  }

  .shaft {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012));
  }

  .shaft::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: rgba(255, 255, 255, 0.06);
  }

  .car {
    position: absolute;
    top: calc(var(--floor-index, 7) * var(--row-h) + 4px);
    left: 50%;
    width: 64px;
    height: calc(var(--row-h) - 8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transform: translateX(-50%);
    border-radius: 10px;
    background: linear-gradient(145deg, var(--elevator-color), rgba(10, 16, 32, 0.92));
    box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    transition: top 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: top;
  }

  .car.moving {
    box-shadow:
      0 0 24px var(--elevator-color),
      0 8px 20px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .car-header {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    line-height: 1;
    opacity: 0.92;
  }

  .car-id {
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.25);
  }

  .car-floor {
    font-size: 10px;
  }

  .car-passenger {
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .car.has-passenger .car-passenger {
    opacity: 1;
  }

  .car-target {
    max-width: 100%;
    height: 10px;
    padding: 0 2px;
    overflow: hidden;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.2);
    color: #fff;
    font-size: 9px;
    line-height: 10px;
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.82;
  }

  .car-target:empty {
    display: none;
  }

  .person {
    position: relative;
    width: 18px;
    height: 28px;
    flex: 0 0 auto;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
  }

  .person:hover {
    transform: translateY(-2px) scale(1.08);
  }

  .person .head {
    width: 10px;
    height: 10px;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--person-color);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
  }

  .person .body {
    width: 14px;
    height: 14px;
    margin: 2px auto 0;
    border-radius: 7px 7px 4px 4px;
    background: var(--person-color);
    opacity: 0.9;
  }

  .person.small {
    transform: scale(0.7);
  }

  .person.small:hover {
    transform: scale(0.76) translateY(-1px);
  }

  .car-passenger .person {
    width: 14px;
    height: 22px;
  }

  .car-passenger .person .head {
    width: 8px;
    height: 8px;
  }

  .car-passenger .person .body {
    width: 10px;
    height: 10px;
  }

  .person.appear {
    animation: personAppear 0.3s ease;
  }

  .person.boarding {
    animation: personBoard 0.26s ease forwards;
  }

  @keyframes personAppear {
    from {
      opacity: 0;
      transform: scale(0.5);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes personBoard {
    to {
      opacity: 0;
      transform: translateY(-8px) scale(0.4);
    }
  }

  .floor-row.pulse .waiting-area {
    animation: floorPulse 0.5s ease;
  }

  @keyframes floorPulse {
    0% {
      box-shadow: 0 0 0 0 rgba(76, 201, 240, 0.4);
    }
    100% {
      box-shadow: 0 0 0 12px rgba(76, 201, 240, 0);
    }
  }

  .tooltip {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    background: rgba(10, 16, 32, 0.96);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
    color: #fff;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s, transform 0.15s;
  }

  .tooltip.show {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 980px) {
    .main {
      grid-template-columns: 1fr;
    }

    .building-card {
      order: 1;
    }

    .panel {
      order: 2;
    }

    .header {
      flex-direction: column;
      align-items: flex-start;
    }

    .stats {
      width: 100%;
    }

    .stat {
      flex: 1;
    }
  }

  @media (max-width: 640px) {
    :root {
      --row-h: 56px;
    }

    .app {
      padding: 14px;
    }

    .header h1 {
      font-size: 22px;
    }

    .building {
      gap: 8px;
    }

    .shafts {
      width: 210px;
      gap: 6px;
    }

    .car {
      width: 54px;
    }

    .floor-label {
      width: 42px;
      font-size: 12px;
    }

    .waiting-area {
      gap: 4px;
      padding: 3px 6px;
    }

    .person {
      width: 16px;
      height: 26px;
    }

    .person .head {
      width: 9px;
      height: 9px;
    }

    .person .body {
      width: 12px;
      height: 12px;
    }

    .panel,
    .building-card {
      padding: 14px;
      border-radius: 16px;
    }

    .stats {
      gap: 6px;
    }

    .stat {
      min-width: 0;
      padding: 8px 10px;
    }

    .stat span {
      font-size: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>电梯模拟器</h1>
        <p>三部电梯 · 每部一次载一人 · 悬停人物查看目标楼层</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span id="waiting-count">0</span>
          <small>等待中</small>
        </div>
        <div class="stat">
          <span id="delivered-count">0</span>
          <small>已送达</small>
        </div>
        <div class="stat">
          <span id="active-count">0</span>
          <small>运行中</small>
        </div>
      </div>
    </header>

    <main class="main">
      <aside class="panel">
        <h2>生成乘客</h2>

        <label>
          楼层
          <select id="floor-select"></select>
        </label>

        <label>
          人数
          <input id="count-input" type="number" min="1" max="10" value="3" />
        </label>

        <button id="add-btn" class="primary" type="button">添加乘客</button>
        <button id="random-btn" class="secondary" type="button">随机生成 5 人</button>
        <button id="clear-btn" class="danger" type="button">清空并复位</button>

        <div class="divider"></div>

        <h2>电梯状态</h2>
        <div id="elevator-status" class="elevator-status"></div>

        <div class="hint">
          提示：乘客会按队列顺序依次上电梯；每部电梯一次只能载一人。
          电梯会自动前往最近的等待乘客，送达后继续接下一批。
        </div>
      </aside>

      <section class="building-card">
        <div class="building-header">
          <h2>楼层与电梯</h2>
          <div class="legend">
            <span><i class="legend-dot waiting"></i>等待</span>
            <span><i class="legend-dot moving"></i>运行</span>
          </div>
        </div>

        <div class="building">
          <div id="floors" class="floors"></div>
          <div id="shafts" class="shafts"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <script>
    const FLOORS = 8;
    const ELEVATOR_COLORS = ["#4cc9f0", "#f72585", "#ffd166"];
    const PERSON_COLORS = [
      "#4cc9f0",
      "#f72585",
      "#ffd166",
      "#06d6a0",
      "#b388ff",
      "#ff9f1c",
      "#ef476f",
      "#8ac926"
    ];

    let passengerId = 0;
    let delivered = 0;
    let tooltipEl = null;

    const waiting = Array.from({ length: FLOORS + 1 }, () => []);
    const elevators = [];

    function init() {
      const floorSelect = document.getElementById("floor-select");
      for (let f = 1; f <= FLOORS; f++) {
        const option = document.createElement("option");
        option.value = String(f);
        option.textContent = `${f}F`;
        floorSelect.appendChild(option);
      }

      const floorsEl = document.getElementById("floors");
      for (let f = FLOORS; f >= 1; f--) {
        const row = document.createElement("div");
        row.className = "floor-row";
        row.dataset.floor = String(f);
        row.innerHTML = `
          <div class="floor-label">
            <span>${f}F</span>
            <span class="floor-count" id="floor-count-${f}">0</span>
          </div>
          <div class="waiting-area" id="waiting-${f}"></div>
        `;
        floorsEl.appendChild(row);
      }

      const shaftsEl = document.getElementById("shafts");
      const statusEl = document.getElementById("elevator-status");

      for (let i = 1; i <= 3; i++) {
        const shaft = document.createElement("div");
        shaft.className = "shaft";
        shaft.id = `shaft-${i}`;

        const car = document.createElement("div");
        car.className = "car";
        car.id = `elevator-${i}`;
        car.style.setProperty("--elevator-color", ELEVATOR_COLORS[i - 1]);
        car.innerHTML = `
          <div class="car-header">
            <span class="car-id">${i}</span>
            <span class="car-floor">1F</span>
          </div>
          <div class="car-passenger"></div>
          <div class="car-target"></div>
        `;

        shaft.appendChild(car);
        shaftsEl.appendChild(shaft);

        elevators.push({
          id: i,
          floor: 1,
          state: "idle",
          targetFloor: null,
          passenger: null,
          assignedTo: null,
          car,
          timer: null
        });

        const statusRow = document.createElement("div");
        statusRow.className = "status-row";
        statusRow.id = `status-${i}`;
        statusRow.innerHTML = `
          <span class="status-dot" style="--c:${ELEVATOR_COLORS[i - 1]}"></span>
          <span class="status-name">${i}号电梯</span>
          <span class="status-text">空闲</span>
        `;
        statusEl.appendChild(statusRow);
      }

      tooltipEl = document.getElementById("tooltip");

      document.getElementById("add-btn").addEventListener("click", addFromControls);
      document.getElementById("random-btn").addEventListener("click", randomAdd);
      document.getElementById("clear-btn").addEventListener("click", resetSimulation);

      updateAll();
      setInterval(dispatchAll, 400);
    }

    function updateAll() {
      updateStats();
      updateFloorCounts();
      elevators.forEach((elev) => {
        updateCar(elev);
        updateElevatorStatus(elev);
      });
    }

    function updateStats() {
      const waitingCount = waiting.reduce((sum, list) => sum + list.length, 0);
      const activeCount = elevators.filter((elev) => elev.state !== "idle").length;

      document.getElementById("waiting-count").textContent = String(waitingCount);
      document.getElementById("delivered-count").textContent = String(delivered);
      document.getElementById("active-count").textContent = String(activeCount);
    }

    function updateFloorCounts() {
      for (let f = 1; f <= FLOORS; f++) {
        const el = document.getElementById(`floor-count-${f}`);
        if (el) el.textContent = String(waiting[f].length);
      }
    }

    function updateElevatorStatus(elev) {
      const row = document.getElementById(`status-${elev.id}`);
      if (!row) return;

      const textEl = row.querySelector(".status-text");
      let text = "空闲";

      if (elev.state === "toPickup") {
        text = `前往 ${elev.targetFloor}F 接人`;
      } else if (elev.state === "toDropoff") {
        text = `载客前往 ${elev.targetFloor}F`;
      }

      textEl.textContent = text;
    }

    function updateCar(elev) {
      const car = elev.car;
      car.style.setProperty("--floor-index", String(FLOORS - elev.floor));

      const floorEl = car.querySelector(".car-floor");
      if (floorEl) floorEl.textContent = `${elev.floor}F`;

      const targetEl = car.querySelector(".car-target");
      if (targetEl) {
        targetEl.textContent = elev.passenger
          ? `→ ${elev.passenger.target}F`
          : "";
      }

      car.classList.toggle("moving", elev.state !== "idle");
    }

    function addFromControls() {
      const floor = parseInt(document.getElementById("floor-select").value, 10);
      const rawCount = parseInt(document.getElementById("count-input").value, 10);
      const count = Math.max(1, Math.min(10, Number.isFinite(rawCount) ? rawCount : 1));

      for (let i = 0; i < count; i++) {
        addPassenger(floor);
      }
    }

    function randomAdd() {
      for (let i = 0; i < 5; i++) {
        const floor = Math.floor(Math.random() * FLOORS) + 1;
        addPassenger(floor);
      }
    }

    function addPassenger(floor, target = null) {
      if (floor < 1 || floor > FLOORS) return;

      const passenger = {
        id: ++passengerId,
        floor,
        target: target || randomTarget(floor),
        color: randomColor(),
        assignedTo: null,
        el: null
      };

      waiting[floor].push(passenger);

      const area = document.getElementById(`waiting-${floor}`);
      const el = createPersonElement(passenger);
      passenger.el = el;
      area.appendChild(el);

      el.classList.add("appear");
      setTimeout(() => el.classList.remove("appear"), 320);

      updateFloorCounts();
      updateStats();
      dispatchAll();
    }

    function randomTarget(floor) {
      let target = floor;
      while (target === floor && FLOORS > 1) {
        target = Math.floor(Math.random() * FLOORS) + 1;
      }
      return target;
    }

    function randomColor() {
      return PERSON_COLORS[Math.floor(Math.random() * PERSON_COLORS.length)];
    }

    function createPersonElement(passenger, small = false) {
      const el = document.createElement("div");
      el.className = `person${small ? " small" : ""}`;
      el.style.setProperty("--person-color", passenger.color);
      el.dataset.target = String(passenger.target);
      el.innerHTML = `<div class="head"></div><div class="body"></div>`;
      attachTooltip(el, passenger.target);
      return el;
    }

    function attachTooltip(el, target) {
      el.addEventListener("mouseenter", (event) => {
        tooltipEl.textContent = `目标楼层：${target}F`;
        tooltipEl.classList.add("show");
        moveTooltip(event);
      });

      el.addEventListener("mousemove", moveTooltip);

      el.addEventListener("mouseleave", () => {
        tooltipEl.classList.remove("show");
      });
    }

    function moveTooltip(event) {
      if (!tooltipEl.classList.contains("show")) return;

      const pad = 14;
      const rect = tooltipEl.getBoundingClientRect();
      let left = event.clientX + pad;
      let top = event.clientY + pad;

      if (left + rect.width > window.innerWidth - 8) {
        left = event.clientX - rect.width - pad;
      }

      if (top + rect.height > window.innerHeight - 8) {
        top = event.clientY - rect.height - pad;
      }

      tooltipEl.style.left = `${left}px`;
      tooltipEl.style.top = `${top}px`;
    }

    function nearestDistance(elev) {
      let best = Infinity;

      for (let f = 1; f <= FLOORS; f++) {
        if (waiting[f].some((p) => !p.assignedTo)) {
          best = Math.min(best, Math.abs(elev.floor - f));
        }
      }

      return best;
    }

    function dispatchAll() {
      const idleElevators = elevators.filter((elev) => elev.state === "idle");

      idleElevators.sort((a, b) => {
        return nearestDistance(a) - nearestDistance(b);
      });

      idleElevators.forEach((elev) => {
        if (elev.state === "idle") {
          dispatchElevator(elev);
        }
      });
    }

    function dispatchElevator(elev) {
      if (elev.state !== "idle") return;

      const passenger = findNextPassenger(elev);

      if (!passenger) {
        elev.state = "idle";
        elev.targetFloor = null;
        updateElevatorStatus(elev);
        return;
      }

      passenger.assignedTo = elev.id;
      elev.state = "toPickup";
      elev.targetFloor = passenger.floor;
      updateElevatorStatus(elev);

      moveElevator(elev, passenger.floor, () => {
        if (
          waiting[passenger.floor].includes(passenger) &&
          passenger.assignedTo === elev.id
        ) {
          boardPassenger(elev, passenger);

          elev.state = "toDropoff";
          elev.targetFloor = passenger.target;
          updateElevatorStatus(elev);

          moveElevator(elev, passenger.target, () => {
            dropOff(elev, passenger);

            elev.passenger = null;
            elev.state = "idle";
            elev.targetFloor = null;
            updateCar(elev);
            updateElevatorStatus(elev);
            dispatchElevator(elev);
          });
        } else {
          passenger.assignedTo = null;
          elev.state = "idle";
          elev.targetFloor = null;
          updateElevatorStatus(elev);
          dispatchElevator(elev);
        }
      });
    }

    function findNextPassenger(elev) {
      let bestFloor = null;
      let bestDistance = Infinity;

      for (let f = 1; f <= FLOORS; f++) {
        const hasUnassigned = waiting[f].some((p) => !p.assignedTo);
        if (!hasUnassigned) continue;

        const distance = Math.abs(elev.floor - f);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestFloor = f;
        }
      }

      if (bestFloor === null) return null;

      return waiting[bestFloor].find((p) => !p.assignedTo) || null;
    }

    function moveElevator(elev, targetFloor, onArrive) {
      const distance = Math.abs(elev.floor - targetFloor);
      const duration = distance === 0 ? 0 : 450 + distance * 180;

      elev.targetFloor = targetFloor;
      updateCar(elev);
      updateElevatorStatus(elev);

      if (elev.timer) {
        clearTimeout(elev.timer);
        elev.timer = null;
      }

      if (distance === 0) {
        elev.timer = setTimeout(() => {
          elev.timer = null;
          elev.floor = targetFloor;
          updateCar(elev);
          onArrive();
        }, 120);
        return;
      }

      elev.car.style.transitionDuration = `${duration}ms`;
      elev.car.style.setProperty("--floor-index", String(FLOORS - targetFloor));

      elev.timer = setTimeout(() => {
        elev.timer = null;
        elev.floor = targetFloor;
        updateCar(elev);
        updateElevatorStatus(elev);
        onArrive();
      }, duration);
    }

    function boardPassenger(elev, passenger) {
      const index = waiting[passenger.floor].indexOf(passenger);
      if (index >= 0) {
        waiting[passenger.floor].splice(index, 1);
      }

      if (passenger.el) {
        const el = passenger.el;
        el.classList.add("boarding");
        setTimeout(() => el.remove(), 280);
        passenger.el = null;
      }

      passenger.assignedTo = null;
      elev.passenger = passenger;

      const carPassenger = elev.car.querySelector(".car-passenger");
      carPassenger.innerHTML = "";

      const personEl = createPersonElement(passenger, true);
      carPassenger.appendChild(personEl);

      elev.car.classList.add("has-passenger");

      tooltipEl.classList.remove("show");

      updateCar(elev);
      updateFloorCounts();
      updateStats();
    }

    function dropOff(elev, passenger) {
      const carPassenger = elev.car.querySelector(".car-passenger");
      if (carPassenger) carPassenger.innerHTML = "";

      elev.car.classList.remove("has-passenger");
      delivered++;

      const row = document.querySelector(`.floor-row[data-floor="${passenger.target}"]`);
      if (row) {
        row.classList.add("pulse");
        setTimeout(() => row.classList.remove("pulse"), 520);
      }

      updateStats();
    }

    function resetSimulation() {
      tooltipEl.classList.remove("show");

      elevators.forEach((elev) => {
        if (elev.timer) {
          clearTimeout(elev.timer);
          elev.timer = null;
        }

        elev.state = "idle";
        elev.floor = 1;
        elev.targetFloor = null;
        elev.passenger = null;
        elev.assignedTo = null;

        elev.car.style.transitionDuration = "0ms";
        elev.car.style.setProperty("--floor-index", String(FLOORS - 1));
        elev.car.classList.remove("has-passenger");

        const carPassenger = elev.car.querySelector(".car-passenger");
        if (carPassenger) carPassenger.innerHTML = "";

        updateCar(elev);
        updateElevatorStatus(elev);
      });

      for (let f = 1; f <= FLOORS; f++) {
        waiting[f].forEach((passenger) => {
          if (passenger.el) passenger.el.remove();
        });
        waiting[f] = [];

        const area = document.getElementById(`waiting-${f}`);
        if (area) area.innerHTML = "";
      }

      delivered = 0;
      passengerId = 0;

      updateFloorCounts();
      updateStats();
    }

    init();
  </script>
</body>
</html>
