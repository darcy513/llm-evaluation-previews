<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONO 3D · 双时区平滑扫秒腕表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0f17; overflow: hidden;
         font-family: -apple-system, "SF Mono", "Roboto Mono", Consolas, monospace; }
  canvas { display: block; }

  #ui {
    position: absolute; top: 24px; left: 24px; pointer-events: none;
    background: rgba(16,22,36,.65); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,210,127,.25); border-radius: 14px;
    padding: 20px 24px; color: #e8eefc; min-width: 268px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  #ui h1 { font-size: 14px; letter-spacing: 3px; color: #ffd27f; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; align-items: baseline;
         margin: 8px 0; font-size: 11px; color: #8fa6c8; letter-spacing: 1px; }
  .row strong { font-size: 19px; color: #fff; font-variant-numeric: tabular-nums; }
  .legend { margin-top: 18px; padding-top: 14px; font-size: 11px; line-height: 2.1;
            color: #a8b8d0; border-top: 1px solid rgba(255,255,255,.08); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
              margin-right: 9px; vertical-align: middle; }
  #ui p { margin-top: 14px; font-size: 10px; color: #63779a; letter-spacing: .5px; }

  #loading { position: absolute; inset: 0; z-index: 10; background: #0b0f17;
    display: flex; align-items: center; justify-content: center;
    color: #ffd27f; font-size: 13px; letter-spacing: 3px; transition: opacity .6s; }
</style>
</head>
<body>

<div id="loading">INITIALIZING MOVEMENT...</div>

<div id="ui">
  <h1>CHRONO 3D</h1>
  <div class="row"><span>LOCAL / 本地</span><strong id="loc">--:--:--</strong></div>
  <div class="row"><span>UTC / 第二时区</span><strong id="utc">--:--:--</strong></div>
  <div class="legend">
    <i style="background:#ff2244"></i> 本地秒针（平滑扫动）<br>
    <i style="background:#2299ff"></i> GMT 针（外圈 24H / UTC）<br>
    <i style="background:#ffd27f"></i> 6 点位 UTC 子盘
  </div>
  <p>🖱️ 拖拽旋转表壳 · 滚轮缩放 · 3 点位为星期 / 日期</p>
</div>

<!-- 使用 UMD 构建，无需本地服务器，file:// 双击直接运行 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ============================================================
   1. 场景 / 渲染器 / 相机 / 灯光
   ============================================================ */
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.setClearColor(0x0b0f17);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 6.4, 6.6);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2.05;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff4e0, 1.3);
key.position.set(3, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.45);
fill.position.set(-5, 3, -4);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.35;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   2. 表盘贴图（Canvas → CanvasTexture）
   ============================================================ */
const dc = document.createElement('canvas');
dc.width = dc.height = 1024;
const g = dc.getContext('2d');
const C = 512, R = 500;

const grad = g.createRadialGradient(C, C, 0, C, C, R);
grad.addColorStop(0, '#1e2b4d');
grad.addColorStop(1, '#090d18');
g.fillStyle = grad; g.fillRect(0, 0, 1024, 1024);

// 外圈 24 小时 GMT 刻度
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2 - Math.PI / 2;
  g.beginPath();
  g.moveTo(C + Math.cos(a) * 440, C + Math.sin(a) * 440);
  g.lineTo(C + Math.cos(a) * 478, C + Math.sin(a) * 478);
  g.strokeStyle = '#5b7fb5'; g.lineWidth = i % 2 ? 3 : 6; g.stroke();
  if (i % 2 === 0) {
    g.fillStyle = '#8fb0e0'; g.font = '20px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(i === 0 ? '24' : i, C + Math.cos(a) * 408, C + Math.sin(a) * 408);
  }
}

// 12 小时金色时标
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
  g.save();
  g.translate(C + Math.cos(a) * 365, C + Math.sin(a) * 365);
  g.rotate(a + Math.PI / 2);
  g.fillStyle = '#ffd27f';
  if (i === 0) {
    g.beginPath(); g.moveTo(0, -19); g.lineTo(14, 15); g.lineTo(-14, 15); g.fill();
  } else g.fillRect(-6, -20, 12, 40);
  g.restore();
}

// 品牌文字
g.fillStyle = '#bcd4ff'; g.textAlign = 'center';
g.font = 'bold 36px sans-serif'; g.fillText('CHRONO 3D', C, C - 165);
g.font = '22px sans-serif'; g.fillStyle = '#7e9ac4';
g.fillText('DUAL TIME  ·  SWEEP', C, C - 125);

// 6 点位 UTC 子盘
const SY = C + 230;
g.beginPath(); g.arc(C, SY, 150, 0, Math.PI * 2);
g.fillStyle = '#111a30'; g.fill();
g.strokeStyle = '#ffd27f'; g.lineWidth = 4; g.stroke();
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
  g.beginPath();
  g.moveTo(C + Math.cos(a) * 124, SY + Math.sin(a) * 124);
  g.lineTo(C + Math.cos(a) * 140, SY + Math.sin(a) * 140);
  g.strokeStyle = '#8fb0e0'; g.lineWidth = 3; g.stroke();
}
g.fillStyle = '#ff8899'; g.font = 'bold 22px sans-serif';
g.fillText('UTC', C, SY + 62);

// 3 点位 星期 / 日期 窗框
g.strokeStyle = '#ffd27f'; g.lineWidth = 6;
g.strokeRect(C + 230, C - 75, 110, 60);
g.strokeRect(C + 230, C + 15, 110, 60);

const dialTex = new THREE.CanvasTexture(dc);

/* ============================================================
   3. 完整 3D 表体
   ============================================================ */
const steel = new THREE.MeshStandardMaterial({ color: 0x9aa3b2, metalness: 0.95, roughness: 0.22 });
const gold  = new THREE.MeshStandardMaterial({ color: 0xffd27f, metalness: 1.0,  roughness: 0.15 });

// 表壳
const caseMesh = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.4, 64), steel);
caseMesh.castShadow = caseMesh.receiveShadow = true;
scene.add(caseMesh);

// 表圈
const bezel = new THREE.Mesh(new THREE.TorusGeometry(2.02, 0.14, 16, 64), gold);
bezel.rotation.x = -Math.PI / 2; bezel.position.y = 0.2;
bezel.castShadow = true; scene.add(bezel);

// 表盘
const dial = new THREE.Mesh(
  new THREE.CircleGeometry(2.0, 64),
  new THREE.MeshStandardMaterial({ map: dialTex, roughness: 0.65, metalness: 0.15 })
);
dial.rotation.x = -Math.PI / 2; dial.position.y = 0.21;
dial.receiveShadow = true; scene.add(dial);

// 表冠 (3 点)
const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.32, 24), steel);
crown.rotation.z = Math.PI / 2; crown.position.set(2.3, 0, 0);
crown.castShadow = true; scene.add(crown);

// 表耳 + 表带
const leather = new THREE.MeshStandardMaterial({ color: 0x2a1d18, roughness: 0.85 });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const lug = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.62), steel);
  lug.position.set(sx * 0.86, 0, sz * 2.0);
  lug.rotation.y = sx * sz * 0.2; lug.castShadow = true; scene.add(lug);
}
[[-2.8, -0.15], [2.8, 0.15]].forEach(([z, rx]) => {
  const s = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 2.2), leather);
  s.position.set(0, -0.1, z); s.rotation.x = rx;
  s.castShadow = s.receiveShadow = true; scene.add(s);
});

/* --- 指针工厂（几何体偏移，使旋转轴心正好在表中心） --- */
function makeHand(len, wid, color, y, isGMT = false) {
  const grp = new THREE.Group(); grp.position.y = y;
  const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.9, roughness: 0.18 });

  const bar = new THREE.BoxGeometry(wid, 0.025, len + 0.25);
  bar.translate(0, 0, -(len - 0.25) / 2);   // 尖端 -len，尾部 +0.25
  const m = new THREE.Mesh(bar, mat); m.castShadow = true; grp.add(m);

  const cw = new THREE.Mesh(new THREE.CylinderGeometry(wid * 1.9, wid * 1.9, 0.025, 16), mat);
  cw.position.z = 0.18; grp.add(cw);

  if (isGMT) { // 箭头尖
    const tip = new THREE.Mesh(new THREE.ConeGeometry(wid * 2.6, 0.24, 8), mat);
    tip.rotation.x = -Math.PI / 2; tip.position.z = -len + 0.02;
    grp.add(tip);
  }
  return grp;
}

// 本地时间指针
const hourHand = makeHand(1.10, 0.075, 0xe6ecf5, 0.26);
const minHand  = makeHand(1.55, 0.050, 0xe6ecf5, 0.30);
const secHand  = makeHand(1.75, 0.018, 0xff2244, 0.34);
// GMT 24H 指针
const gmtHand  = makeHand(1.92, 0.032, 0x2299ff, 0.38, true);
scene.add(hourHand, minHand, secHand, gmtHand);

// 中心轴帽
const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 24), gold);
cap.position.y = 0.41; scene.add(cap);

// 6 点位 UTC 子盘指针（独立轴心）
const utcGrp = new THREE.Group();
utcGrp.position.set(0, 0.24, 0.9);           // 对应贴图 SY = C+230
const uH = makeHand(0.38, 0.045, 0xffd27f, 0.00);
const uM = makeHand(0.55, 0.030, 0xe6ecf5, 0.03);
const uS = makeHand(0.62, 0.014, 0xff5566, 0.06);
const uCap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.03, 16), gold);
uCap.position.y = 0.08;
utcGrp.add(uH, uM, uS, uCap); scene.add(utcGrp);

/* --- 星期 / 日期 动态窗口 --- */
function makeWindow(x, z) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.43, 0.23),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.225, z);
  scene.add(mesh);
  return { ctx, tex, last: '' };
}
const dayWin  = makeWindow(1.113, -0.176);
const dateWin = makeWindow(1.113,  0.176);

function setWindow(w, txt) {
  if (w.last === txt) return;              // 仅变化时重绘，省性能
  w.last = txt;
  w.ctx.fillStyle = '#f6f7fa'; w.ctx.fillRect(0, 0, 256, 128);
  w.ctx.fillStyle = '#141821'; w.ctx.font = 'bold 74px sans-serif';
  w.ctx.textAlign = 'center'; w.ctx.textBaseline = 'middle';
  w.ctx.fillText(txt, 128, 68);
  w.tex.needsUpdate = true;
}

// 蓝宝石玻璃（depthWrite:false 避免透明排序遮挡指针）
const crystal = new THREE.Mesh(
  new THREE.CylinderGeometry(2.0, 2.0, 0.02, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0xbcd4ff, metalness: 0.1, roughness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.0,
    transparent: true, opacity: 0.12, depthWrite: false
  })
);
crystal.position.y = 0.46; scene.add(crystal);

/* ============================================================
   4. 时间驱动（毫秒级插值 → 平滑扫秒）
   ============================================================ */
const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const TAU = Math.PI * 2;
const elLoc = document.getElementById('loc');
const elUtc = document.getElementById('utc');
let lastSec = -1;

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const now = new Date();
  const ms = now.getMilliseconds();

  // 本地（连续量，非跳格）
  const s = now.getSeconds() + ms / 1000;
  const m = now.getMinutes() + s / 60;
  const h = (now.getHours() % 12) + m / 60;

  secHand.rotation.y  = -(s / 60) * TAU;
  minHand.rotation.y  = -(m / 60) * TAU;
  hourHand.rotation.y = -(h / 12) * TAU;

  // 第二时区 UTC
  const uS = now.getUTCSeconds() + ms / 1000;
  const uM = now.getUTCMinutes() + uS / 60;
  const uH24 = now.getUTCHours() + uM / 60;

  gmtHand.rotation.y = -(uH24 / 24) * TAU;   // 外圈 24H
  uH.rotation.y = -((uH24 % 12) / 12) * TAU; // 子盘 12H
  uM.rotation.y = -(uM / 60) * TAU;
  uS.rotation.y = -(uS / 60) * TAU;

  // 日历
  setWindow(dayWin, DAYS[now.getDay()]);
  setWindow(dateWin, String(now.getDate()).padStart(2, '0'));

  // 数字校验面板（每秒刷一次即可）
  if (now.getSeconds() !== lastSec) {
    lastSec = now.getSeconds();
    elLoc.textContent = now.toLocaleTimeString('en-GB');
    elUtc.textContent = now.toISOString().substring(11, 19);
  }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 启动
const ld = document.getElementById('loading');
ld.style.opacity = '0';
setTimeout(() => ld.remove(), 600);
animate();
</script>
</body>
</html>
